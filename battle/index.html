<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Battle des profs</title>
<meta name="theme-color" content="#101a36">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icones/battle-192.png">
<link rel="apple-touch-icon" href="../icones/eps-180.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
html,body,button,a,input,label,select{touch-action:manipulation}
:root{--fond:#101a36;--panneau:rgba(16,26,54,.92);--jaune:#ffd23f;--rouge:#ef3e4a;--vert:#2ec27e;--bleu:#3a86ff;--clair:#f4f1e8;--gris:#9aa6c4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--fond);color:var(--clair);font:16px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{position:fixed;inset:0}
canvas#jeu{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#sonde{position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);visibility:hidden;pointer-events:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.ecran{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:radial-gradient(circle at 50% 18%,rgba(44,78,170,.94),rgba(10,16,38,.96) 65%);padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 24px);display:none;text-align:center;z-index:5}
.ecran.on{display:block}
.boite{max-width:440px;margin:0 auto}
.eps-retour{display:inline-block;padding:6px 0;font:600 14px system-ui,-apple-system,sans-serif;color:var(--gris);text-decoration:none;float:left}
h1.titre{clear:both;margin:14px 0 0;font-size:40px;line-height:1;font-weight:900;letter-spacing:-.02em;text-transform:uppercase;color:var(--jaune);text-shadow:0 3px 0 #c2410c,0 6px 14px rgba(0,0,0,.5);transform:rotate(-3deg);animation:tampon .6s cubic-bezier(.2,1.6,.4,1) both}
.defi{margin:10px 0 6px;font-weight:700;color:var(--clair);opacity:.9}
.defi b{background:var(--rouge);color:#fff;padding:2px 8px;border-radius:999px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin-right:6px}
@keyframes tampon{from{transform:scale(2.4) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(-3deg);opacity:1}}
.boss{position:relative;margin:18px auto 10px;padding:16px 12px 14px;border-radius:22px;background:linear-gradient(160deg,#2b3a6b,#16224a);border:3px solid var(--jaune);box-shadow:0 10px 30px rgba(0,0,0,.45);animation:chute .8s .2s cubic-bezier(.2,1.5,.4,1) both}
@keyframes chute{from{transform:translateY(-120%) rotate(8deg);opacity:0}to{transform:none;opacity:1}}
.boss .lbl{font-weight:900;letter-spacing:.08em;color:var(--rouge);background:var(--jaune);display:inline-block;padding:3px 12px;border-radius:8px;transform:rotate(-2deg);animation:clign 1s 1s steps(2) infinite}
@keyframes clign{50%{background:#fff}}
.photo{width:132px;height:132px;border-radius:50%;object-fit:cover;border:5px solid var(--jaune);background:#fff;display:block;margin:12px auto 6px;box-shadow:0 0 0 6px rgba(255,210,63,.25)}
.boss .photo{animation:tourne 1s .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes tourne{from{transform:rotate(-540deg) scale(0)}to{transform:none}}
.couronne{position:absolute;left:50%;top:38px;font-size:40px;transform:translateX(-50%) rotate(-12deg);animation:couronne 1.6s 1.3s ease-in-out infinite both;z-index:2}
@keyframes couronne{0%,100%{transform:translate(-50%,0) rotate(-12deg)}50%{transform:translate(-50%,-8px) rotate(10deg)}}
.boss .nom{font-size:24px;font-weight:900;margin-top:4px;word-break:break-word}
.boss .sc{font-size:20px;font-weight:800;color:var(--jaune)}
.top{list-style:none;margin:8px auto 0;padding:0;text-align:left}
.top li{display:flex;gap:10px;align-items:center;padding:8px 12px;margin:6px 0;border-radius:12px;background:rgba(255,255,255,.08);animation:glisse .4s both}
.top li .rg{font-weight:900;width:26px;color:var(--jaune)}
.top li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.top li .s{font-weight:800;font-variant-numeric:tabular-nums}
.top li .d{font-size:12px;color:var(--gris);width:40px;text-align:right}
@keyframes glisse{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.etat{font-size:13px;color:var(--gris);margin:8px 0}
.gros{display:block;width:100%;margin:14px 0 6px;padding:16px;border:0;border-radius:18px;background:var(--rouge);color:#fff;font-size:26px;font-weight:900;letter-spacing:.06em;box-shadow:0 6px 0 #9b1c26,0 10px 20px rgba(0,0,0,.4);text-transform:uppercase}
.gros:active{transform:translateY(4px);box-shadow:0 2px 0 #9b1c26}
.gros.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.btn{display:block;width:100%;margin:8px 0;padding:13px;border-radius:14px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);font-weight:800;font-size:17px}
.btn.jaune{background:var(--jaune);color:#2a1a00;border-color:var(--jaune)}
.btn.vert{background:var(--vert);color:#fff;border-color:var(--vert)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5}
.aide{font-size:13px;color:var(--gris);margin:10px 0 0}
h2{font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--gris);margin:18px 0 4px}
.champ{width:100%;padding:13px 14px;border-radius:14px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);font-size:18px;font-weight:700;text-align:center;-webkit-user-select:text;user-select:text}
.score-fin{font-size:46px;font-weight:900;color:var(--jaune);text-shadow:0 3px 0 #c2410c;margin:4px 0;font-variant-numeric:tabular-nums}
.bandeau{font-size:34px;font-weight:900;text-transform:uppercase;margin:24px 0 4px;line-height:1.05}
.bandeau.boss-n{color:var(--jaune);animation:tampon .7s cubic-bezier(.2,1.6,.4,1) both,arcenciel 1.5s .7s linear infinite}
@keyframes arcenciel{0%,100%{color:var(--jaune)}33%{color:#7cf}66%{color:#ff8fab}}
.msg{margin:10px 0;padding:10px;border-radius:12px;background:rgba(255,255,255,.1);font-weight:700}
.msg.ok{background:rgba(46,194,126,.25)}
.msg.ko{background:rgba(239,62,74,.25)}
.scene{position:relative;height:272px;margin:16px 0 6px}
.bulle{position:absolute;left:50%;top:0;transform:translateX(-50%);background:#fff;color:#1b1b1b;font-weight:900;font-size:19px;padding:10px 16px;border-radius:18px;max-width:300px;width:max-content;animation:bulle .5s .5s cubic-bezier(.2,1.6,.4,1) both;z-index:2}
.bulle:after{content:"";position:absolute;left:50%;bottom:-12px;border:12px solid transparent;border-top-color:#fff;border-bottom:0;margin-left:-12px}
@keyframes bulle{from{transform:translateX(-50%) scale(0)}to{transform:translateX(-50%) scale(1)}}
.moqueur{position:absolute;left:50%;top:78px;margin-left:-80px;width:160px;height:160px;animation:rebond .7s cubic-bezier(.3,0,.7,1) infinite alternate}
.moqueur .photo{width:160px;height:160px;margin:0;animation:gigote 1.4s ease-in-out infinite}
@keyframes rebond{from{transform:translateY(-20px)}to{transform:translateY(12px) scaleY(.92)}}
@keyframes gigote{0%{transform:rotate(-14deg)}25%{transform:rotate(12deg) scale(1.05)}50%{transform:rotate(-8deg)}70%{transform:rotate(360deg)}100%{transform:rotate(346deg)}}
.langue{position:absolute;left:50%;top:180px;font-size:34px;transform:translateX(-50%);animation:gigote 1s infinite}
.manque{color:var(--gris);font-weight:700}
.apercu{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid var(--jaune);margin:10px auto;display:none}
.photo-btn{position:relative;overflow:hidden}
.photo-btn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
#confettis{position:fixed;inset:0;pointer-events:none;z-index:6}
#pause{position:fixed;right:calc(env(safe-area-inset-right) + 8px);top:calc(env(safe-area-inset-top) + 8px);z-index:3;width:42px;height:42px;border-radius:12px;border:2px solid rgba(255,255,255,.25);background:rgba(16,26,54,.6);font-weight:900;font-size:16px;display:none}
.cache{display:none!important}
</style>
</head>
<body>
<canvas id="jeu"></canvas>
<div id="sonde"></div>
<button id="pause" aria-label="Pause">II</button>
<canvas id="confettis"></canvas>

<section id="accueil" class="ecran on">
  <div class="boite">
    <a class="eps-retour" href="../">‹ Mes applis</a>
    <h1 class="titre">Battle des profs</h1>
    <div class="defi"><b>Octobre</b>Flipper de l'école</div>
    <div id="bloc-boss"></div>
    <button class="gros pulse" id="jouer">Jouer</button>
    <div class="etat" id="etat"></div>
    <h2>Top 5 des collègues</h2>
    <ol class="top" id="top5"></ol>
    <p class="aide">Touche à gauche = flipper gauche · à droite = flipper droit.<br>Fais tomber <b>E-P-S</b> pour la récré multiballe !</p>
  </div>
</section>

<section id="pause-ecran" class="ecran">
  <div class="boite">
    <div class="bandeau">Temps mort</div>
    <button class="gros" id="reprendre">Reprendre</button>
    <button class="btn" id="abandon">Abandonner la partie</button>
  </div>
</section>

<section id="fin" class="ecran">
  <div class="boite" id="fin-boite"></div>
</section>

<script>
'use strict';
const JEU = 'flipper-2026-10';
const URL_SCRIPT = (() => { try { return localStorage.getItem('eps-script') || ''; } catch (e) { return ''; } })();
const CODE = (() => { try { return localStorage.getItem('eps-code') || ''; } catch (e) { return ''; } })();
const CLASSEMENT_OK = !!(URL_SCRIPT && CODE);

const $ = id => document.getElementById(id);
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function lsGetTxt(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function lsSetTxt(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
const fmt = n => Math.round(n).toLocaleString('fr-FR').replace(/ | /g, ' ');
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const photoOk = p => typeof p === 'string' && /^data:image\/(jpeg|jpg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p);

// Avatar de remplacement (prof à moustache avec sifflet)
const AVATAR = 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" fill="#3a86ff"/><circle cx="60" cy="66" r="38" fill="#f2c79b"/><path d="M22 52 Q60 8 98 52 Q60 36 22 52Z" fill="#ef3e4a"/><rect x="18" y="48" width="84" height="8" rx="4" fill="#c1121f"/><rect x="34" y="58" width="22" height="13" rx="5" fill="#111"/><rect x="64" y="58" width="22" height="13" rx="5" fill="#111"/><rect x="55" y="62" width="10" height="3" fill="#111"/><path d="M38 84 Q49 76 60 84 Q71 76 82 84 Q71 92 60 87 Q49 92 38 84Z" fill="#5a3311"/><circle cx="60" cy="98" r="6" fill="#bbb" stroke="#555" stroke-width="2"/><path d="M60 104 L60 120" stroke="#ffd23f" stroke-width="3"/></svg>`);

// ---------------------------------------------------------------- Son
let AC = null, MASTER = null, BRUIT = null;
function audio() {
  try {
    if (!AC) {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      AC = new C(); MASTER = AC.createGain(); MASTER.gain.value = 0.5; MASTER.connect(AC.destination);
      BRUIT = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
      const d = BRUIT.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { return null; }
  return AC;
}
function ton(type, f0, f1, dur, vol, delai = 0, filtre = 0) {
  if (!AC) return; const t = AC.currentTime + delai;
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type;
  o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let n = o; if (filtre) { const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filtre; o.connect(f); n = f; }
  n.connect(g); g.connect(MASTER); o.start(t); o.stop(t + dur + 0.02);
}
function bruit(dur, vol, freq, q = 1, delai = 0) {
  if (!AC) return; const t = AC.currentTime + delai;
  const s = AC.createBufferSource(); s.buffer = BRUIT; const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(MASTER); s.start(t, Math.random() * 0.3); s.stop(t + dur + 0.02);
}
function sifflet(t0 = 0, dur = 0.5, f = 2900) {
  if (!AC) return; const t = AC.currentTime + t0;
  const o = AC.createOscillator(), lfo = AC.createOscillator(), lg = AC.createGain(), g = AC.createGain();
  o.type = 'sine'; o.frequency.value = f; lfo.type = 'square'; lfo.frequency.value = 32; lg.gain.value = 240;
  lfo.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.28, t + 0.02); g.gain.setValueAtTime(0.28, t + dur - 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(MASTER); o.start(t); lfo.start(t); o.stop(t + dur + 0.02); lfo.stop(t + dur + 0.02);
}
const SON = {
  bumper() { const f = rnd(650, 950); ton('square', f, f * 0.6, 0.05, 0.18, 0, 3000); ton('square', f * 1.2, f * 0.7, 0.05, 0.15, 0.06, 3000); bruit(0.03, 0.4, 3500, 2); },
  flip() { bruit(0.06, 0.6, 1500, 0.8); ton('triangle', 180, 60, 0.07, 0.35); },
  sling() { ton('sine', 180, 520, 0.09, 0.3); bruit(0.03, 0.3, 2500, 2); },
  cible() { bruit(0.04, 0.5, 900, 1.5); ton('square', 1300, 1300, 0.05, 0.12, 0.02, 4000); ton('square', 1750, 1750, 0.07, 0.12, 0.08, 4000); },
  bulletin() { ton('triangle', 880, 880, 0.08, 0.2); ton('triangle', 1320, 1320, 0.1, 0.2, 0.06); },
  lance() { bruit(0.25, 0.5, 600, 0.6); ton('sawtooth', 90, 400, 0.22, 0.12, 0, 900); },
  orbite() { ton('square', 300, 1400, 0.35, 0.12, 0, 2500); },
  cantine() { for (let i = 0; i < 3; i++) ton('sine', 520 - i * 60, 180, 0.13, 0.35, i * 0.14); },
  ejecte() { ton('sine', 120, 700, 0.12, 0.35); bruit(0.05, 0.4, 1200, 1); },
  multi() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => ton('square', f, f, 0.12, 0.13, i * 0.09, 3500)); sifflet(0.6, 0.25); },
  sauve() { ton('triangle', 660, 990, 0.15, 0.25); ton('triangle', 990, 1320, 0.15, 0.25, 0.12); },
  perdu() { sifflet(0, 0.16); sifflet(0.24, 0.6, 2700); },
  combo(n) { ton('square', 500 + n * 120, 900 + n * 160, 0.12, 0.12, 0, 3000); },
  fin() { [392, 370, 349, 330].forEach((f, i) => ton('sawtooth', f, i === 3 ? f * 0.92 : f, i === 3 ? 0.9 : 0.32, 0.18, i * 0.36, 1100)); },
  fanfare() { [[523, 0], [659, .12], [784, .24], [1047, .36], [784, .6], [1047, .72]].forEach(([f, d]) => { ton('square', f, f, d === .72 ? 0.7 : 0.14, 0.12, d, 3000); ton('triangle', f / 2, f / 2, 0.2, 0.15, d); }); },
  clic() { ton('triangle', 900, 600, 0.05, 0.15); }
};
function vib(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

// ---------------------------------------------------------------- Table (unités logiques 400 x 730)
const TW = 400, TH = 730, R = 9, G = 1250, VMAX = 2200;
const segs = [];
function seg(ax, ay, bx, by, o = {}) { const s = Object.assign({ ax, ay, bx, by, e: 0.45, kick: 0, type: 'mur', on: true, epais: 0 }, o); segs.push(s); return s; }
// arc du haut
const ARC = [];
for (let i = 0; i <= 30; i++) { const a = Math.PI + Math.PI * i / 30; ARC.push([200 + 190 * Math.cos(a), 200 + 190 * Math.sin(a)]); }
for (let i = 0; i < ARC.length - 1; i++) seg(ARC[i][0], ARC[i][1], ARC[i + 1][0], ARC[i + 1][1]);
seg(10, 200, 10, 530); seg(10, 530, 104, 626);
seg(390, 200, 390, 712); seg(358, 708, 392, 708, { e: 0.2 });
seg(360, 262, 360, 300); const BULL = seg(360, 300, 360, 420, { type: 'bulletin', e: 0.55 }); seg(360, 420, 360, 712);
seg(360, 530, 266, 626);
{ const dx = 30, dy = -36, l = Math.hypot(dx, dy); seg(360, 262, 390, 226, { oneWay: true, nx: dy / l, ny: -dx / l }); }
seg(52, 238, 52, 430, { epais: 2 });
{ const dx = 42, dy = 33, l = Math.hypot(dx, dy); seg(10, 205, 52, 238, { oneWay: true, nx: dy / l, ny: -dx / l, e: 0.4 }); }
// slingshots
function sling(m) { const X = x => m ? 370 - x : x; seg(X(60), 465, X(60), 535); seg(X(60), 535, X(100), 572); return seg(X(60), 465, X(100), 572, { type: 'sling', kick: 480, e: 0.3 }); }
const SL = [sling(false), sling(true)];
// cibles E P S
const EPS = ['E', 'P', 'S'].map((l, i) => seg(150 + i * 35 - 12, 410, 150 + i * 35 + 12, 410, { type: 'eps', lettre: l, epais: 4, e: 0.35, bas: false }));
// bumpers
const BUMP = [
  { x: 120, y: 215, r: 22, type: 'basket' }, { x: 250, y: 215, r: 22, type: 'foot' },
  { x: 185, y: 140, r: 22, type: 'sifflet' }, { x: 185, y: 285, r: 22, type: 'chrono' }
].map(b => Object.assign(b, { flash: 0, cd: 0 }));
const TROU = { x: 302, y: 305, r: 13 };
const ORBITE_Y = 330;
// flippers
function flipper(px, py, cote) { return { px, py, cote, L: 62, a: 0.5, w: 0, appui: false }; }
const FL = [flipper(112, 632, 1), flipper(258, 632, -1)];
const A_REPOS = 0.5, A_HAUT = -0.48;
function flipAngle(f) { return f.cote === 1 ? f.a : Math.PI - f.a; }

// ---------------------------------------------------------------- État de jeu
let etat = 'accueil';
let balles = [], score = 0, balleNo = 1, mult = 1, bulletin = 0, multiball = false;
let sauveT = 0, temps = 0, comboN = 0, comboT = -9, basketHits = [], attenteBalle = 0, finT = 0;
let popups = [], particules = [], grandMsg = null, secousse = 0, flash = 0;
let lancePret = 0, lanceDemande = false, epsReset = 0;

function nouvelleBalle(nouvelle = true) { balles.push({ x: 375, y: 698, vx: 0, vy: 0, tient: 0, ignoreTrou: 0, neuve: nouvelle, immobile: 0 }); lancePret = 0; }
function nouvellePartie() {
  balles = []; score = 0; balleNo = 1; mult = 1; bulletin = 0; multiball = false; sauveT = 0; comboN = 0; comboT = -9;
  popups = []; particules = []; grandMsg = null; EPS.forEach(c => { c.bas = false; c.on = true; }); epsReset = 0; attenteBalle = 0;
  FL.forEach(f => { f.a = A_REPOS; f.w = 0; f.appui = false; });
  nouvelleBalle(true); etat = 'jeu'; $('pause').style.display = 'block';
}
function points(n, x, y) {
  const p = n * mult * (multiball ? 2 : 1); score += p;
  if (x != null) popups.push({ t: '+' + fmt(p), x, y, v: 0, age: 0, vie: 0.8, petit: true });
}
function blague(t, x, y, coul) { popups.push({ t, x: Math.min(Math.max(x, 90), 280), y, age: 0, vie: 1.4, coul: coul || '#ffd23f' }); }
function annonce(t, sous, coul) { grandMsg = { t, sous, age: 0, vie: 2.2, coul: coul || '#ffd23f' }; }
function tir(nom, x, y) {
  if (temps - comboT < 3.2) comboN++; else comboN = 1; comboT = temps;

// ---------------------------------------------------------------- Photo
function photoVersData(file) {
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const cote = Math.min(img.naturalWidth, img.naturalHeight), sx = (img.naturalWidth - cote) / 2, sy = (img.naturalHeight - cote) / 2;
      let taille = Math.min(240, cote), q = 0.6, data = '';
      for (let i = 0; i < 12; i++) {
        const c = document.createElement('canvas'); c.width = c.height = taille;
        c.getContext('2d').drawImage(img, sx, sy, cote, cote, 0, 0, taille, taille);
        data = c.toDataURL('image/jpeg', q);
        if (data.length < 48000) return ok(data);
        if (q > 0.35) q -= 0.1; else { taille = Math.round(taille * 0.8); q = 0.5; }
      }
      ko(new Error('trop gros'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error('image illisible')); };
    img.src = url;
  });
}

  const cols = ['#ffd23f', '#ef3e4a', '#3a86ff', '#2ec27e', '#ff8fab', '#fff'];
  let ps = Array.from({ length: n }, () => ({ x: rnd(0, CW), y: rnd(-CH * 0.5, -10), vx: rnd(-60, 60), vy: rnd(120, 300), a: rnd(0, 6), va: rnd(-8, 8), c: pick(cols), w: rnd(6, 11) }));
  let t0 = performance.now(), last = t0;
  (function f(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t; x.clearRect(0, 0, CW, CH);
    for (const p of ps) { p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.va * dt; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); x.restore(); }
    if (t - t0 < 4500) requestAnimationFrame(f); else x.clearRect(0, 0, CW, CH);
  })(t0);
}

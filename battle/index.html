<!doctype html>
<html lang="fr">
<head>
<script src="acces.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Battle des profs</title>
<meta name="theme-color" content="#101a36">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icones/battle-192.png">
<link rel="apple-touch-icon" href="../icones/battle-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Battle profs">
<style>
html,body,button,a,input,label,select{touch-action:manipulation}
:root{--fond:#101a36;--panneau:rgba(16,26,54,.92);--jaune:#ffd23f;--rouge:#ef3e4a;--vert:#2ec27e;--bleu:#3a86ff;--clair:#f4f1e8;--gris:#9aa6c4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--fond);color:var(--clair);font:16px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{position:fixed;inset:0}
canvas#jeu{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#sonde{position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);visibility:hidden;pointer-events:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.ecran{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:radial-gradient(circle at 50% 18%,rgba(44,78,170,.94),rgba(10,16,38,.96) 65%);padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 24px);display:none;text-align:center;z-index:5}
.ecran.on{display:block}
.boite{max-width:440px;margin:0 auto}
.eps-retour{display:inline-block;padding:6px 0;font:600 14px system-ui,-apple-system,sans-serif;color:var(--gris);text-decoration:none;float:left}
h1.titre{clear:both;margin:14px 0 0;font-size:40px;line-height:1;font-weight:900;letter-spacing:-.02em;text-transform:uppercase;color:var(--jaune);text-shadow:0 3px 0 #c2410c,0 6px 14px rgba(0,0,0,.5);transform:rotate(-3deg);animation:tampon .6s cubic-bezier(.2,1.6,.4,1) both}
.defi{margin:10px 0 6px;font-weight:700;color:var(--clair);opacity:.9}
.defi b{background:var(--rouge);color:#fff;padding:2px 8px;border-radius:999px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin-right:6px}
@keyframes tampon{from{transform:scale(2.4) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(-3deg);opacity:1}}
.boss{position:relative;margin:18px auto 10px;padding:16px 12px 14px;border-radius:22px;background:linear-gradient(160deg,#2b3a6b,#16224a);border:3px solid var(--jaune);box-shadow:0 10px 30px rgba(0,0,0,.45);animation:chute .8s .2s cubic-bezier(.2,1.5,.4,1) both}
@keyframes chute{from{transform:translateY(-120%) rotate(8deg);opacity:0}to{transform:none;opacity:1}}
.boss .lbl{font-weight:900;letter-spacing:.08em;color:var(--rouge);background:var(--jaune);display:inline-block;padding:3px 12px;border-radius:8px;transform:rotate(-2deg);animation:clign 1s 1s steps(2) infinite}
@keyframes clign{50%{background:#fff}}
.photo{width:132px;height:132px;border-radius:50%;object-fit:cover;border:5px solid var(--jaune);background:#fff;display:block;margin:12px auto 6px;box-shadow:0 0 0 6px rgba(255,210,63,.25)}
.boss .photo{animation:tourne 1s .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes tourne{from{transform:rotate(-540deg) scale(0)}to{transform:none}}
.couronne{position:absolute;left:50%;top:38px;font-size:40px;transform:translateX(-50%) rotate(-12deg);animation:couronne 1.6s 1.3s ease-in-out infinite both;z-index:2}
@keyframes couronne{0%,100%{transform:translate(-50%,0) rotate(-12deg)}50%{transform:translate(-50%,-8px) rotate(10deg)}}
.boss .nom{font-size:24px;font-weight:900;margin-top:4px;word-break:break-word}
.boss .sc{font-size:20px;font-weight:800;color:var(--jaune)}
.top{list-style:none;margin:8px auto 0;padding:0;text-align:left}
.top li{display:flex;gap:10px;align-items:center;padding:8px 12px;margin:6px 0;border-radius:12px;background:rgba(255,255,255,.08);animation:glisse .4s both}
.top li .rg{font-weight:900;width:26px;color:var(--jaune)}
.top li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.top li .s{font-weight:800;font-variant-numeric:tabular-nums}
.top li .d{font-size:12px;color:var(--gris);width:40px;text-align:right}
@keyframes glisse{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.etat{font-size:13px;color:var(--gris);margin:8px 0}
.gros{display:block;width:100%;margin:14px 0 6px;padding:16px;border:0;border-radius:18px;background:var(--rouge);color:#fff;font-size:26px;font-weight:900;letter-spacing:.06em;box-shadow:0 6px 0 #9b1c26,0 10px 20px rgba(0,0,0,.4);text-transform:uppercase}
.gros:active{transform:translateY(4px);box-shadow:0 2px 0 #9b1c26}
.gros.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.btn{display:block;width:100%;margin:8px 0;padding:13px;border-radius:14px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);font-weight:800;font-size:17px}
.btn.jaune{background:var(--jaune);color:#2a1a00;border-color:var(--jaune)}
.btn.vert{background:var(--vert);color:#fff;border-color:var(--vert)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5}
.aide{font-size:13px;color:var(--gris);margin:10px 0 0}
h2{font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--gris);margin:18px 0 4px}
.champ{width:100%;padding:13px 14px;border-radius:14px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);font-size:18px;font-weight:700;text-align:center;-webkit-user-select:text;user-select:text}
.score-fin{font-size:46px;font-weight:900;color:var(--jaune);text-shadow:0 3px 0 #c2410c;margin:4px 0;font-variant-numeric:tabular-nums}
.bandeau{font-size:34px;font-weight:900;text-transform:uppercase;margin:24px 0 4px;line-height:1.05}
.bandeau.boss-n{color:var(--jaune);animation:tampon .7s cubic-bezier(.2,1.6,.4,1) both,arcenciel 1.5s .7s linear infinite}
@keyframes arcenciel{0%,100%{color:var(--jaune)}33%{color:#7cf}66%{color:#ff8fab}}
.msg{margin:10px 0;padding:10px;border-radius:12px;background:rgba(255,255,255,.1);font-weight:700}
.msg.ok{background:rgba(46,194,126,.25)}
.msg.ko{background:rgba(239,62,74,.25)}
.scene{position:relative;height:272px;margin:16px 0 6px}
.bulle{position:absolute;left:50%;top:0;transform:translateX(-50%);background:#fff;color:#1b1b1b;font-weight:900;font-size:19px;padding:10px 16px;border-radius:18px;max-width:300px;width:max-content;animation:bulle .5s .5s cubic-bezier(.2,1.6,.4,1) both;z-index:2}
.bulle:after{content:"";position:absolute;left:50%;bottom:-12px;border:12px solid transparent;border-top-color:#fff;border-bottom:0;margin-left:-12px}
@keyframes bulle{from{transform:translateX(-50%) scale(0)}to{transform:translateX(-50%) scale(1)}}
.moqueur{position:absolute;left:50%;top:78px;margin-left:-80px;width:160px;height:160px;animation:rebond .7s cubic-bezier(.3,0,.7,1) infinite alternate}
.moqueur .photo{width:160px;height:160px;margin:0;animation:gigote 1.4s ease-in-out infinite}
@keyframes rebond{from{transform:translateY(-20px)}to{transform:translateY(12px) scaleY(.92)}}
@keyframes gigote{0%{transform:rotate(-14deg)}25%{transform:rotate(12deg) scale(1.05)}50%{transform:rotate(-8deg)}70%{transform:rotate(360deg)}100%{transform:rotate(346deg)}}
.langue{position:absolute;left:50%;top:180px;font-size:34px;transform:translateX(-50%);animation:gigote 1s infinite}
.manque{color:var(--gris);font-weight:700}
.apercu{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid var(--jaune);margin:10px auto;display:none}
.photo-btn{position:relative;overflow:hidden}
.photo-btn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
#confettis{position:fixed;inset:0;pointer-events:none;z-index:6}
#pause{position:fixed;right:calc(env(safe-area-inset-right) + 8px);top:calc(env(safe-area-inset-top) + 8px);z-index:3;width:42px;height:42px;border-radius:12px;border:2px solid rgba(255,255,255,.25);background:rgba(16,26,54,.6);font-weight:900;font-size:16px;display:none}
/* bouton LANCER : petit, collé au bord droit (zone du couloir du lanceur), visible seulement quand une bille attend au lanceur */
#lancer{position:fixed;right:calc(env(safe-area-inset-right) + 3px);bottom:calc(env(safe-area-inset-bottom) + 3px);z-index:3;width:50px;height:50px;padding:0;border-radius:50%;border:2.5px solid #fff;background:radial-gradient(circle at 35% 30%,#ff8a95,#d61f2e 60%,#7a0f19);color:#fff;font-weight:900;font-size:9.5px;letter-spacing:-.01em;box-shadow:0 4px 0 #5a0a12,0 6px 14px rgba(0,0,0,.5);display:none;touch-action:none;-webkit-user-select:none;user-select:none;animation:pulse 1s ease-in-out infinite;line-height:1}
#tilt{position:fixed;z-index:3;display:none;width:70px;height:32px;margin:-16px 0 0 -35px;padding:0;border-radius:16px;border:2px solid rgba(255,255,255,.35);background:rgba(16,26,54,.7);color:#ffd23f;font-weight:900;font-size:14px;letter-spacing:.08em;touch-action:none}
#pause[style*="block"] ~ #tilt{display:block}
#tilt:active{background:#ffd23f;color:#101a36}
.quitter{margin:10px 0;padding:12px;border-radius:14px;background:rgba(255,210,63,.15);border:2px solid #ffd23f;text-align:center;font-weight:800}
.quitter .row{display:flex;gap:8px}.quitter .btn{margin:8px 0 0}
#lancer small{display:block;font-size:13px;margin-bottom:1px}
#lancer.charge{animation:none;transform:translateY(3px) scale(.95);box-shadow:0 1px 0 #5a0a12}
.cache{display:none!important}
/* les 3 boss à battre (accueil) et choix roi / reine (fin de partie) */
.boss3{margin:16px auto 6px;animation:chute .8s .2s cubic-bezier(.2,1.5,.4,1) both}
.boss3>.lbl{font-weight:900;letter-spacing:.08em;color:var(--rouge);background:var(--jaune);display:inline-block;padding:3px 12px;border-radius:8px;transform:rotate(-2deg);animation:clign 1s 1s steps(2) infinite}
.carte{position:relative;border-radius:20px;background:linear-gradient(160deg,#2b3a6b,#16224a);border:3px solid var(--bord,#9aa6c4);box-shadow:0 8px 22px rgba(0,0,0,.45);padding:6px 6px 10px;min-width:0}
.carte.r1{--bord:#ffd23f;margin:10px auto 10px;max-width:270px}
/* Accueil « L'ascension » (maquette 2 choisie par Kevin) : un chemin monte du garde au roi, Jouer collé en bas */
#accueil{background:linear-gradient(180deg,#2a0f3d 0,#4a1230 35%,#12040b 85%);padding-bottom:calc(env(safe-area-inset-bottom) + 100px)}
#accueil .haut{display:flex;justify-content:space-between;align-items:center;min-height:32px}
#accueil .eps-retour{float:none;padding:2px 0;font-size:13px;color:#ffd9c2}
#accueil #partage{border:0;border-radius:999px;padding:7px 12px;background:rgba(255,255,255,.14);color:#fff;font:800 13px system-ui,-apple-system,sans-serif}
#accueil .haut{position:relative}
#accueil #recomp{border:0;border-radius:999px;padding:7px 12px;background:rgba(255,210,63,.2);color:#ffd23f;font:800 13px system-ui,-apple-system,sans-serif;cursor:pointer}
#partage-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:7;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:16px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.45);min-width:190px}
#partage-menu[hidden]{display:none}
#partage-menu button,#partage-menu a{display:block;border:0;border-radius:10px;padding:11px 14px;text-align:left;font:800 15px system-ui,-apple-system,sans-serif;text-decoration:none;color:#2a0f3d;background:#f4eef8}
#partage-menu .wa{background:#25d366;color:#06301a}
#accueil #partage i{display:inline-block;width:14px;height:14px;border-radius:50%;background:#25d366;vertical-align:-2px;margin-right:6px}
#accueil h1.titre{margin:8px 0 0;font-size:30px;color:#fff;transform:none;text-shadow:0 4px 0 #7d1019;animation:none}
#accueil .defi{margin:6px 0 0;font-size:13px;font-weight:800;color:var(--jaune);letter-spacing:.14em;text-transform:uppercase;opacity:1}
#accueil .etat{margin:4px 0 0;font-size:12px}
#accueil .etat:empty{display:none}
/* Accueil « L'ascension » (Kevin) : vrai petit chemin dans un décor fantasy sombre, du garde jusqu'au château */
/* Accueil « L'ascension » (Kevin) : tout tient sur un écran ; décor dessiné à la taille réelle (--k = échelle), titre dans le décor */
#accueil.decor{padding-bottom:0}
#accueil.decor h1.titre,#accueil.decor .defi{display:none}
#accueil.decor .etat{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:6;margin:0;color:#e9d8ff;text-shadow:0 1px 3px #000}
.chemin{position:relative;margin:2px -16px 0;overflow:hidden;animation:chute .8s .2s cubic-bezier(.2,1.5,.4,1) both;--k:1}
.chemin svg.decor{position:absolute;inset:0;width:100%;height:100%}
.chemin .ttl{position:absolute;left:0;right:0;top:calc(2px * var(--k));z-index:1;text-align:center;pointer-events:none}
.chemin .ttl b{display:block;font:900 calc(30px * var(--k))/1 system-ui,-apple-system,sans-serif;letter-spacing:.01em;text-transform:uppercase;color:#ffe7b0;text-shadow:0 3px 0 #5a0f14,0 0 18px rgba(255,110,40,.55)}
.chemin .ttl span{display:block;margin-top:calc(5px * var(--k));font:800 calc(12.5px * var(--k)) system-ui,-apple-system,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--jaune);text-shadow:0 1px 3px #000}
.chemin .torche{position:absolute;width:calc(8px * var(--k));height:calc(22px * var(--k));margin:calc(-22px * var(--k)) 0 0 calc(-4px * var(--k));background:linear-gradient(#5a3a1a,#2a1a0a);border-radius:2px}
.chemin .torche::before{content:"";position:absolute;left:50%;top:-12px;width:12px;height:16px;margin-left:-6px;border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 50% 70%,#fff3b0,#ffb020 45%,#e5420f 75%,transparent 80%);filter:drop-shadow(0 0 8px #ff8a20);animation:flamme .35s ease-in-out infinite alternate}
.chemin .torche::after{content:"";position:absolute;left:50%;top:-30px;width:70px;height:70px;margin-left:-35px;border-radius:50%;background:radial-gradient(rgba(255,150,40,.32),transparent 65%);pointer-events:none}
@keyframes flamme{to{transform:scale(1.12,.9) rotate(4deg)}}
.chemin .b{position:absolute;display:flex;align-items:center;z-index:2}
.chemin canvas{display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.55));animation:flotte 2.4s ease-in-out infinite}
.chemin .b1{top:calc(58px * var(--k));left:0;flex-direction:column}
.chemin .b2{top:calc(378px * var(--k));right:8px;flex-direction:row-reverse}
.chemin .b3{top:calc(562px * var(--k));left:8px}
.chemin .tag{zoom:max(.72,var(--k))}
.chemin .b2 canvas{animation-delay:-.8s}.chemin .b3 canvas{animation-delay:-1.6s}
.chemin .b1{--c:#ffd23f;--t:#5a3a00}.chemin .b2{--c:#ff8c1a;--t:#fff}.chemin .b3{--c:#c9d1de;--t:#26304a}
.chemin canvas{background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--c) 45%,transparent),transparent 62%)}
/* étiquettes : petites, titre du personnage dans un bandeau couleur du rang assombrie, n° en médaille */
.chemin .tag{position:relative;background:#fbf4ea;color:#2a0f3d;border:2px solid var(--c);border-radius:11px;padding:0 0 4px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 18px color-mix(in srgb,var(--c) 40%,transparent);min-width:96px;max-width:130px}
.chemin .b1 .tag{margin-top:-16px;min-width:120px}
.chemin .vide .tag{opacity:.85;border-style:dashed}
.chemin .tag em{position:absolute;z-index:2;left:-10px;top:-10px;width:22px;height:22px;border-radius:50%;background:var(--c);color:var(--t);border:2px solid #fff;font:900 11px/18px system-ui,-apple-system,sans-serif;font-style:normal;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.chemin .tag i{display:block;margin-bottom:3px;padding:4px 8px 3px 13px;border-radius:9px 9px 0 0;background:linear-gradient(color-mix(in srgb,var(--c) 72%,#000),color-mix(in srgb,var(--c) 42%,#000));color:#fff4e0;font:900 13px/1.05 Georgia,"Times New Roman",serif;font-style:normal;text-transform:uppercase;letter-spacing:.06em;text-shadow:0 1px 2px #000}
.chemin .b1 .tag i{font-size:16px;padding-left:10px}
.chemin .tag b{display:block;padding:0 7px;font-size:13px;font-weight:900;line-height:1.1;word-break:break-word}.chemin .b1 .tag b{font-size:15px}
/* intronisation : le nouveau boss bat les boss un par un sur le chemin, puis prend la place du dernier battu */
.intro-calque{position:absolute;inset:0;z-index:5;pointer-events:none}
.chemin .chateau{position:absolute;right:6px;top:calc(60px * var(--k));width:calc(150px * var(--k));height:calc(180px * var(--k));z-index:1;border:0;background:transparent;-webkit-tap-highlight-color:transparent}
.chemin .rumeur{position:absolute;right:10px;top:calc(250px * var(--k));z-index:4;max-width:220px;padding:8px 12px;border-radius:12px;background:rgba(20,6,30,.92);border:2px solid #b26bff;color:#e9d8ff;font:800 13px/1.3 system-ui,-apple-system,sans-serif;text-align:center;box-shadow:0 0 18px rgba(178,107,255,.5);animation:glisse .3s both}
.chemin .rumeur small{font-weight:700;color:#c9a8f0}
.heros{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;will-change:transform}
.heros canvas{animation:none;background:radial-gradient(circle at 50% 55%,rgba(255,240,170,.55),transparent 62%);filter:drop-shadow(0 0 14px rgba(255,220,120,.8)) drop-shadow(0 8px 10px rgba(0,0,0,.55))}
.heros b{position:relative;margin-top:-10px;padding:3px 10px;border-radius:999px;background:#ffd23f;color:#2a0f3d;font:900 13px system-ui,-apple-system,sans-serif;box-shadow:0 3px 0 #7a5200;white-space:nowrap}
.i-bul{position:absolute;max-width:180px;transform:translate(-50%,-100%);background:#fbf4ea;color:#2a0f3d;border:2px solid #2a0f3d;border-radius:12px;padding:5px 9px;font:900 13px/1.15 system-ui,-apple-system,sans-serif;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.i-bul::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:#2a0f3d;border-bottom:0}
.i-boom{position:absolute;transform:translate(-50%,-50%);font:900 30px/1 system-ui,-apple-system,sans-serif;color:#fff2a8;-webkit-text-stroke:2px #3a0a0a;text-shadow:0 4px 0 #3a0a0a,0 0 20px var(--c,#ff8a20);white-space:nowrap;letter-spacing:.02em}
.i-ecl{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--c,#ffd23f);box-shadow:0 0 8px var(--c,#ffd23f)}
.i-annonce{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:86%;text-align:center;font:900 26px/1.05 Georgia,"Times New Roman",serif;text-transform:uppercase;color:#ffe7b0;text-shadow:0 3px 0 #5a0f14,0 0 22px rgba(255,110,40,.8)}
.i-annonce small{display:block;margin-top:6px;font:800 13px system-ui,-apple-system,sans-serif;letter-spacing:.14em;color:var(--jaune)}
.i-passer{position:absolute;right:10px;top:calc(64px * var(--k));pointer-events:auto;border:0;border-radius:999px;padding:7px 14px;background:rgba(0,0,0,.55);color:#fff;font:800 13px system-ui,-apple-system,sans-serif}
.i-couronne{position:absolute;font-size:34px;line-height:1;transform:translate(-50%,-50%)}
.i-proj{position:absolute;font-size:30px;line-height:1;transform:translate(-50%,-50%);filter:drop-shadow(0 3px 3px rgba(0,0,0,.5))}
.i-coiffe{position:absolute;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}
.i-onde{position:absolute;width:60px;height:60px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 14px #fff;transform:translate(-50%,-50%)}
.i-carton{position:absolute;padding:10px 12px;border-radius:6px;background:#e10f1f;color:#fff;border:3px solid #fff;font:900 15px/1.05 system-ui,-apple-system,sans-serif;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.4);transform:translate(-50%,-50%)}
.i-confetti{position:absolute;width:8px;height:12px;border-radius:2px}
.chemin .b.nouveau canvas{animation:sacre 1.1s ease-in-out 3,flotte 2.4s ease-in-out 3.3s infinite}
@keyframes sacre{50%{filter:drop-shadow(0 0 22px #ffd23f) drop-shadow(0 8px 10px rgba(0,0,0,.55));transform:scale(1.06)}}

<script>
'use strict';
const JEU = 'flipper-2026-11b'; // changer ce nom = classement remis à zéro (Kevin, 24/10/2026 ; l'ancien reste dans le tableur)
const URL_SCRIPT = (() => { try { return localStorage.getItem('eps-script') || ''; } catch (e) { return ''; } })();

function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const photoOk = p => typeof p === 'string' && /^data:image\/(jpeg|jpg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p);

// Avatar de remplacement (prof à moustache avec sifflet)
const AVATAR = 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><rect width="120" height="120" fill="#3a86ff"/><circle cx="60" cy="66" r="38" fill="#f2c79b"/><path d="M22 52 Q60 8 98 52 Q60 36 22 52Z" fill="#ef3e4a"/><rect x="18" y="48" width="84" height="8" rx="4" fill="#c1121f"/><rect x="34" y="58" width="22" height="13" rx="5" fill="#111"/><rect x="64" y="58" width="22" height="13" rx="5" fill="#111"/><rect x="55" y="62" width="10" height="3" fill="#111"/><path d="M38 84 Q49 76 60 84 Q71 76 82 84 Q71 92 60 87 Q49 92 38 84Z" fill="#5a3311"/><circle cx="60" cy="98" r="6" fill="#bbb" stroke="#555" stroke-width="2"/><path d="M60 104 L60 120" stroke="#ffd23f" stroke-width="3"/></svg>`);

// ---------------------------------------------------------------- Son
// Tout est synthétisé en WebAudio. Sur iPhone, le contexte audio doit être créé / relancé PENDANT un geste
// (touchend, pointerdown, keydown) ; il peut aussi être « interrupted » après un passage en arrière-plan.
// navigator.audioSession.type = 'playback' (iOS 17+) fait passer le son même avec le bouton silencieux ;
// sur les iOS plus anciens, un <audio> silencieux en boucle bascule la session audio en mode « lecture ».
// Kevin (v8) : bruitages refaits dans un style « jeu mobile viral » (plucks accordés sur la musique, pops, pièces,
// whooshs, bass drops, montées, foule « yeah ») + une musique par mode, générée en direct (séquenceur planifié à l'avance).
// Graphe : SFX ─┐                       (ECHO : petit écho « paillettes » pour les plucks / cloches)
//         MUSF (passe-bas des transitions) → MUSDUCK (atténuation sous les annonces) → MUSB (musique on/off) ─┤→ MASTER (son on/off) → limiteur → sortie
let AC = null, MASTER = null, SFX = null, ECHO = null, MUSF = null, MUSDUCK = null, MUSB = null, BRUIT = null, TAMB = null, ORGUE_W = null;
let deverrouille = false, audioHtml = null, muet = !!lsGet('battle-muet', false), musiqueOn = lsGet('battle-musique', true) !== false;
let DEC = 0, horsLigne = false; // DEC / horsLigne : rendu hors ligne (OfflineAudioContext) pour les tests de niveau
const VOIX = [], MAX_VOIX = 40, DERN = {}, VOL_MASTER = 0.6, VOL_MUS = 0.5;
const SILENCE = (() => { // WAV 8 bits mono de 0,1 s de silence, en data URI
  const n = 4410, b = new Uint8Array(44 + n), dv = new DataView(b.buffer), w = (o, s) => { for (let i = 0; i < s.length; i++) b[o + i] = s.charCodeAt(i); };

  dv.setUint32(24, 44100, true); dv.setUint32(28, 44100, true); dv.setUint16(32, 1, true); dv.setUint16(34, 8, true); w(36, 'data'); dv.setUint32(40, n, true); b.fill(128, 44);
  let s = ''; for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return 'data:audio/wav;base64,' + btoa(s);
})();
function sessionLecture() { try { const s = navigator.audioSession; if (s && s.type !== 'playback') s.type = 'playback'; } catch (e) {} }
function relancer() { try { if (AC && AC.state !== 'running' && !document.hidden) { const p = AC.resume(); if (p && p.catch) p.catch(() => {}); } } catch (e) {} }
function construireGraphe(ac) { // bus, limiteur, écho, bruit blanc, batterie pré-calculée, timbre d'orgue
  const comp = ac.createDynamicsCompressor(); // limiteur : musique + plusieurs sons à la fois sans saturer
  comp.threshold.value = -14; comp.knee.value = 6; comp.ratio.value = 12; comp.attack.value = 0.002; comp.release.value = 0.2;

  MUSDUCK = ac.createGain(); MUSB = ac.createGain(); MUSB.gain.value = musiqueOn ? VOL_MUS : 0;

  const d = BRUIT.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  const re = new Float32Array([0, 1, 0.75, 0.45, 0.5, 0.2, 0.25, 0, 0.12]); ORGUE_W = ac.createPeriodicWave(re, new Float32Array(re.length)); // tirettes d'orgue

function audio() {
  try {
    if (!AC) {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      sessionLecture();
      AC = new C({ latencyHint: 'interactive' });
      construireGraphe(AC);
    }
    relancer();
  } catch (e) { return null; }
  return AC;
}
function deverrouiller() { // à chaque geste : crée / relance le contexte (indispensable sur iPhone)
  sessionLecture(); const ac = audio(); if (!ac) return;
  if (!deverrouille) { try { const s = ac.createBufferSource(); s.buffer = ac.createBuffer(1, 1, 22050); s.connect(ac.destination); s.start(0); deverrouille = true; } catch (e) {} }
  if (!muet && !('audioSession' in navigator)) {
    try {
      if (!audioHtml) { audioHtml = new Audio(SILENCE); audioHtml.loop = true; audioHtml.muted = false; audioHtml.setAttribute('playsinline', ''); audioHtml.setAttribute('x-webkit-airplay', 'deny'); }

    } catch (e) {}

document.addEventListener('visibilitychange', () => {
  if (!AC) return;
  if (document.hidden) { arreterCharge(); try { AC.suspend(); } catch (e) {} try { if (audioHtml) audioHtml.pause(); } catch (e) {} }
  else relancer();
});
window.addEventListener('pageshow', relancer); window.addEventListener('focus', relancer);
function pret() { return AC && (horsLigne || (!muet && AC.state === 'running')); }
function voix(delai, dur) { // limite la polyphonie des bruitages : au-delà de MAX_VOIX sons simultanés, on ignore les nouveaux
  const now = AC.currentTime; for (let i = VOIX.length - 1; i >= 0; i--) if (VOIX[i] < now) VOIX.splice(i, 1);
  if (VOIX.length >= MAX_VOIX) return false; VOIX.push(now + DEC + delai + dur); return true;

function limite(nom, s) { const t = performance.now(); if (t - (DERN[nom] || -1e9) < s * 1000) return false; DERN[nom] = t; return true; }
const midi = n => 440 * Math.pow(2, (n - 69) / 12);

// ---- batterie pré-calculée (une seule fois, quelques Ko) : grosse caisse, clap, charleston, caisse claire, timbale, tom, cymbale
function creerTambours(ac) {
  const sr = ac.sampleRate, T = {}, hasard = () => Math.random() * 2 - 1;
  const svf = (d, fc, q, mode) => { // filtre d'état (Chamberlin) appliqué sur place
    const f = 2 * Math.sin(Math.PI * Math.min(fc, sr / 6.5) / sr), amo = 1 / q; let lp = 0, bp = 0;
    for (let i = 0; i < d.length; i++) { const hp = d[i] - lp - amo * bp; bp += f * hp; lp += f * bp; d[i] = mode === 'hp' ? hp : mode === 'bp' ? bp : lp; }
  };
  const buf = (dur, f) => { const b = ac.createBuffer(1, Math.ceil(sr * dur), sr), d = b.getChannelData(0); f(d); let m = 0; for (let i = 0; i < d.length; i++) m = Math.max(m, Math.abs(d[i])); if (m) for (let i = 0; i < d.length; i++) d[i] /= m; return b; };
  const kick = (dur, f0, f1, kf, ka, sat) => buf(dur, d => { let ph = 0; for (let i = 0; i < d.length; i++) { const t = i / sr; ph += 2 * Math.PI * (f0 + f1 * Math.exp(-t * kf)) / sr; d[i] = Math.tanh(sat * Math.sin(ph) * Math.exp(-t * ka)) + (t < 0.004 ? hasard() * 0.3 * (1 - t / 0.004) : 0); } });

  T.boum = kick(0.55, 42, 150, 20, 6, 2.6);      // boss, plus lourde
  T.clap = buf(0.3, d => { for (let i = 0; i < d.length; i++) { const t = i / sr; d[i] = hasard() * (t < 0.033 ? Math.exp(-(t % 0.011) * 320) : 0.75 * Math.exp(-(t - 0.033) * 17)); } svf(d, 1250, 1.4, 'bp'); });

  T.ohat = buf(0.32, d => { for (let i = 0; i < d.length; i++) d[i] = hasard() * Math.exp(-i / sr * 10); svf(d, 6000, 0.9, 'hp'); });

  T.tom = buf(0.45, d => { let ph = 0; for (let i = 0; i < d.length; i++) { const t = i / sr; ph += 2 * Math.PI * (115 + 70 * Math.exp(-t * 12)) / sr; d[i] = Math.sin(ph) * Math.exp(-t * 8) + hasard() * 0.15 * Math.exp(-t * 50); } });

  const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = TAMB[nom]; s.playbackRate.value = rate; g.gain.value = vol;
  s.connect(g); g.connect(dest); s.start(t);

// ---------------------------------------------------------------- Musique : 6 pistes générées (séquenceur à pas de double-croche)
// Chaque piste : tempo, tonalité, grille d'accords (1 par mesure), motifs de batterie / basse / accords (chaînes de pas),
// mélodies (degrés de la gamme : 0-9 a-z, A-G = degrés négatifs, '-' = tenue) et un arrangement (section selon la mesure).
const GAMMES = { min: [0, 2, 3, 5, 7, 8, 10], maj: [0, 2, 4, 5, 7, 9, 11], harm: [0, 2, 3, 5, 7, 8, 11] };
const INTERV = { r: 0, o: 12, 5: 7, b: 1, s: -1, t: 6, 7: 10, O: -12 };

// ---------------------------------------------------------------- Photo
function chargerPhoto(file) {
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); ok(img); };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error('image illisible')); };
    img.src = url;
  });
}
function carreVersData(img, sx, sy, cote) { // carré découpé dans la photo -> JPEG < 48 000 caractères
  let taille = Math.min(240, Math.round(cote)), q = 0.6, data = '';
  for (let i = 0; i < 12; i++) {
    const c = document.createElement('canvas'); c.width = c.height = taille;
    c.getContext('2d').drawImage(img, sx, sy, cote, cote, 0, 0, taille, taille);
    data = c.toDataURL('image/jpeg', q);
    if (data.length < 48000) return data;
    if (q > 0.35) q -= 0.1; else { taille = Math.round(taille * 0.8); q = 0.5; }
  }
  throw new Error('trop gros');
}
// Cadrage : le visage se place dans le rond du déguisement (glisser = déplacer, curseur ou 2 doigts = zoom)
function cadrerPhoto(img, rang, genre) {
  return new Promise(fin => {
    const W = img.naturalWidth, H = img.naturalHeight, base = Math.min(W, H);
    let zoom = 1.25, cx = W / 2, cy = H / 2 - base * 0.06;
    const d = document.createElement('div'); d.id = 'cadre';
    d.innerHTML = `<div class="cadre-boite"><b>Place ton visage dans le rond</b><span>Glisse la photo avec le doigt, zoome avec le curseur.</span>
      <canvas id="cadre-grand" style="width:230px;height:300px"></canvas>
      <div class="cadre-mini"><canvas style="width:70px;height:92px"></canvas><canvas style="width:70px;height:92px"></canvas><canvas style="width:70px;height:92px"></canvas></div>
      <input type="range" id="cadre-zoom" min="1" max="4" step="0.01" value="${zoom}" aria-label="Zoom">
      <div class="cadre-bt"><button class="btn" id="cadre-non">Annuler</button><button class="btn jaune" id="cadre-ok">✅ C’est bon</button></div></div>`;
    document.body.appendChild(d);
    const cv = d.querySelector('#cadre-grand'), minis = [...d.querySelectorAll('.cadre-mini canvas')], visage = document.createElement('canvas');
    visage.width = visage.height = 160;
    const cote = () => base / zoom;
    const borner = () => { const h = cote() / 2; cx = Math.min(W - h, Math.max(h, cx)); cy = Math.min(H - h, Math.max(h, cy)); };
    const peindre = (cnv, r, k0) => {
      const w = cnv.clientWidth, h = cnv.clientHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (cnv.width !== Math.round(w * dpr)) { cnv.width = Math.round(w * dpr); cnv.height = Math.round(h * dpr); }
      const c = cnv.getContext('2d'), k = Math.min(w / 100, h / 132) * dpr * (k0 || 1);
      c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cnv.width, cnv.height);
      c.setTransform(k, 0, 0, k, cnv.width / 2 - 5 * k, cnv.height / 2 - 2 * k); dessinerPerso(c, r, genre, visage, { pas: 0.6 });
    };
    const maj = () => {
      borner(); const h = cote() / 2;
      visage.getContext('2d').drawImage(img, cx - h, cy - h, 2 * h, 2 * h, 0, 0, 160, 160);
      peindre(cv, rang); [3, 2, 1].forEach((r, i) => peindre(minis[i], r));
    };
    // glisser (1 doigt) et pincer (2 doigts)
    const doigts = new Map(); let pince = 0;
    const echelle = () => Math.min(cv.clientWidth / 100, cv.clientHeight / 132); // pixels écran par unité (le rond fait 40 unités)
    cv.style.touchAction = 'none';
    cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); doigts.set(e.pointerId, [e.clientX, e.clientY]); if (doigts.size === 2) { const [a, b] = [...doigts.values()]; pince = Math.hypot(a[0] - b[0], a[1] - b[1]); } };
    cv.onpointermove = e => {
      const av = doigts.get(e.pointerId); if (!av) return;
      if (doigts.size === 1) {
        const parPx = cote() / (40 * echelle()); // pixels photo par pixel écran
        cx -= (e.clientX - av[0]) * parPx; cy -= (e.clientY - av[1]) * parPx;
      }
      doigts.set(e.pointerId, [e.clientX, e.clientY]);
      if (doigts.size === 2) { const [a, b] = [...doigts.values()], dist = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pince) zoom = Math.min(4, Math.max(1, zoom * dist / pince)); pince = dist; d.querySelector('#cadre-zoom').value = zoom; }

    };
    cv.onpointerup = cv.onpointercancel = e => { doigts.delete(e.pointerId); pince = 0; };

    d.querySelector('#cadre-non').onclick = () => fermer(null);
    d.querySelector('#cadre-ok').onclick = () => { borner(); const h = cote() / 2; try { fermer(carreVersData(img, cx - h, cy - h, 2 * h)); } catch (e) { fermer(null); alert('Photo impossible à utiliser, essaie encore.'); } };
    maj();
  });
}

// Confettis
function confettis(n = 140) {
  const c = $('confettis'), x = c.getContext('2d'); c.width = CW * DPR; c.height = CH * DPR; x.setTransform(DPR, 0, 0, DPR, 0, 0);
  const cols = ['#ffd23f', '#ef3e4a', '#3a86ff', '#2ec27e', '#ff8fab', '#fff'];
  let ps = Array.from({ length: n }, () => ({ x: rnd(0, CW), y: rnd(-CH * 0.5, -10), vx: rnd(-60, 60), vy: rnd(120, 300), a: rnd(0, 6), va: rnd(-8, 8), c: pick(cols), w: rnd(6, 11) }));
  let t0 = performance.now(), last = t0;
  (function f(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t; x.clearRect(0, 0, CW, CH);
    for (const p of ps) { p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.va * dt; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); x.restore(); }
    if (t - t0 < 4500) requestAnimationFrame(f); else x.clearRect(0, 0, CW, CH);
  })(t0);
}

// tests : rendu hors ligne (OfflineAudioContext) d'une piste + de bruitages → crête et niveau RMS
async function rendreHorsLigne(sec, piste, sons) {
  const garde = [AC, MASTER, SFX, ECHO, MUSF, MUSDUCK, MUSB, BRUIT, TAMB, ORGUE_W, MUS.decks, MUS.nom, MUS.duckFin, MUS.duckNiv];
  const off = new OfflineAudioContext(2, Math.ceil(sec * 44100), 44100);
  horsLigne = true; AC = off; VOIX.length = 0;
  try {
    construireGraphe(off); MUS.decks = []; MUS.nom = null; MUS.duckFin = 0;
    if (piste) { changerPiste(piste); musPlanifier(sec); }
    for (const [t, nom, arg] of (sons || [])) { DEC = t; SON[nom](arg); }
  } finally { DEC = 0; [AC, MASTER, SFX, ECHO, MUSF, MUSDUCK, MUSB, BRUIT, TAMB, ORGUE_W, MUS.decks, MUS.nom, MUS.duckFin, MUS.duckNiv] = garde; horsLigne = false; VOIX.length = 0; }
  const buf = await off.startRendering(), d = buf.getChannelData(0), n = 22050;
  let crete = 0, somme = 0, rmsMax = 0;
  for (let i = 0; i < d.length; i += n) { let q = 0; for (let j = i; j < Math.min(d.length, i + n); j++) { const v = d[j]; q += v * v; if (Math.abs(v) > crete) crete = Math.abs(v); } somme += q; rmsMax = Math.max(rmsMax, Math.sqrt(q / n)); }
  return { crete: +crete.toFixed(3), rms: +Math.sqrt(somme / d.length).toFixed(3), rmsMax: +rmsMax.toFixed(3) };
}

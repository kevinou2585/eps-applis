<!doctype html>
<html lang="fr">
<head>
<script src="../perso.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet EPS</title>
<meta name="theme-color" content="#2f6fd0">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icones/carnet-192.png">
<link rel="apple-touch-icon" href="../icones/eps-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EPS ultime">
<style>/* Pas de zoom quand on tape vite deux fois sur un bouton (iPhone) */
html,body,button,a,input,label,select{touch-action:manipulation}
/* Retour vers l'accueil de l'appli EPS */
.eps-retour{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;max-width:680px;margin:0 auto;padding:10px 16px 0;font:600 14px system-ui,-apple-system,sans-serif;color:#5d6a60;text-decoration:none}
@media (prefers-color-scheme:dark){.eps-retour{color:#9aa89e}}</style>
</head>
<body>
<a class="eps-retour" href="../"><span style="white-space:nowrap">‹ Mes applis</span><span style="font-weight:500">· Version bêta, pas encore finie</span></a>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout : appli une colonne pour téléphone, en-tête collant (classe + période), barre d'onglets fixée en bas */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface2:#e4eaf1; --line:#d3dbe5; --fg:#132131; --muted:#5a6a7c;
  --accent:#1f5fd1; --accent-ink:#ffffff; --accent-soft:#dbe6fb;
  --ok:#17824a; --ok-soft:#d9f1e3; --warn:#a96400; --warn-soft:#fbebcf; --bad:#c3312a; --bad-soft:#f9dcda;
  --pool:#0a86a6; --pool-soft:#d3eef5; --gym:#9a4a17; --gym-soft:#f5e1d1;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tab-h:62px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e151d; --surface:#17212c; --surface2:#1f2b38; --line:#2c3a49; --fg:#e6edf5; --muted:#93a3b5;
  --accent:#6f9cf0; --accent-ink:#0b1422; --accent-soft:#1e2f4d;
  --ok:#4cc483; --ok-soft:#173527; --warn:#e6a64a; --warn-soft:#3a2a12; --bad:#f07a72; --bad-soft:#3d1a19;
  --pool:#4cc3e0; --pool-soft:#123441; --gym:#e7965f; --gym-soft:#3a2416; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e151d; --surface:#17212c; --surface2:#1f2b38; --line:#2c3a49; --fg:#e6edf5; --muted:#93a3b5;
  --accent:#6f9cf0; --accent-ink:#0b1422; --accent-soft:#1e2f4d;
  --ok:#4cc483; --ok-soft:#173527; --warn:#e6a64a; --warn-soft:#3a2a12; --bad:#f07a72; --bad-soft:#3d1a19;
  --pool:#4cc3e0; --pool-soft:#123441; --gym:#e7965f; --gym-soft:#3a2416; color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg); font:15px/1.4 var(--body); -webkit-tap-highlight-color:transparent; padding-bottom:calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); max-width:760px; margin:0 auto}
.num{font-variant-numeric:tabular-nums}

/* En-tête */
header.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); border-bottom:1px solid var(--line)}
header.top .wrap{display:flex; align-items:center; gap:10px; padding-block:10px}
.brand{font:700 22px/1 var(--display); letter-spacing:.02em; text-transform:uppercase; white-space:nowrap}
.clsel{flex:1; min-width:0; appearance:none; -webkit-appearance:none; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:8px 30px 8px 12px; font-weight:600; font-size:16px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%; background-size:5px 5px; background-repeat:no-repeat}
.sync{font-size:12px; color:var(--muted); white-space:nowrap; display:flex; align-items:center; gap:5px}
.sync i{width:8px; height:8px; border-radius:50%; background:var(--muted); display:inline-block}
.sync.ok i{background:var(--ok)} .sync.busy i{background:var(--warn)} .sync.err i{background:var(--bad)}

/* Onglets du bas */
nav.tabs{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:grid; grid-template-columns:repeat(4,1fr); max-width:760px; margin:0 auto; height:var(--tab-h)}
nav.tabs button{border:0; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:11.5px; font-weight:600; color:var(--muted)}
nav.tabs button svg{width:23px; height:23px}
nav.tabs button[aria-current="true"]{color:var(--accent)}

/* Éléments communs */
h2{font:700 26px/1.05 var(--display); letter-spacing:.01em; text-transform:uppercase; margin:0; text-wrap:balance}
h3{font:700 18px/1.1 var(--display); letter-spacing:.03em; text-transform:uppercase; margin:0; color:var(--muted)}
.sec{display:flex; flex-direction:column; gap:12px; padding-block:14px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:11px; padding:10px 14px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:44px}
.btn.pri{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.danger{color:var(--bad); border-color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.row2{display:flex; gap:8px; flex-wrap:wrap}
.row2 > .btn{flex:1 1 140px}
label.f{display:flex; flex-direction:column; gap:5px; font-size:13px; font-weight:600; color:var(--muted)}
.inp{color:var(--fg); font-weight:400; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:10px 12px; font-size:16px; width:100%; min-width:0}
textarea.inp{min-height:130px; resize:vertical}
.chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:7px 13px; font-weight:600; font-size:14px; display:inline-flex; align-items:center; gap:6px}
.chip[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.tag{display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:3px 10px; font-size:12.5px; font-weight:700; letter-spacing:.02em}
.chip.sess{flex-direction:column; align-items:flex-start; gap:1px; border-radius:12px; padding:7px 12px; min-height:48px; justify-content:center}
.chip.sess .sh1{font:700 17px/1 var(--display); letter-spacing:.02em}
.chip.sess .sh2{font-size:12px; font-weight:600; opacity:.8}
.chip.sess.add{border-style:dashed}
.okm{color:var(--ok)} .chip[aria-pressed="true"] .okm{color:inherit}
.sesshead b{display:block; font:700 24px/1.05 var(--display); text-transform:uppercase; letter-spacing:.02em}
.lsub{padding:8px 10px; background:var(--accent-soft); color:var(--accent); font:700 16px/1 var(--display); letter-spacing:.04em; text-transform:uppercase; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center}
.lsub span{font:600 12px var(--body); text-transform:none; letter-spacing:0}
.cvh{display:flex; align-items:center; gap:10px; padding-top:14px}
.cvn{font:700 28px/1 var(--display); text-transform:uppercase; letter-spacing:.02em; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.seg.full{display:flex; width:100%; margin-top:12px}
.seg.full button{flex:1; padding-inline:4px}
#gear[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.tag.piscine{background:var(--pool-soft); color:var(--pool)} .tag.salle{background:var(--gym-soft); color:var(--gym)}
.tag svg{width:14px; height:14px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--surface)}
.seg button{border:0; background:none; padding:8px 12px; font-weight:600; font-size:14px; min-height:40px}
.seg button[aria-pressed="true"].salle{background:var(--gym-soft); color:var(--gym)}
.seg button[aria-pressed="true"].piscine{background:var(--pool-soft); color:var(--pool)}
.seg button[aria-pressed="true"]:not(.salle):not(.piscine){background:var(--fg); color:var(--bg)}

.av{width:40px; height:40px; border-radius:50%; flex:none; background:var(--surface2); color:var(--muted); display:grid; place-items:center; font:700 15px/1 var(--display); letter-spacing:.03em; overflow:hidden}
.av img{width:100%; height:100%; object-fit:cover; display:block}
.av.lg{width:84px; height:84px; font-size:28px}

/* Leçon */
.daybar{display:flex; align-items:center; gap:8px}
.daybar .dnav{width:44px; height:44px; border-radius:11px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; flex:none}
.daypick{position:relative; flex:1; min-width:0; text-align:center; border:1px solid var(--line); background:var(--surface); border-radius:11px; min-height:44px; display:flex; flex-direction:column; justify-content:center; padding:4px 8px}
.daypick b{font:700 19px/1.1 var(--display); letter-spacing:.02em; text-transform:uppercase}
.daypick span{font-size:12px; color:var(--muted)}
.daypick input{position:absolute; inset:0; opacity:0; width:100%; height:100%}
.sum{display:flex; gap:6px; flex-wrap:wrap}
.sum .tag{background:var(--surface2); color:var(--fg)}
.sum .tag.b{background:var(--bad-soft); color:var(--bad)} .sum .tag.w{background:var(--warn-soft); color:var(--warn)}
.list{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.lhead{display:flex; align-items:center; gap:6px; padding:8px 10px; border-bottom:1px solid var(--line); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); background:var(--surface2)}
.lhead .grow{flex:1}
.lhead span.c{width:46px; text-align:center}
.prow{display:flex; align-items:center; gap:6px; padding:7px 10px; border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow.isA{background:var(--bad-soft)}
.who{flex:1; min-width:0; display:flex; align-items:center; gap:9px; border:0; background:none; padding:0; text-align:left}
.who .nm{min-width:0}
.who .nm b{display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pts{font-size:12px; color:var(--muted); display:flex; gap:7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pts .low{color:var(--bad); font-weight:700}
.tb{width:46px; height:46px; flex:none; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); display:grid; place-items:center; position:relative; font:700 18px/1 var(--display)}
.tb svg{width:22px; height:22px}
.tb:disabled{opacity:.25}
.tb.P{color:var(--ok); border-color:var(--ok)}
.tb.A{background:var(--bad); border-color:var(--bad); color:var(--surface)}
.tb.R{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.tb.D{background:var(--surface2); border-color:var(--muted); color:var(--muted)}
.tb.ok{color:var(--muted)}
.tb.no{background:var(--bad-soft); border-color:var(--bad); color:var(--bad)}
.tb.no::after{content:""; position:absolute; left:8px; right:8px; top:50%; height:2px; background:currentColor; transform:rotate(-40deg)}
.tb.dis{color:var(--muted)}
.tb.dis.on{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.tb.dis.ex{background:var(--bad); border-color:var(--bad); color:var(--surface); font:700 11px/1 var(--body); letter-spacing:0}
.tb .cnt{position:absolute; top:-6px; right:-6px; min-width:19px; height:19px; padding:0 4px; border-radius:10px; background:var(--warn); color:var(--surface); font:700 12px/19px var(--body)}
.legend{font-size:12.5px; color:var(--muted); line-height:1.5}

/* Points */
.pips{display:inline-flex; gap:3px}
.pips i{width:11px; height:11px; border-radius:50%; border:1.5px solid currentColor; display:block}
.pips i.f{background:currentColor}
.pips.t{color:var(--accent)} .pips.c{color:var(--ok)}
.prow .grid2{display:grid; grid-template-columns:auto auto; gap:2px 6px; align-items:center; font-size:11px; color:var(--muted)}
.score{font:700 22px/1 var(--display); min-width:52px; text-align:right}
.score small{font-size:13px; color:var(--muted)}
.bad{color:var(--bad)} .good{color:var(--ok)} .warnc{color:var(--warn)}

/* Évaluations */
.ev{display:flex; align-items:center; gap:12px; border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:12px 14px; text-align:left; width:100%}
.ev .t{flex:1; min-width:0}
.ev .t b{display:block; font-size:16px}
.ev .sur{font:700 26px/1 var(--display)}
.sin{display:flex; align-items:center; gap:6px; flex:none}
.sin input{width:70px; text-align:center; font-weight:700}
.sin{gap:4px}
.sin input{width:58px}
.sin .abs{min-height:40px; padding:6px 7px; font-size:13px}
.sin .abs[aria-pressed="true"]{background:var(--bad-soft); color:var(--bad); border-color:var(--bad)}

/* Bulletin */
.tiles{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
@media (min-width:560px){ .tiles{grid-template-columns:repeat(4,minmax(0,1fr))} }
.tile{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px}
.tile .k{font-size:12px; color:var(--muted); font-weight:600}
.tile .v{font:700 30px/1.05 var(--display)}
.tile .v small{font-size:15px; color:var(--muted)}
.hist{display:flex; align-items:flex-end; gap:6px; height:110px; padding-top:18px}
.hist .b{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px; height:100%; font-size:11px; color:var(--muted)}
.hist .b .bar{width:100%; border-radius:6px 6px 2px 2px; background:var(--accent); min-height:2px; position:relative}
.hist .b .bar.lo{background:var(--bad)}
.hist .b .bar span{position:absolute; top:-17px; left:0; right:0; text-align:center; font-weight:700; color:var(--fg); font-size:12px}
.tblw{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:14px}
table.bt{border-collapse:collapse; width:100%; font-size:14px}
.bt th,.bt td{padding:9px 8px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap}
.bt th{font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); background:var(--surface2); position:sticky; top:0; cursor:pointer}
.bt th:first-child,.bt td:first-child{text-align:left; position:sticky; left:0; background:var(--surface); max-width:150px; overflow:hidden; text-overflow:ellipsis}
.bt th:first-child{background:var(--surface2)}
.bt tr:last-child td{border-bottom:0}
.bt td.tot{font-weight:700}
.bt tbody tr{cursor:pointer}

/* Feuille (bottom sheet) */
.back{position:fixed; inset:0; z-index:40; background:rgba(8,14,22,.45)}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:41; max-height:92%; background:var(--bg); border-radius:18px 18px 0 0; display:flex; flex-direction:column; box-shadow:0 -10px 30px rgba(0,0,0,.18); padding-bottom:env(safe-area-inset-bottom,0px); max-width:760px; margin:0 auto}
.sheet .sh{display:flex; align-items:center; gap:8px; padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px)); border-bottom:1px solid var(--line)}
.sheet .sh h2{flex:1; min-width:0; font-size:22px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sheet .sb{overflow-y:auto; padding:14px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px)); display:flex; flex-direction:column; gap:12px; -webkit-overflow-scrolling:touch}
.sheet .sb > *{flex:none}
.ib{width:40px; height:40px; border-radius:10px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; flex:none}
.ib svg{width:20px; height:20px}
.kv{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.kv .tile{padding:10px}
.kv .tile .v{font-size:26px}
.evt{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
.evt:last-child{border-bottom:0}
.evt .d{width:72px; flex:none; font-size:13px; color:var(--muted)}
.evt .l{flex:1; min-width:0}
.evt .col{font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--surface2)}
.evt .col.t{color:var(--accent); background:var(--accent-soft)} .evt .col.c{color:var(--ok); background:var(--ok-soft)}
.confirm{border:1.5px solid var(--bad); background:var(--bad-soft); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:10px}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--tab-h) + 14px + env(safe-area-inset-bottom,0px)); z-index:60; background:var(--fg); color:var(--bg); border-radius:12px; padding:10px 12px 10px 16px; display:flex; align-items:center; gap:12px; font-weight:600; font-size:14px; max-width:calc(100% - 32px); box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast button{border:0; background:none; color:var(--accent-soft); font-weight:700; text-decoration:underline; padding:6px}
.empty{text-align:center; padding:28px 16px; display:flex; flex-direction:column; gap:12px; align-items:center}
.empty p{margin:0; max-width:46ch}
.pl{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}
.per{display:grid; grid-template-columns:1fr auto; gap:8px; padding:10px 0; border-bottom:1px solid var(--line)}
.per:last-child{border-bottom:0}
.per .r{display:flex; gap:8px; align-items:center; flex-wrap:wrap; grid-column:1/-1}
.per .r .inp{width:auto; flex:1 1 140px}
.toggle{display:flex; align-items:center; gap:12px; font-size:14px}
.toggle input{width:22px; height:22px; flex:none; accent-color:var(--accent)}
/* Agenda (onglet 3) : jour par jour sur telephone, grille de la semaine en option. Jamais la couleur seule : texte, bordures, motifs. */
.ag-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.ag-top h2{flex:1 0 auto}
.ag-top .btn{min-height:40px; padding:8px 12px}
.ag-days{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; padding-top:6px}
.ag-dchip{position:relative; border:1.5px solid var(--line); background:var(--surface); color:var(--fg); border-radius:12px; padding:7px 2px 6px; display:flex; flex-direction:column; align-items:center; gap:2px; min-height:62px}
.ag-dchip b{font:700 15px/1 var(--display); text-transform:uppercase; letter-spacing:.05em}
.ag-dchip span{font:700 21px/1 var(--display)}
.ag-dchip small{font-size:11px; color:var(--muted); font-weight:600}
.ag-dchip[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.ag-dchip[aria-pressed="true"] small{color:inherit; opacity:.85}
.ag-dchip i, .ag-wd i{position:absolute; top:-8px; left:50%; transform:translateX(-50%); font:700 10px/1.4 var(--body); font-style:normal; background:var(--accent); color:var(--accent-ink); border-radius:6px; padding:0 5px; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap}
.ag-dayhd{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.ag-dayhd b{font:700 22px/1.1 var(--display); text-transform:uppercase; letter-spacing:.02em}
.ag-day{display:grid; grid-template-columns:50px minmax(0,1fr); column-gap:8px; row-gap:6px}
.ag-h{grid-column:1; display:flex; flex-direction:column; justify-content:center}
.ag-h b{font:700 19px/1 var(--display)}
.ag-h span{font-size:12px; color:var(--muted)}
.ag-brk{grid-column:1 / -1; display:flex; align-items:center; gap:8px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.ag-brk::after{content:""; flex:1; border-top:1.5px dashed var(--line)}
.ag-cell{grid-column:2; display:flex; flex-direction:column; gap:6px; min-width:0; position:relative; z-index:1}
.ag-slot{flex:1; text-align:left; border:1.5px solid var(--accent); border-left-width:7px; background:var(--accent-soft); color:var(--fg); border-radius:12px; padding:8px 10px; display:flex; flex-direction:column; justify-content:center; gap:4px; min-height:56px; min-width:0}
.ag-slot.done{border-style:solid; border-color:var(--ok)}
.ag-l1{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:13px}
.ag-l1 > b{font:700 16px/1 var(--display); letter-spacing:.03em}
.ag-blk{font-size:11.5px; font-weight:700; border:1.5px solid currentColor; border-radius:6px; padding:0 5px; line-height:1.4}
.ag-ok{margin-left:auto; font-size:12px; font-weight:700; background:var(--ok); color:var(--surface); border-radius:999px; padding:2px 8px}
.ag-who{font:700 21px/1.05 var(--display); text-transform:uppercase; letter-spacing:.02em; overflow-wrap:anywhere}
.ag-tags{display:flex; flex-wrap:wrap; gap:5px; align-items:center; min-width:0}
.ag-tags:empty{display:none}
.tag.ag-sp{background:var(--fg); color:var(--bg)}
.ag-note{font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; min-width:0}
.ag-empty{grid-column:2; min-height:50px; border:1.5px dashed var(--line); background:transparent; border-radius:12px; color:var(--muted); font-weight:600; font-size:13.5px; text-align:left; padding:0 12px}
.ag-off{border-radius:12px; padding:12px; font-size:13px; font-weight:600; color:var(--muted); text-align:center; border:1.5px solid var(--line); background:repeating-linear-gradient(135deg, var(--surface2) 0 7px, transparent 7px 14px)}
/* grille de la semaine */
.ag-wk{display:grid; grid-template-columns:34px repeat(5,minmax(0,1fr)); gap:3px}
.ag-wd{position:relative; border:1.5px solid transparent; background:none; color:var(--fg); font:700 14px/1.1 var(--display); text-transform:uppercase; padding:8px 0 5px; border-radius:8px}
.ag-wd.sel{border-color:var(--fg)}
.ag-wh{grid-column:1; display:flex; flex-direction:column; justify-content:center; font-size:10px; color:var(--muted); min-height:52px}
.ag-wh b{font:700 14px/1 var(--display); color:var(--fg)}
.ag-wc{display:flex; flex-direction:column; gap:3px; min-width:0}
.ag-mini{flex:1; min-width:0; border:1.5px solid var(--accent); border-left-width:4px; background:var(--accent-soft); color:var(--fg); border-radius:8px; padding:4px; text-align:left; display:flex; flex-direction:column; gap:2px; font-size:11px; overflow:hidden}
.ag-mini.done{border-color:var(--ok)}
.ag-mini b{font:700 13px/1.05 var(--display); text-transform:uppercase; overflow-wrap:anywhere}
.ag-mini .sp{font-weight:700; background:var(--fg); color:var(--bg); border-radius:4px; padding:0 3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ag-mini .ok{font-weight:700}
.ag-mini svg{width:13px; height:13px; vertical-align:-2px}
.ag-wempty{border:1px dashed var(--line); background:transparent; border-radius:8px; color:var(--muted); font-size:17px; min-height:52px}
.ag-wx{border-radius:8px; background:repeating-linear-gradient(135deg, var(--surface2) 0 6px, transparent 6px 12px)}
/* feuilles */
.ag-sum{display:flex; flex-direction:column; gap:6px}
.tag.ag-okt{background:var(--ok); color:var(--surface)}
.tag.ag-todo{background:var(--surface2); color:var(--fg); border:1.5px dashed var(--muted)}
.ag-len{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px}
.ag-lenb{border:1.5px solid var(--line); background:var(--surface); color:var(--fg); border-radius:12px; padding:10px 12px; display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; min-height:58px}
.ag-lenb b{font-size:15px}
.ag-lenb span{font-size:12px; opacity:.85}
.ag-lenb[aria-pressed="true"]{border-color:var(--fg); background:var(--fg); color:var(--bg)}
.ag-lenb[aria-pressed="true"] b::before{content:"✓ "}
.ag-lenb:disabled{opacity:.5; border-style:dashed}
.ag-cls{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:12px; background:var(--surface); overflow:hidden}
.ag-ck{display:flex; align-items:center; gap:12px; padding:10px 12px; border-bottom:1px solid var(--line); min-height:50px}
.ag-ck:last-child{border-bottom:0}
.ag-ck input{width:24px; height:24px; accent-color:var(--accent); flex:none}
.ag-ck > span{display:flex; flex-direction:column; min-width:0}
.ag-ck small{color:var(--muted); font-size:12px}
.ag-ck:has(input:checked){background:var(--accent-soft)}
.ag-addsp[hidden]{display:none}
.ag-warn{color:var(--bad); font-weight:600}
.ag-jr summary{cursor:pointer; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; min-height:28px}
.ag-jr[open] summary{margin-bottom:6px}
/* En-tete : sans la police Barlow (premier lancement hors ligne), le titre poussait la page a 426 px de large sur iPhone. */
header.top .brand{flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis}
header.top .sync{min-width:0; overflow:hidden}

.ag-mic{align-self:flex-start;margin-top:-4px}
.ag-mic.on{background:#d62828;border-color:#d62828;color:#fff;animation:agmic 1.2s ease-in-out infinite}
@keyframes agmic{50%{opacity:.6}}
/* Évaluations formatives / endurance / filles et règles (outils/evals-carnet.js) */
.tag.ev-form{background:var(--surface); color:var(--fg); border:1.5px dashed var(--fg); letter-spacing:.07em; padding:1px 8px; font-size:11.5px; vertical-align:2px}
.tag.ev-endu{background:var(--accent-soft); color:var(--accent); padding:1px 8px; font-size:11.5px; vertical-align:2px}
.ev-formnote{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.ev-seg button{min-height:50px; line-height:1.15}
.ev-type1{font-size:16px}
.ev-kind{display:flex; flex-direction:column; gap:6px}
.ev-kind .chip{justify-content:flex-start; border-radius:12px; padding:10px 13px; min-height:46px; text-align:left}
.ev-endu-f{display:flex; flex-direction:column; gap:10px}
.ev-endu-f[hidden]{display:none}
.ev-mins{display:flex; flex-wrap:wrap; gap:6px}
.ev-mins .chip{min-height:42px; padding:7px 12px}
.ev-endu-c{display:flex; flex-direction:column; gap:10px}
.btn.en-go{min-height:54px; font-size:17px}
.pg-seg{flex:none}
.pg-seg button{min-width:42px; min-height:40px; padding:6px 10px; font-weight:700}
.prow:has(.rg-line){flex-wrap:wrap}
.rg-line{flex:1 1 100%; display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; padding-left:49px; margin-top:-2px}
.rg-chip{display:inline-flex; align-items:center; gap:4px; padding:4px 12px; min-height:32px; border:1.5px solid var(--muted); border-radius:999px; font-size:13px; font-weight:700; color:var(--muted); background:var(--surface)}
.rg-chip.on{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.rg-warn{flex:0 1 auto; font-size:13px; line-height:1.3; font-weight:700; color:var(--warn); background:var(--warn-soft); border-left:4px solid var(--warn); padding:5px 8px; border-radius:6px}

/* Compteur de tours plein écran */
body.en-open{overflow:hidden}
body.en-open .toast{z-index:95; bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.en{position:fixed; inset:0; z-index:70; height:100vh; height:100dvh; background:var(--bg); color:var(--fg); display:flex; flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; overscroll-behavior:none}
.en [hidden]{display:none!important}
.en-top{display:flex; align-items:center; gap:8px; padding:8px 8px 6px}
.en-ib{width:44px; height:56px; flex:none; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); color:var(--fg); font:700 20px/1 var(--body)}
.en-clock{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; border-radius:14px; border:2px solid var(--line); background:var(--surface); padding:4px 6px; min-height:64px}
.en-clock b{font:700 52px/1 var(--display); font-variant-numeric:tabular-nums; letter-spacing:.02em}
.en-clock span{font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; white-space:nowrap}
.en.last .en-clock{border:3px solid var(--warn); background:var(--warn-soft)}
.en.last .en-clock span{color:var(--warn)}
.en.done .en-clock{border:3px solid var(--fg)}
.en-go{flex:none; min-width:108px; height:64px; border-radius:16px; border:0; background:var(--ok); color:#fff; font:700 32px/1 var(--display); letter-spacing:.06em; padding:0 14px; box-shadow:0 3px 0 rgba(0,0,0,.2)}
.en-go.paused{background:var(--surface); color:var(--fg); border:2px solid var(--fg); font-size:22px; box-shadow:none}
.en-btn{border:1.5px solid var(--line); background:var(--surface); color:var(--fg); border-radius:12px; min-height:48px; padding:6px 12px; font:700 15px var(--body); white-space:nowrap}
.en-btn.pri{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.en-btn.stop{border-color:var(--bad); color:var(--bad)}
.en-btn.arm{background:var(--bad); border-color:var(--bad); color:#fff}
.en-btn.sm{min-height:40px; padding:4px 10px; font-size:14px}
.en-btn:disabled{opacity:.4}
.en-bar2{display:flex; align-items:center; gap:6px; padding:0 8px 6px}
.en-bar2 #en-undo{max-width:45%; overflow:hidden; text-overflow:ellipsis}
.en-info{flex:1; min-width:0; text-align:center; font-size:12px; font-weight:600; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.en-flash{margin:0 8px 6px; padding:8px; border-radius:10px; text-align:center; font:700 20px/1.1 var(--display); text-transform:uppercase; letter-spacing:.04em; background:var(--fg); color:var(--bg)}
.en-grid{flex:1; min-height:0; display:grid; gap:6px; padding:0 8px 8px; touch-action:none}
.en-none{grid-column:1/-1; text-align:center; color:var(--muted)}
.en-t{position:relative; min-width:0; min-height:0; overflow:hidden; border:2px solid var(--line); background:var(--surface); border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:4px 4px 10px; cursor:pointer; touch-action:none}
.en-nm{display:flex; flex-direction:column; align-items:center; max-width:100%; line-height:1.05}
.en-nm b{font:700 var(--fn,16px)/1.1 var(--body); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.en-nm small{font-size:max(10px, calc(var(--fn,16px) * .55)); color:var(--muted); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.en-n{font:700 var(--fc,32px)/1 var(--display); font-variant-numeric:tabular-nums}
.en-ago{position:absolute; top:3px; right:6px; font-size:11px; color:var(--muted); font-weight:700}
.en-pb{position:absolute; left:6px; right:6px; bottom:4px; height:5px; border-radius:3px; background:var(--surface2); overflow:hidden}
.en-pb i{display:block; height:100%; width:0; background:var(--accent); transition:width .2s}
.en-ok{display:none; position:absolute; left:50%; bottom:2px; transform:translateX(-50%); font-size:10.5px; line-height:1.2; font-weight:800; background:var(--fg); color:var(--bg); border-radius:6px; padding:1px 6px; white-space:nowrap}
.en-t.full{border:3px solid var(--fg)}
.en-t.full .en-ok{display:block}
.en-t.full .en-pb{display:none}
.en-t.full .en-pb i{background:var(--fg)}
.en-msg{position:absolute; left:50%; top:2px; transform:translateX(-50%); max-width:calc(100% - 8px); white-space:nowrap; overflow:hidden; text-align:center; font-size:12px; font-weight:800; opacity:0; pointer-events:none; background:var(--fg); color:var(--bg); border-radius:6px; padding:1px 6px}
.en-msg:empty{display:none}
.en-t.hit,.en-t.dup,.en-t.minus{z-index:1}
.en-t.hit .en-msg,.en-t.dup .en-msg,.en-t.minus .en-msg{opacity:1}
.en-t.hit{animation:enHit .5s ease-out}
.en-t.dup{animation:enShake .4s; border-style:dashed; border-color:var(--warn)}
.en-t.minus{animation:enMinus .7s; border:3px dashed var(--bad)}
.en-t.minus .en-msg{background:var(--bad); color:#fff}
@keyframes enHit{0%{background:var(--accent); color:var(--accent-ink)} 100%{background:var(--surface)}}
@keyframes enMinus{0%{background:var(--bad-soft)} 100%{background:var(--surface)}}
@keyframes enShake{0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}}
.en-grid.off .en-t{opacity:.6}
.en-grid.tiny .en-ago,.en-grid.tiny .en-nm small{display:none}
.en-end{position:absolute; left:12px; right:12px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:3; background:var(--surface); border:3px solid var(--fg); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:8px; box-shadow:0 10px 30px rgba(0,0,0,.35); text-align:center}
.en-end b{font:700 30px/1 var(--display); text-transform:uppercase; letter-spacing:.04em}
.en-pop{position:absolute; right:8px; top:calc(env(safe-area-inset-top,0px) + 128px); z-index:4; width:min(330px, calc(100% - 16px)); background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.3); padding:14px; display:flex; flex-direction:column; gap:10px}
.en-sum{position:absolute; inset:0; z-index:5; background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch; padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:10px; user-select:text; -webkit-user-select:text}
.en-sum>*{flex:none}
.en-sh{display:flex; flex-direction:column; gap:4px}
.en-sh b{font:700 24px/1.1 var(--display); text-transform:uppercase}
.en-slist{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.en-srow{display:flex; align-items:center; gap:8px; padding:6px 10px; border-bottom:1px solid var(--line)}
.en-srow:last-child{border-bottom:0}
.en-srow .nm{flex:1; min-width:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.en-step{display:flex; align-items:center; gap:4px; flex:none}
.en-step button{width:38px; height:40px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); color:var(--fg); font:700 20px/1 var(--body)}
.en-step input{width:56px; text-align:center; font-weight:700; padding:8px 4px}
.en-srow .sc{width:66px; text-align:right; font:700 20px/1 var(--display)}
.en-srow .sc small{font-size:12px; color:var(--muted)}
.en-ask{position:absolute; inset:0; z-index:6; background:rgba(8,14,22,.55); display:grid; place-items:center; padding:16px}
.en-ask>div,.en-modal>div{background:var(--surface); color:var(--fg); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:12px; max-width:440px; width:100%}
.en-ask .row2>.en-btn{flex:1 1 120px}
.en-modal{position:fixed; inset:0; z-index:75; background:rgba(8,14,22,.5); display:grid; place-items:center; padding:16px}
.en-cl{position:absolute; bottom:10px; left:6px; max-width:30%; text-overflow:ellipsis; overflow:hidden; white-space:nowrap; font-size:10.5px; line-height:1.2; font-weight:800; color:var(--muted); letter-spacing:.02em}
.en-scl{padding:6px 10px; font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; background:var(--surface2); border-bottom:1px solid var(--line)}
.en-t.full .en-cl{bottom:3px}
/* Nom / prénom et onglet Évaluation par groupe (outils/groupes-carnet.js) */
.gr-nom{align-items:flex-end}
.gr-add{display:flex; flex-direction:column; gap:6px; padding-top:4px}
.gr-chips .chip.sess[aria-pressed="true"]{outline:2px solid var(--fg); outline-offset:1px}
.gr-for{display:flex; flex-direction:column; gap:2px; padding:10px 12px; border-radius:12px; border:2px solid var(--fg); background:var(--surface)}
.tag.gr-only{display:inline-block; margin-top:4px; background:var(--surface); color:var(--fg); border:1.5px dashed var(--muted); font-size:11.5px; padding:1px 8px; width:max-content}
/* Classes > Suivi (tenue & attitude) */
.su-f .chip{min-height:38px}
.su-sheet{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.su-hd{display:flex; flex-direction:column; gap:2px; padding:12px 14px; border-bottom:2px solid var(--fg)}
.su-hd b{font:700 18px/1.15 var(--display); letter-spacing:.02em; text-transform:uppercase}
.su-hd span{font-size:13px; color:var(--muted)}
.su-tw{overflow-x:auto}
.su-t{border-collapse:collapse; width:100%; font-size:14px; font-variant-numeric:tabular-nums}
.su-t th{font-size:11.5px; line-height:1.15; font-weight:700; color:var(--muted); background:var(--surface2); padding:6px 3px; text-align:center; vertical-align:bottom; min-width:44px; border-bottom:1px solid var(--line)}
.su-t td{padding:8px 4px; text-align:center; border-bottom:1px solid var(--line); vertical-align:middle}
.su-t tr:last-child td{border-bottom:0}
.su-t .su-nm{text-align:left; position:sticky; left:0; background:var(--surface); min-width:104px; max-width:138px; padding-left:10px; border-right:1px solid var(--line); z-index:1}
.su-t th.su-nm{background:var(--surface2); vertical-align:bottom}
.su-t .su-nm button{overflow-wrap:anywhere; border:0; background:none; padding:0; font:inherit; font-weight:700; color:var(--fg); text-align:left; display:flex; gap:4px; align-items:baseline; width:100%; line-height:1.2}
.su-t .su-nm button span{color:var(--muted); margin-left:auto; font-weight:400}
.su-rel{display:block; font-size:11.5px; color:var(--muted); margin-top:2px; white-space:nowrap}
.su-ic{display:inline-grid; place-items:center; min-width:20px; height:20px; flex:none}
.su-t th .su-ic{display:grid; margin:0 auto 3px}
.su-ic svg{width:18px; height:18px}
.su-ic-t{font:800 12px/1 var(--body); letter-spacing:0; border:1.5px solid currentColor; border-radius:5px; padding:2px 3px}
.su-n{display:inline-grid; place-items:center; min-width:28px; height:26px; padding:0 6px; border-radius:7px; background:var(--surface2); color:var(--fg); font-weight:800; border:1.5px solid var(--fg)}
.su-n.x{background:var(--bad); color:var(--surface); border-color:var(--bad)}
.su-z{color:var(--muted); opacity:.6}
.su-st{display:block; font-size:10.5px; font-weight:700; color:var(--warn); margin-top:2px; white-space:nowrap}
.su-t td.su-pt{font-weight:700; white-space:nowrap; border-left:1px solid var(--line); font-size:13px; line-height:1.35; padding-inline:6px}
.su-pt span{display:block}
.su-pt small{font-weight:400; color:var(--muted)}
.su-pt .zero{color:var(--bad); text-decoration:underline; text-decoration-thickness:2px}
.su-t th.su-ptl{border-left:1px solid var(--line)}
.su-none{margin:0; padding:18px 14px; color:var(--muted)}
.su-quiet{margin:0; padding:9px 14px; font-size:13px; color:var(--muted); border-top:1px solid var(--line); background:var(--surface2)}
.su-cnts{display:flex; flex-wrap:wrap; gap:6px}
.su-cnt{display:inline-flex; align-items:center; gap:5px; padding:5px 10px 5px 7px; border:1px solid var(--line); border-radius:999px; font-size:13px; color:var(--muted)}
.su-cnt.on{color:var(--fg); border-color:var(--fg)}
.su-cnt b{font-size:14px}
.su-list{padding:4px 14px}
.su-ev{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
.su-ev:last-child{border-bottom:0}
.su-d{width:78px; flex:none; font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; display:flex; flex-direction:column}
.su-d small{font-weight:500; color:var(--muted); font-size:12px}
.su-l{flex:1; min-width:0; line-height:1.3}
.su-stt{display:inline-block; font-size:12px; font-weight:700; color:var(--warn); background:var(--warn-soft); border-left:3px solid var(--warn); padding:1px 6px; border-radius:4px; margin-top:2px}
@media print{ #tabs, .cvh .ib, .seg, .chips, .su .btn, .su > p{display:none !important} .su-sheet{border:0} }
/* Réglages : sommaire et rubriques */
.reg-toc{position:sticky; top:0; z-index:5; background:var(--bg); padding:6px 0; margin-block:-4px}
.reg-toc .chip{min-height:38px}
.reg-sub{display:block; margin-top:4px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; font-size:12px}
.card.reg, #tt-card, #sp-card{scroll-margin-top:64px}
@keyframes regflash{0%{box-shadow:0 0 0 4px var(--accent)} 100%{box-shadow:0 0 0 0 transparent}}
.reg-flash{animation:regflash 1.6s ease-out}

<script>
/* ====== Icônes ====== */
const IC = {

  bag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="8" width="16" height="13" rx="2.5"/><path d="M9 8V6a3 3 0 0 1 6 0v2M4 13h16"/></svg>',
  swim:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="16.5" cy="6" r="2"/><path d="M4 12.5l5-3 3.5 2.5 3-2M2 17c1.7 0 1.7-1.3 3.3-1.3s1.7 1.3 3.4 1.3 1.6-1.3 3.3-1.3 1.7 1.3 3.3 1.3 1.7-1.3 3.4-1.3S20.3 17 22 17"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V2"/><path d="M9 18.1 10 14H4.2a2 2 0 0 1-1.9-2.6l2.3-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.8a2 2 0 0 0-1.8 1.1L12 22a3.1 3.1 0 0 1-3-3.9z"/></svg>',
  wave:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 10c1.7 0 1.7-1.5 3.3-1.5S7 10 8.7 10s1.6-1.5 3.3-1.5 1.7 1.5 3.3 1.5 1.7-1.5 3.4-1.5S20.3 10 22 10M2 16c1.7 0 1.7-1.5 3.3-1.5S7 16 8.7 16s1.6-1.5 3.3-1.5 1.7 1.5 3.3 1.5 1.7-1.5 3.4-1.5S20.3 16 22 16"/></svg>',
  ball:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg>',
};

/* ====== Outils ====== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nid = p => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoOf(new Date());
const dOf = iso => { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (iso, n) => { const d = dOf(iso); d.setDate(d.getDate()+n); return isoOf(d); };
const JOURS = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'], JOURSL = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'], MOISL = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const fmtD = iso => { const d = dOf(iso); return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}`; };
const fmtDL = iso => { const d = dOf(iso); return `${JOURSL[d.getDay()]} ${d.getDate()} ${MOISL[d.getMonth()]}`; };
const fr = (n, dec = 1) => n == null || isNaN(n) ? '—' : (Math.round(n * 10**dec) / 10**dec).toLocaleString('fr-BE');
const initials = n => n.trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
const avatar = (p, cls = '') => `<span class="av ${cls}">${PH[p.id] ? `<img src="${PH[p.id]}" alt="">` : esc(initials(p.n))}</span>`;
const parseNum = v => { if (v == null) return null; v = String(v).trim().replace(',', '.'); if (v === '') return null; const n = Number(v); return isNaN(n) ? null : n; };

/* ====== Données ======
   S.classes[] = { id, name, ts, pupils:[{id,n}], periods:[{id,name,start,type:'salle'|'piscine'}],
                   lessons:[{id,date,type,m:{pid:{a:'A'|'R'|'D', k:1, np:1, d:n}}}],
                   evals:[{id,periodId,name,max,date,s:{pid:nombre|'abs'}}] }
   PH = { pid: photo (dataURL) }                                                                 */
const KEY = 'carnet-eps-v1', PKEY = 'carnet-eps-photos-v1', UKEY = 'carnet-eps-ui';
const DEF_SET = { T: 4, C: 4, se: 60, npCounts: false, X: 2 };
let S = { v: 1, ts: 0, cur: null, settings: {...DEF_SET}, classes: [], deleted: [] };
let PH = {};
let UI = { tab: 'today', date: today(), period: {}, sort: 'name' };
try { const o = JSON.parse(localStorage.getItem(KEY)); if (o && Array.isArray(o.classes)) S = {...S, ...o, settings: {...DEF_SET, ...(o.settings||{})}}; } catch(e){}
try { PH = JSON.parse(localStorage.getItem(PKEY)) || {}; } catch(e){}
try { const u = JSON.parse(localStorage.getItem(UKEY)); if (u) UI = {...UI, tab: u.tab || 'today', period: u.period || {}, sort: u.sort || 'name', ctab: u.ctab, cview: !!u.cview}; } catch(e){}
if (!S.deleted) S.deleted = [];

const C = () => S.classes.find(c => c.id === S.cur) || S.classes[0] || null;
const byName = (a, b) => a.n.localeCompare(b.n, 'fr', {sensitivity: 'base'});
const pupilsOf = c => [...c.pupils].sort(byName);
const periodsOf = c => [...c.periods].sort((a, b) => a.start < b.start ? -1 : 1);
function periodOf(c, date){ const ps = periodsOf(c); let r = ps[0] || null; ps.forEach(p => { if (p.start <= date) r = p; }); return r; }
function viewPeriod(c){ const id = UI.period[c.id]; if (id === 'year') return 'year'; return c.periods.find(p => p.id === id) || periodOf(c, today()); }
const lessonOn = (c, date, h) => c.lessons.find(l => l.date === date && (l.h || null) === (h || null));

// Annee scolaire choisie (bouton a cote du titre) : les dates proposees suivent l'annee.
function decalAnnee(){ try { const a = parseInt(localStorage.getItem('carnet-eps-annee'), 10); return a ? a - 2026 : 0; } catch(e){ return 0; } }
function defaultPeriods(){
  return [['Période 1','2026-08-31','salle'],['Période 2','2026-10-17','salle'],['Période 3','2026-12-19','salle'],['Période 4','2027-03-31','salle']]
    .map(([name, start, type]) => ({id: nid('p'), name, start: (+start.slice(0, 4) + decalAnnee()) + start.slice(4), type}));
}
function newClass(name, names, periods){
  const c = { id: nid('c'), name: name || 'Nouvelle classe', ts: Date.now(), pupils: [], periods: periods || defaultPeriods(), lessons: [], evals: [] };
  addPupils(c, names || '');
  return c;
}
/* addPupils : voir groupes-carnet.js (nom et prénom) */

/* Certificats médicaux : p.certs = [{id, from, to, note}], photo dans PH['cert_' + id] */
// type de lecon ('salle' ou 'piscine') : un certificat « piscine seulement » ne dispense pas en salle, et inversement.
const certOn = (p, date, type) => (p.certs || []).find(x => x.from <= date && date <= x.to && (!type || !x.zone || x.zone === 'tout' || x.zone === type)) || null;
const zoneTxt = x => x.zone === 'piscine' ? 'piscine seulement' : x.zone === 'salle' ? 'salle seulement' : '';
function effA(p, L){ const mm = L.m[p.id] || {}; if (mm.a) return mm.a; return certOn(p, L.date, L.type) ? 'D' : 'P'; }

/* ====== Calcul des points ====== */
function compute(c, p){
  const st = S.settings, T = +st.T || 0, Cc = +st.C || 0, res = {};
  c.pupils.forEach(pu => res[pu.id] = {t: T, c: Cc, x: 0, abs: 0, late: 0, disp: 0, kit: 0, np: 0, d: 0, n: 0, ev: [], sfS: 0, sfM: 0, evals: []});
  // points déjà retirés avant l'appli (repris de l'ancien relevé), sans report d'une colonne à l'autre
  const adj = (c.adj || {})[p.id] || {};
  c.pupils.forEach(pu => { const a = adj[pu.id], r = res[pu.id]; if (!a) return;
    ['t', 'c'].forEach(col => { for (let i = 0; i < (a[col] || 0); i++){ if (r[col] > 0) r[col]--; r.ev.push({date: p.start, label: 'Repris du relevé de l\'école', col, hit: col, key: 'adj'}); } }); });
  const ls = c.lessons.filter(l => periodOf(c, l.date)?.id === p.id).sort((a, b) => a.date < b.date ? -1 : 1);
  ls.forEach(l => c.pupils.forEach(pu => {
    const r = res[pu.id], m = l.m[pu.id] || {};
    const a = effA(pu, l);
    if (a === 'A'){ r.abs++; return; }
    r.n++; if (a === 'R') r.late++; if (a === 'D') r.disp++;
    const f = [];
    if (m.k){ r.kit++; for (let i = 0; i < stN('kitPts'); i++) f.push(['t', l.type === 'piscine' ? 'Pas ses affaires de piscine' : 'Pas sa tenue', 'k']); }
    if (m.np){ r.np++; if (st.npCounts) for (let i = 0; i < stN('npPts'); i++) f.push(['t', 'Ne participe pas à la piscine', 'np']); }
    if (m.x){ r.x++; for (let i = 0; i < (+st.X || 0); i++) f.push(['c', 'Exclu du cours', 'x']); }
    else if (m.d){ r.d++; for (let i = 0; i < stN('dPts'); i++) f.push(['c', 'Perturbe le cours', 'd']); }
    f.forEach(([col, label, key]) => {
      let hit = col;
      const sp = stB('spill');
      if (col === 't'){ if (r.t > 0) r.t--; else if (sp && r.c > 0){ r.c--; hit = 'c'; } else hit = '-'; }
      else { if (r.c > 0) r.c--; else if (sp && r.t > 0){ r.t--; hit = 't'; } else hit = '-'; }
      r.ev.push({date: l.date, label, col, hit, lid: l.id, key});
    });
  }));
  const evs = c.evals.filter(e => e.periodId === p.id && e.kind !== 'form').sort((a, b) => (a.date || '') < (b.date || '') ? -1 : 1);
  c.pupils.forEach(pu => {
    const r = res[pu.id];
    evs.forEach(e => { const s = e.s[pu.id]; r.evals.push({e, s}); if (typeof s === 'number'){ r.sfS += s; r.sfM += +e.max; } });
    r.seMax = T + Cc;
    r.se = r.seMax ? (r.t + r.c) / r.seMax * st.se : 0;
    r.sf = r.sfM ? r.sfS / r.sfM * (100 - st.se) : null;
    r.total = r.sf == null ? null : r.se + r.sf;
  });
  return {res, lessons: ls, evals: evs};
}
function computeYear(c){
  const per = periodsOf(c).map(p => ({p, x: compute(c, p)})).filter(o => o.x.lessons.length || o.x.evals.length);
  const res = {};
  c.pupils.forEach(pu => {
    const rs = per.map(o => o.x.res[pu.id]);
    const avg = arr => { const v = arr.filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
    const sum = k => rs.reduce((a, r) => a + r[k], 0);
    res[pu.id] = { se: avg(rs.map(r => r.se)), sf: avg(rs.map(r => r.sf)), total: avg(rs.map(r => r.total)), abs: sum('abs'), late: sum('late'), kit: sum('kit'), np: sum('np'), d: sum('d'), x: sum('x'), n: sum('n'), t: null, c: null, ev: [], evals: [] };
  });
  return {res, periods: per.map(o => o.p), lessons: per.flatMap(o => o.x.lessons), evals: per.flatMap(o => o.x.evals)};
}

/* ====== Sauvegarde : appareil + en ligne ====== */
let cloud = null, dirty = new Set(), metaDirty = false, phDirty = new Set(), phDel = new Set(), pushTimer = null, pushing = false;
function persistLocal(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  try { localStorage.setItem(UKEY, JSON.stringify({tab: UI.tab, period: UI.period, sort: UI.sort, ctab: UI.ctab, cview: UI.cview})); } catch(e){}
}
function persistPhotos(){
  try { localStorage.setItem(PKEY, JSON.stringify(PH)); }
  catch(e){ try { const o = {}; Object.keys(PH).forEach(k => { if (!k.startsWith('cert_')) o[k] = PH[k]; }); localStorage.setItem(PKEY, JSON.stringify(o)); } catch(e2){}
    if (!cloud) toast('Mémoire du téléphone pleine pour les photos.'); }
}
function save(cid){
  S.ts = Date.now();
  if (cid){ const c = S.classes.find(x => x.id === cid); if (c) c.ts = S.ts; dirty.add(cid); }
  metaDirty = true; persistLocal(); schedulePush();
}
function saveUI(){ try { localStorage.setItem(UKEY, JSON.stringify({tab: UI.tab, period: UI.period, sort: UI.sort, ctab: UI.ctab, cview: UI.cview})); } catch(e){} }
function schedulePush(){ if (!cloud) return; clearTimeout(pushTimer); setSync('busy'); pushTimer = setTimeout(push, 900); }
async function push(){
  if (!cloud) return; if (pushing){ schedulePush(); return; }
  pushing = true;
  try {
    while (dirty.size || metaDirty || phDirty.size || phDel.size){
      for (const id of [...dirty]){ dirty.delete(id); const c = S.classes.find(x => x.id === id);
        if (c) await cloud.classes.doc(id).set(JSON.parse(JSON.stringify(c))); else await cloud.classes.doc(id).delete().catch(() => {}); }
      if (metaDirty){ metaDirty = false; await cloud.meta.set({ts: S.ts, cur: S.cur, settings: S.settings, order: S.classes.map(c => c.id), deleted: S.deleted.slice(-300)}); }
      for (const id of [...phDirty]){ phDirty.delete(id); if (PH[id]) await cloud.photos.doc(id).set({img: PH[id], ts: Date.now()}); }
      for (const id of [...phDel]){ phDel.delete(id); await cloud.photos.doc(id).delete().catch(() => {}); }
    }
    setSync('ok');
  } catch(e){
    S.classes.forEach(c => dirty.add(c.id)); metaDirty = true;
    setSync('err', e?.code === 'quota_exceeded' ? 'Espace en ligne plein' : 'Pas enregistré en ligne');
    clearTimeout(pushTimer); pushTimer = setTimeout(push, 20000);
  } finally { pushing = false; }
}
function setSync(s, label){
  const el = $('sync'); el.className = 'sync ' + s;
  el.querySelector('span').textContent = label || ({ok: 'En ligne', busy: 'Envoi…', err: 'Hors ligne', local: 'Cet appareil'})[s];
  el.title = ({ok: 'Enregistré sur cet appareil', busy: 'Enregistrement en cours', err: 'Les changements sont gardés sur ce téléphone et renvoyés plus tard', local: 'Enregistré seulement sur cet appareil'})[s];
}
async function connectCloud(){
  return; // version site : tout reste sur l'appareil
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    const meta = db.doc('data/users/' + uid + '/carnet');
    const c = {meta, classes: meta.collection('classes'), photos: meta.collection('photos')};
    setSync('busy');
    const [m, cs, ps] = await Promise.all([meta.get(), c.classes.limit(200).get(), c.photos.limit(1000).get()]);
    const rm = m.exists ? m.data() : null;
    let changed = false;
    const del = new Set([...(S.deleted || []), ...((rm && rm.deleted) || [])]);
    S.deleted = [...del];
    const remote = {}; cs.docs.forEach(d => { const v = d.data(); if (v && v.id) remote[v.id] = v; });
    const ids = new Set([...S.classes.map(x => x.id), ...Object.keys(remote)]);
    const merged = [];
    ids.forEach(id => {
      if (del.has(id)){ if (remote[id]) dirty.add(id); if (S.classes.some(x => x.id === id)) changed = true; return; }
      const l = S.classes.find(x => x.id === id), r = remote[id];
      if (l && r){ if ((r.ts || 0) > (l.ts || 0)){ merged.push(r); changed = true; } else { merged.push(l); if ((l.ts || 0) > (r.ts || 0)) dirty.add(id); } }
      else if (r){ merged.push(r); changed = true; }
      else { merged.push(l); dirty.add(id); }
    });
    const order = (rm && (rm.ts || 0) > (S.ts || 0) ? rm.order : S.classes.map(x => x.id)) || [];
    merged.sort((a, b) => { const ia = order.indexOf(a.id), ib = order.indexOf(b.id); return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib); });
    S.classes = merged;
    if (rm && (rm.ts || 0) > (S.ts || 0)){ S.settings = {...DEF_SET, ...(rm.settings || {})}; if (rm.cur) S.cur = rm.cur; S.ts = rm.ts; changed = true; }
    else if (S.ts) metaDirty = true;
    ps.docs.forEach(d => { const v = d.data(); if (v && v.img && !PH[d.id]){ PH[d.id] = v.img; changed = true; } });
    const remotePh = new Set(ps.docs.map(d => d.id));
    Object.keys(PH).forEach(id => { if (!remotePh.has(id)) phDirty.add(id); });
    cloud = c;
    try { const sd = await db.doc('seed/import').get(); const v = sd.exists ? sd.data() : null;
      if (v && v.id && Array.isArray(v.classes) && !(S.settings.seeds || []).includes(v.id)){ applySeed(v); changed = true; } } catch(e){}
    if (migrate()) changed = true;
    if (changed){ persistLocal(); persistPhotos(); render(); }
    if (dirty.size || metaDirty || phDirty.size) push(); else setSync('ok');
  } catch(e){ cloud = null; setSync('err', 'Cet appareil'); }
}

/* Import préparé par Claude (classes, notes de la période 1, horaire) : remplace les classes de test, une seule fois */
function applySeed(v){
  S.classes.forEach(c => { if (!v.classes.some(x => x.id === c.id)){ S.deleted.push(c.id); dirty.add(c.id);
    c.pupils.forEach(p => { if (PH[p.id]){ delete PH[p.id]; phDel.add(p.id); } (p.certs || []).forEach(x => { delete PH['cert_' + x.id]; phDel.add('cert_' + x.id); }); }); } });
  const now = Date.now();
  S.classes = v.classes.map(c => ({...c, ts: now}));
  S.classes.forEach(c => dirty.add(c.id));
  S.settings.tt = v.tt || [];
  S.settings.seeds = [...(S.settings.seeds || []), v.id];
  S.cur = S.classes[0]?.id || null; UI.cview = false; UI.sess = null;
  S.ts = now; metaDirty = true; persistLocal(); persistPhotos();
  setTimeout(() => toast('Tes classes, ton horaire et les notes de la période 1 sont importés'), 300);
}

/* Année 2026-2027 : 4 périodes (fin 16/10, 18/12, 30/03, 29/06), piscine en alternance 1res / 2es, piscine seulement le mardi */
const MIG = 'periodes-2026-v1';
function migrate(){
  if ((S.settings.seeds || []).includes(MIG)) return false;
  const starts = ['2026-08-31', '2026-10-17', '2026-12-19', '2027-03-31'];
  S.classes.forEach(c => {
    if (!c.periods) return;
    const old = periodsOf(c), yr = (c.name || '').trim()[0];
    const types = c.act ? ['salle','salle','salle','salle'] : yr === '2' ? ['piscine','salle','piscine','salle'] : yr === '1' ? ['salle','piscine','salle','piscine'] : null;
    c.periods = starts.map((st, i) => ({id: old[i]?.id || nid('p'), name: 'Période ' + (i + 1), start: st, type: types ? types[i] : (old[i]?.type || 'salle')}));
    const keep = new Set(c.periods.map(p => p.id)), last = c.periods[3].id;
    c.evals.forEach(e => { if (!keep.has(e.periodId)) e.periodId = last; });
    save(c.id);
  });
  tt().forEach(t => { if (t.d === 4) t.salle = true; });
  S.settings.seeds = [...(S.settings.seeds || []), MIG]; save();
  return true;
}
/* Type d'une nouvelle leçon : piscine seulement si la période est piscine et que ce créneau n'est pas « toujours salle » */
function lessonType(c, date, h){
  const per = periodOf(c, date); if (!per || per.type !== 'piscine') return 'salle';
  const wd = dOf(date).getDay();
  if (wd !== 2) return 'salle';
  return tt().some(t => t.d === wd && t.h === h && t.cls.includes(c.id) && t.salle) ? 'salle' : 'piscine';
}

/* ====== Toast ====== */
let toastT = null;
function toast(msg, action, fn){
  document.querySelector('.toast')?.remove(); clearTimeout(toastT);
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button">${esc(action)}</button>` : '');
  if (action) t.querySelector('button').onclick = () => { t.remove(); fn(); };
  document.body.appendChild(t); toastT = setTimeout(() => t.remove(), action ? 5000 : 2600);
}

/* ====== Horaire de l'école ====== */
const HOURS = [['H1','8h25','9h15'],['H2','9h15','10h05'],['H3','10h05','10h55'],['H4','11h15','12h05'],['H5','12h05','12h55'],['H6','14h00','14h50'],['H7','14h50','15h40'],['H8','15h40','16h30']];
const DAYS = [[1,'Lundi'],[2,'Mardi'],[3,'Mercredi'],[4,'Jeudi'],[5,'Vendredi']];
const hI = k => HOURS.findIndex(h => h[0] === k);
const mins = t => { const [a, b] = t.split('h').map(Number); return a * 60 + b; };
const slotLabel = s => s.h ? (s.h2 && s.h2 !== s.h ? `${s.h}–${s.h2}` : s.h) : 'Sans heure';
const slotTime = s => s.h ? `${HOURS[hI(s.h)][1]} – ${HOURS[hI(s.h2 || s.h)][2]}` : '';
const tt = () => S.settings.tt || (S.settings.tt = []);
const clsName = ids => ids.map(id => S.classes.find(c => c.id === id)?.name).filter(Boolean).join(' + ');
const isAct = id => !!S.classes.find(c => c.id === id)?.act;
/* Plusieurs groupes d'activité à la même heure = un seul cours où l'on choisit le groupe du jour */
function actName(ids){
  const ns = ids.map(id => S.classes.find(c => c.id === id)?.name).filter(Boolean); if (!ns.length) return '';
  const w = ns[0].split(' ')[0];
  return ns.length > 1 && ns.every(n => n.startsWith(w + ' ')) ? `${w} (${ns.map(n => n.slice(w.length + 1)).join(', ')})` : ns.join(' / ');
}
function ttView(){
  const out = [];
  tt().forEach(s => {
    const act = s.cls.length && s.cls.every(isAct);
    const o = act && out.find(x => x.pick && x.d === s.d && x.h === s.h && x.h2 === s.h2);
    if (o){ s.cls.forEach(id => { if (!o.cls.includes(id)) o.cls.push(id); }); o.ids.push(s.id); }
    else out.push({...s, cls: [...s.cls], ids: [s.id], pick: act});
  });
  out.forEach(x => { if (x.pick && x.cls.length < 2) x.pick = false; });
  return out;
}
const slotName = s => s.pick ? 'Activité complémentaire' : clsName(s.cls);

/* Les cours d'un jour : ceux de l'horaire + ceux déjà notés hors horaire */
function sessionsOn(date){
  const wd = dOf(date).getDay(), out = [];
  ttView().filter(s => s.d === wd).forEach(s => { const cls = s.cls.filter(id => S.classes.some(c => c.id === id)); if (cls.length) out.push({key: 's' + s.id, h: s.h, h2: s.h2, cls, pick: s.pick && cls.length > 1}); });
  S.classes.forEach(c => c.lessons.filter(l => l.date === date).forEach(l => {
    const h = l.h || null;
    if (out.some(x => (x.h || null) === h && x.cls.includes(c.id))) return;
    const o = out.find(x => x.adhoc && (x.h || null) === h);
    if (o) o.cls.push(c.id); else out.push({key: 'a' + (h || '0'), h, h2: l.h2 || h, cls: [c.id], adhoc: true});
  }));
  return out.sort((a, b) => (a.h ? hI(a.h) : 99) - (b.h ? hI(b.h) : 99));
}
function pickSession(list, date){
  if (UI.sess && UI.sess.date === date){ const f = list.find(x => x.key === UI.sess.key); if (f) return f; if (UI.sess.custom) return UI.sess.custom; }
  if (!list.length) return null;
  if (date === today()){ const now = new Date(), n = now.getHours() * 60 + now.getMinutes();
    return list.find(x => x.h && n <= mins(HOURS[hI(x.h2 || x.h)][2])) || list[list.length - 1]; }
  return list[0];
}

function demoClass(){
  const names = 'Exemple Adam\nExemple Bilal\nExemple Chloé\nExemple Dina\nExemple Elias\nExemple Fatima\nExemple Gabin\nExemple Hana\nExemple Inès\nExemple Jonas\nExemple Kenza\nExemple Louis';

}

/* ====== Récap piscine + message WhatsApp pour les éducateurs ====== */
function poolStay(pairs){
  const out = [];
  pairs.forEach(([c, L]) => { if (!L || L.type !== 'piscine') return;
    pupilsOf(c).forEach(p => { const a = effA(p, L), mm = L.m[p.id] || {}, cert = certOn(p, L.date, L.type), why = [];
      if (a === 'A') return;
      if (a === 'D') why.push(cert ? `certificat médical (jusqu'au ${cert.to.slice(8)}/${cert.to.slice(5, 7)})${cert.note ? ', ' + cert.note : ''}` : 'dispensé');
      if (mm.k) why.push('pas ses affaires de piscine');
      if ((mm.np || mm.rg) && a !== 'D') why.push('ne nage pas');
      if (why.length) out.push({c, p, why: why.join(', ')});
    }); });
  return out;
}
function poolMessage(pairs, date){
  const st = poolStay(pairs), d = dOf(date), classes = pairs.map(([c]) => c.name).join(', ');
  const work = S.settings.work ?? 'J\'ai laissé un travail à faire.';
  const when = `piscine du ${JOURSL[d.getDay()]} ${d.getDate()} ${MOISL[d.getMonth()]} (${classes})`;
  if (!st.length) return `Bonjour, ${when} : tout le monde nage aujourd'hui, personne ne reste à l'école. Merci !`;
  return `Bonjour, ${when}.\nCes élèves restent à l'école :\n` + st.map(x => `- ${x.p.n} (${x.c.name}) : ${x.why}`).join('\n') + (work.trim() ? '\n' + work.trim() : '') + '\nMerci !';
}

  rows.push({h: 22, cells: [{v: '', s: XS.AVGL}, {v: 'Moyenne de la classe', s: XS.AVGL}, ...per.map(o => ({v: avg(ps.map(pu => o.x.res[pu.id].total)), s: XS.AVGN})), {v: avg(ps.map(pu => Y[pu.id].total)), s: XS.AVGN}, {v: avg(ps.map(pu => Y[pu.id].se)), s: XS.AVGN}, {v: avg(ps.map(pu => Y[pu.id].sf)), s: XS.AVGN}, ...Array(4).fill(0).map(() => ({v: '', s: XS.AVGL}))]});

async function exportXlsx(list, title){

async function offerFile(filename, blob, what){
  let dl = null; try { dl = window.claude?.use ? await claude.use('downloads') : null; } catch(e){}

    if (dl){ await dl.save({filename, data: blob}); toast(what + ' enregistré'); return; }

/* Photos : recadrées en carré 240 px, JPEG */
let photoTarget = null;
$('photoin').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f || !photoTarget) return;
  try {
    const url = URL.createObjectURL(f);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(img.naturalWidth, img.naturalHeight), cv = document.createElement('canvas'); cv.width = cv.height = 240;
    cv.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, 240, 240);
    URL.revokeObjectURL(url);
    const {c, pid} = photoTarget;
    PH[pid] = cv.toDataURL('image/jpeg', 0.72); phDirty.add(pid); phDel.delete(pid); persistPhotos(); schedulePush();
    openPupil(c, pid); toast('Photo ajoutée');
  } catch(err){ toast('Cette image n\'a pas pu être lue'); }
};

function loadImg(f){ return new Promise((res, rej) => { const u = URL.createObjectURL(f), i = new Image(); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = rej; i.src = u; }); }
async function shrinkDoc(f){
  const img = await loadImg(f);
  for (const [side, q] of [[1400, .7], [1200, .6], [1000, .55], [800, .5]]){
    const k = Math.min(1, side / Math.max(img.naturalWidth, img.naturalHeight)), cv = document.createElement('canvas');
    cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    const d = cv.toDataURL('image/jpeg', q); if (d.length < 230000) return d;
  }
  throw new Error('trop grand');
}

/* ====== Agenda : la semaine type (= l'horaire S.settings.tt) et ce qui a été fait à chaque cours ======
   - Horaire : S.settings.tt = [{id, d, h, h2, cls, salle?}] (le même que Réglages › Mon horaire).
   - Sport et note d'un cours daté : sur les leçons de chaque classe (l.sport, l.note).
     Avant l'appel (pas encore de leçon) : S.settings.ag['AAAA-MM-JJ|H1'] = {s, n}, repris dans les leçons au début de l'appel.
   - Sports ajoutés par l'enseignant : S.settings.sports = [noms].
   Tout passe par save() / save(c.id) : appareil + Drive (réglages par S.ts, classes par c.ts). */
IC.cal = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M7 13.5h2M11 13.5h2M15 13.5h2M7 17h2M11 17h2"/></svg>';
const SPORTS0 = ['Natation','Badminton','Basket-ball','Volley-ball','Football','Handball','Unihoc (floorball)','Athlétisme','Gymnastique','Acrosport',"Course d'endurance",'Tennis de table','Jeux de raquettes','Danse','Rugby (flag/tag)','Ultimate','Kin-ball','Tchoukball','Baseball/Softball','Jeux collectifs',"Jeux d'opposition / Lutte",'Escalade','Musculation / Renforcement','Condition physique','Orientation','Cirque / Jonglerie','Koh-Lanta','Évaluation'];
const lastH = d => d === 3 ? 'H5' : 'H8';          // le mercredi s'arrête à H5
const DAYS2 = ['', 'Lu', 'Ma', 'Me', 'Je', 'Ve'];
const dayName = d => (DAYS.find(x => x[0] === d) || [0, ''])[1];
const wdOf = iso => dOf(iso).getDay();
const mondayOf = iso => { const w = wdOf(iso); return addDays(iso, w === 0 ? -6 : 1 - w); };
const agToday = () => { const t = today(), w = wdOf(t); return w === 6 ? addDays(t, 2) : w === 0 ? addDays(t, 1) : t; };
const clsById = id => S.classes.find(c => c.id === id);

/* --- Sports --- */
const sportsCustom = () => Array.isArray(S.settings.sports) ? S.settings.sports : [];
const sameTxt = (a, b) => a.localeCompare(b, 'fr', {sensitivity: 'base'}) === 0;
function sportsList(){
  const out = [...SPORTS0];
  [...sportsCustom()].sort((a, b) => a.localeCompare(b, 'fr')).forEach(s => { if (!out.some(x => sameTxt(x, s))) out.push(s); });
  out.push('Autre'); return out;
}
function addSport(name){
  name = String(name || '').trim().replace(/\s+/g, ' '); if (!name) return null;
  const f = sportsList().find(x => sameTxt(x, name)); if (f) return f;
  S.settings.sports = [...sportsCustom(), name]; save(); return name;
}
function sportOptions(cur){
  const l = sportsList(); if (cur && !l.includes(cur)) l.unshift(cur);
  return '<option value="">— Choisir —</option>' + l.map(s => `<option value="${esc(s)}" ${s === cur ? 'selected' : ''}>${esc(s)}</option>`).join('') + '<option value="__add">➕ Ajouter un sport…</option>';
}
function sportField(pre, cur){
  return `<label class="f">Sport / activité<select class="inp" id="${pre}-sp">${sportOptions(cur)}</select></label>
    <div class="row2 ag-addsp" id="${pre}-addrow" hidden><input class="inp" id="${pre}-new" placeholder="Nom du nouveau sport" style="flex:1 1 160px" autocomplete="off"><button class="btn" type="button" id="${pre}-newok">Ajouter</button></div>`;
}
function bindSportField(pre, onChange){
  const sel = $(pre + '-sp'), row = $(pre + '-addrow'), inp = $(pre + '-new'); let prev = sel.value;
  sel.onchange = () => {
    if (sel.value === '__add'){ sel.value = prev; row.hidden = false; inp.focus(); return; }
    row.hidden = true; prev = sel.value; onChange(sel.value);
  };
  const ok = () => { const n = addSport(inp.value); if (!n){ toast('Écris le nom du sport'); return; }
    sel.innerHTML = sportOptions(n); sel.value = n; prev = n; inp.value = ''; row.hidden = true; onChange(n); toast(`« ${n} » est dans ta liste`); };
  $(pre + '-newok').onclick = ok;
  inp.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); ok(); } };
}

/* --- Sport et note d'un cours daté --- */
const agKey = (date, h) => date + '|' + (h || '');
function agLessons(date, it, ids){
  return (ids || it.cls).map(id => { const c = clsById(id), l = c && lessonOn(c, date, it.h); return l ? [c, l] : null; }).filter(Boolean);
}
function agGet(date, it){
  const f = agLessons(date, it).find(([, l]) => l.sport || l.note);
  if (f) return {s: f[1].sport || '', n: f[1].note || ''};
  const p = (S.settings.ag || {})[agKey(date, it.h)];
  return p ? {s: p.s || '', n: p.n || '', plan: true} : {s: '', n: ''};
}
function agSet(date, it, ids, s, n){
  const ls = agLessons(date, it, ids), k = agKey(date, it.h);
  ls.forEach(([c, l]) => { if (s) l.sport = s; else delete l.sport; if (n) l.note = n; else delete l.note; save(c.id); });
  if (ls.length < ids.length && (s || n)){ if (!S.settings.ag) S.settings.ag = {}; S.settings.ag[k] = {s, n}; }
  else if (S.settings.ag) delete S.settings.ag[k];
  save();
}
/* au début de l'appel : ce qui avait été prévu dans l'agenda passe dans les leçons */
function agApply(date, h, cls){
  const k = agKey(date, h), p = (S.settings.ag || {})[k]; if (!p) return;
  cls.forEach(c => { const l = lessonOn(c, date, h); if (l && !l.sport && !l.note){ if (p.s) l.sport = p.s; if (p.n) l.note = p.n; save(c.id); } });
  delete S.settings.ag[k]; save();
}

/* --- Créneaux d'un jour de la semaine type --- */
function agItems(d){
  return ttView().filter(s => s.d === d && s.h && hI(s.h) >= 0).map(s => {
    const cls = s.cls.filter(id => clsById(id));
    return {...s, cls, pick: s.pick && cls.length > 1, a: hI(s.h), b: Math.max(hI(s.h), hI(s.h2 || s.h))};
  }).filter(s => s.cls.length).sort((x, y) => x.a - y.a || x.b - y.b);
}
function agClusters(items){
  const out = [];
  items.forEach(it => { const c = out.find(k => it.a <= k.b && it.b >= k.a);
    if (c){ c.items.push(it); c.a = Math.min(c.a, it.a); c.b = Math.max(c.b, it.b); } else out.push({a: it.a, b: it.b, items: [it]}); });
  return out;
}
function agState(date, it){
  const cl = it.cls.map(clsById).filter(Boolean), ls = cl.map(c => lessonOn(c, date, it.h));
  const done = it.pick ? ls.some(Boolean) : ls.every(Boolean);
  const type = (ls.find(Boolean) || {}).type || (cl[0] ? lessonType(cl[0], date, it.h) : 'salle');
  const who = it.pick ? (done ? cl.filter((c, i) => ls[i]).map(c => c.name).join(' + ') : 'Activité compl.') : clsName(it.cls);
  return {cl, ls, done, type, who, g: agGet(date, it)};
}

function agDayHTML(date){
  const d = wdOf(date), items = agItems(d), last = hI(lastH(d));
  const end = Math.max(last, ...items.map(it => it.b)), hrs = HOURS.slice(0, end + 1);
  const rows = [], rowOf = {};
  hrs.forEach((H, i) => {
    if (i > 0){ const gap = mins(H[1]) - mins(hrs[i - 1][2]); if (gap > 0) rows.push({brk: gap >= 40 ? 'Midi' : 'Récré'}); }
    rowOf[i] = rows.length; rows.push({i});
  });
  let h = `<div class="ag-day" style="grid-template-rows:${rows.map(r => r.brk ? '20px' : 'minmax(56px,auto)').join(' ')}">`;
  rows.forEach((r, k) => { h += r.brk ? `<div class="ag-brk" style="grid-row:${k + 1}">${r.brk}</div>`
    : `<div class="ag-h" style="grid-row:${k + 1}"><b>${hrs[r.i][0]}</b><span>${hrs[r.i][1]}</span></div>`; });
  const cov = new Set();
  agClusters(items).forEach(c => { for (let i = c.a; i <= c.b; i++) cov.add(i);
    h += `<div class="ag-cell" style="grid-row:${rowOf[c.a] + 1} / ${rowOf[c.b] + 2}">${c.items.map(it => agCard(date, it)).join('')}</div>`; });
  hrs.forEach((H, i) => { if (!cov.has(i) && i <= last) h += `<button type="button" class="ag-empty" style="grid-row:${rowOf[i] + 1}" data-agnew="${H[0]}" data-date="${date}" aria-label="Ajouter un cours le ${esc(dayName(d).toLowerCase())} à ${H[0]}">+ Ajouter un cours</button>`; });
  h += '</div>';
  if (d === 3) h += '<div class="ag-off">Mercredi : pas de cours après H5</div>';
  return h;
}
function agWeekHTML(mon){
  let h = `<div class="ag-wk" style="grid-template-rows:auto repeat(${HOURS.length},minmax(52px,auto))"><div style="grid-row:1;grid-column:1"></div>`;
  for (let d = 1; d <= 5; d++){ const iso = addDays(mon, d - 1);
    h += `<button type="button" class="ag-wd${iso === UI.agDate ? ' sel' : ''}" style="grid-row:1;grid-column:${d + 1}" data-agd="${iso}" data-agday="1" aria-label="Voir le ${esc(fmtDL(iso))}">${DAYS2[d]} ${dOf(iso).getDate()}${iso === today() ? '<i>auj.</i>' : ''}</button>`; }
  HOURS.forEach((H, i) => h += `<div class="ag-wh" style="grid-row:${i + 2}"><b>${H[0]}</b><span>${H[1]}</span></div>`);
  for (let d = 1; d <= 5; d++){
    const iso = addDays(mon, d - 1), items = agItems(d), last = hI(lastH(d)), cov = new Set();
    agClusters(items).forEach(c => { for (let i = c.a; i <= c.b; i++) cov.add(i);
      h += `<div class="ag-wc" style="grid-row:${c.a + 2} / ${c.b + 3};grid-column:${d + 1}">${c.items.map(it => agMini(iso, it)).join('')}</div>`; });
    HOURS.forEach((H, i) => { if (cov.has(i)) return;
      h += i > last ? `<div class="ag-wx" style="grid-row:${i + 2};grid-column:${d + 1}" title="Pas de cours"></div>`
        : `<button type="button" class="ag-wempty" style="grid-row:${i + 2};grid-column:${d + 1}" data-agnew="${H[0]}" data-date="${iso}" aria-label="Ajouter un cours le ${esc(dayName(d).toLowerCase())} à ${H[0]}">+</button>`; });
  }
  return h + '</div>';
}

/* --- Ajouter / modifier un cours de la semaine type --- */
function openAgEdit(date, h, it){
  const d = wdOf(date), dn = dayName(d), last = hI(lastH(d));
  const others = agItems(d).filter(x => !it || x.id !== it.id);
  const busy = i => others.find(x => i >= x.a && i <= x.b);
  const orig = it ? tt().find(s => s.id === it.ids[0]) || {} : {};
  const lens = [1, 2]; if (it && it.b - it.a + 1 > 2) lens.push(it.b - it.a + 1);
  let start = Math.min(hI(h), last), len = it ? it.b - it.a + 1 : 1;
  const sel = new Set(it ? it.cls : []);
  openSheet(it ? `Modifier · ${dn} ${slotLabel(it)}` : `Nouveau cours · ${dn} ${h}`, `
    <p class="small muted" style="margin:0">Chaque ${esc(dn.toLowerCase())}, toute l'année. Plusieurs classes cochées = un groupe mixte : un seul appel, des bulletins séparés.</p>
    <label class="f">Heure de début<select class="inp" id="age-h">${HOURS.slice(0, last + 1).map((H, i) => `<option value="${i}" ${i === start ? 'selected' : ''}>${H[0]} · ${H[1]}</option>`).join('')}</select></label>
    <span class="small muted" style="font-weight:600">Durée</span>
    <div class="ag-len" id="age-len">${lens.map(k => `<button type="button" class="ag-lenb" data-len="${k}" aria-pressed="${k === len}"><b>${k === 1 ? '1 heure' : `Bloc ${k}h`}</b><span data-lsub></span></button>`).join('')}</div>
    <span class="small" id="age-hint"></span>
    <span class="small muted" style="font-weight:600">Classe(s) qui ont cours</span>
    <div class="ag-cls">${S.classes.map(c => `<label class="ag-ck"><input type="checkbox" value="${c.id}" ${sel.has(c.id) ? 'checked' : ''}><span><b>${esc(c.name)}</b><small>${c.pupils.length} élève${c.pupils.length > 1 ? 's' : ''}${c.act ? ' · groupe d\'activité' : ''}</small></span></label>`).join('')}</div>
    <label class="toggle"><input type="checkbox" id="age-salle" ${orig.salle ? 'checked' : ''}>Toujours en salle, même en période piscine</label>
    <button class="btn pri block" type="button" id="age-ok">${it ? 'Enregistrer l\'horaire' : 'Ajouter à l\'horaire'}</button>`);
  const why = (s, k) => { const e = s + k - 1;
    if (e > last) return d === 3 ? 'le mercredi finit à H5' : 'la journée finit à H8';
    for (let i = s; i <= e; i++){ const b = busy(i); if (b) return `${HOURS[i][0]} déjà pris (${slotName(b)})`; }
    return ''; };
  const draw = () => {
    if (why(start, len) && len > 1) len = 1;
    document.querySelectorAll('[data-len]').forEach(x => { const k = +x.dataset.len, w = why(start, k);
      x.disabled = !!w; x.setAttribute('aria-pressed', k === len);
      x.querySelector('[data-lsub]').textContent = w ? 'Impossible : ' + w : HOURS.slice(start, start + k).map(H => H[0]).join(' + ') + ' · ' + HOURS[start][1] + '–' + HOURS[start + k - 1][2]; });
    const w = why(start, len); $('age-hint').innerHTML = w ? `<span class="ag-warn">⚠ ${esc(w)}</span>` : '';
    $('age-ok').disabled = !!w;
  };
  $('age-h').onchange = e => { start = +e.target.value; draw(); };
  document.querySelectorAll('[data-len]').forEach(x => x.onclick = () => { len = +x.dataset.len; draw(); });
  draw();
  $('age-ok').onclick = () => {
    const ids = [...document.querySelectorAll('.ag-ck input:checked')].map(x => x.value);
    if (!ids.length){ toast('Coche au moins une classe'); return; }
    if (why(start, len)){ toast(why(start, len)); return; }
    const e = {...orig, id: it ? it.ids[0] : nid('t'), d, h: HOURS[start][0], h2: HOURS[start + len - 1][0], cls: S.classes.filter(c => ids.includes(c.id)).map(c => c.id)};
    if ($('age-salle').checked) e.salle = true; else delete e.salle;
    if (it) S.settings.tt = tt().filter(s => !it.ids.includes(s.id));
    tt().push(e); save(); closeSheet(); render();
    toast(it ? 'Horaire modifié' : `Ajouté : chaque ${dn.toLowerCase()} ${slotLabel(e)}`);
  };
}

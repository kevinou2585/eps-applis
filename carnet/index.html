/* --- Dictée 🎤 : parler, le texte s'ajoute dans la case --- */
const MicRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let micOn = null;
function micBtn(id){
  return `<button class="btn ag-mic" type="button" data-mic="${id}">🎤 Dicter</button>`;
}
function micStop(){ if (micOn){ try { micOn.r.stop(); } catch (e) {} } }
function bindMic(id){
  const b = document.querySelector(`[data-mic="${id}"]`), ta = $(id); if (!b || !ta) return;
  if (!MicRec){ b.onclick = () => toast('Dictée pas disponible ici : touche le micro 🎤 du clavier de ton téléphone'); return; }
  b.onclick = () => {
    if (micOn){ const was = micOn.id; micStop(); if (was === id) return; }
    const r = new MicRec(); r.lang = 'fr-FR'; r.continuous = true; r.interimResults = true;
    const base = ta.value.replace(/\s+$/, ''); let fin = '';
    const show = extra => { const t = (fin + extra).trim(); ta.value = base + (base && t ? (/[.!?]$/.test(base) ? ' ' : ' ') : '') + t; };
    r.onresult = ev => { let tmp = ''; for (let i = ev.resultIndex; i < ev.results.length; i++){ const t = ev.results[i][0].transcript; if (ev.results[i].isFinal) fin += (fin && !/^\s/.test(t) ? ' ' : '') + t; else tmp += t; } show(tmp ? ' ' + tmp : ''); };
    r.onerror = ev => { toast(ev.error === 'not-allowed' || ev.error === 'service-not-allowed' ? 'Micro refusé : autorise le micro, ou utilise le micro 🎤 du clavier' : ev.error === 'no-speech' ? 'Je n\'ai rien entendu' : 'Dictée interrompue'); };
    r.onend = () => { show(''); ta.dispatchEvent(new Event('input')); if (micOn && micOn.r === r) micOn = null; b.classList.remove('on'); b.textContent = '🎤 Dicter'; };
    try { r.start(); } catch (e) { toast('Dictée pas disponible ici : touche le micro 🎤 du clavier de ton téléphone'); return; }
    micOn = {r, id}; b.classList.add('on'); b.textContent = '⏹ Arrêter la dictée';
  };
}
function agPlanTag(date, s){

/* ====== Évaluations formatives, endurance (compteur de tours), filles et règles à la piscine ======
   - e.kind = 'form' : évaluation formative (pour info) : visible dans la classe, mais hors savoir-faire / bulletin / Excel
     (filtrée dans compute()). Sans e.kind = certificative (les anciennes évaluations aussi).
   - e.endu = {min, tours, laps:{pid: n}} : évaluation d'endurance. Note = min(tours / objectif, 1) × max, arrondie au 0,5,
     écrite dans e.s comme une note normale. Dernières valeurs utilisées dans la classe : c.enduLast = {min, tours, max}.
   - c.sexe = 'G' | 'F' : les groupes ne sont jamais mixtes, un seul réglage par classe (fiche Élèves). Il met aussi p.g sur
     chaque élève, et les élèves ajoutés plus tard le reçoivent (pupilNew). Ancien c.sexe = 'M' : p.g de chaque élève sert encore.
   - Évaluation de groupe (onglet Évaluation, outils/groupes-carnet.js) : une éval par classe, liées par e.gid ;
     le compteur compte alors toutes les classes du groupe sur un seul écran (run.items = [{cid, eid}]).
   - Leçon piscine : m.rg = 1 (règles) : ne nage pas, ne coûte JAMAIS de point (ni tenue, ni attitude) et n'apparaît pas
     dans les commentaires. À l'appel, simple avertissement « ⚠ 2e / 3e… semaine de suite » (rgStreak : leçons piscine
     précédentes de la classe où elle n'était pas absente et avait m.rg). Le détail est dans l'onglet Classes > Suivi.
   - Compteur en cours : localStorage 'carnet-eps-endu' (reprise après un rechargement), enregistré dans la classe à la fin.
   Tout passe par save(c.id) : appareil + Drive. */
const EN_MINS = [10, 15, 20, 25, 30, 35, 40];
// arrondi et anti double toucher : Réglages (S.settings.enStep, enGuard ; voir outils/reglages-carnet.js)
const enStepV = () => { const v = +S.settings.enStep; return v > 0 ? v : 0.5; };
const enScore = (laps, tours, max) => { if (!tours || !laps) return 0; const st = enStepV(); return Math.round(Math.round(Math.min(laps / tours, 1) * max / st) * st * 1000) / 1000; };
const enGuardMs = () => { const v = S.settings.enGuard; return v == null || v === '' || isNaN(+v) ? 5000 : +v * 1000; };
const enLastOn = () => S.settings.enLast !== false;
const pupilG = (c, p) => c.sexe === 'F' || c.sexe === 'G' ? c.sexe : (p.g || null);

/* --- Règles à la piscine --- */
const rgKey = l => l.date + String(l.h ? hI(l.h) + 1 : 0).padStart(2, '0');
function rgPrev(c, l, pu){
  const k = rgKey(l); let best = null;
  c.lessons.forEach(x => { if (x === l || x.type !== 'piscine' || rgKey(x) >= k || effA(pu, x) === 'A') return; if (!best || rgKey(x) > rgKey(best)) best = x; });
  return best;
}
// nombre de semaines de suite (cette leçon comprise) avec ses règles : 0 si pas de règles à cette leçon
function rgStreak(c, l, pu){
  let n = 0, x = l;
  while (x && (x.m[pu.id] || {}).rg){ n++; x = rgPrev(c, x, pu); }
  return n;
}
function rgChip(c, L, p, pool, off){
  if (!pool || off || pupilG(c, p) !== 'F') return '';
  const on = !!(L.m[p.id] || {}).rg, n = on ? rgStreak(c, L, p) : 0;
  return `<div class="rg-line"><button class="rg-chip${on ? ' on' : ''}" type="button" data-act="rg" aria-pressed="${on}" aria-label="Règles : ${on ? 'oui' : 'non'}">${on ? '✓ ' : ''}R · règles</button>`
    + (n > 1 && S.settings.rgWarn !== false ? `<span class="rg-warn">⚠ ${n}e semaine de suite</span>` : '') + '</div>';
}

/* --- Filles / garçons : un réglage pour toute la classe (jamais de groupe mixte) --- */
function classSexeHTML(c){
  const sx = c.sexe === 'G' || c.sexe === 'F' ? c.sexe : '';
  return `<span class="small muted" style="font-weight:600">Groupe</span>
    <div class="seg full" role="group" aria-label="Groupe : garçons ou filles" style="margin-top:0">${[['G', '♂ Garçons'], ['F', '♀ Filles']].map(([k, l]) => `<button type="button" data-sexe="${k}" aria-pressed="${sx === k}">${l}${sx === k ? ' ✓' : ''}</button>`).join('')}</div>
    <span class="small muted">Toute la classe d'un coup, les élèves ajoutés plus tard aussi (sert pour la piscine : bouton « règles » chez les filles).</span>`;
}
function bindClassSexe(c){
  document.querySelectorAll('[data-sexe]').forEach(b => b.onclick = () => { const k = b.dataset.sexe; c.sexe = k; c.pupils.forEach(p => p.g = k); save(c.id); render();
    toast(k === 'G' ? `${c.name} : garçons` : `${c.name} : filles`); });
}

/* --- Liste et formulaire des évaluations --- */
const evTags = e => (e.endu ? ' <span class="tag ev-endu">🏃 Endurance</span>' : '') + (e.kind === 'form' ? ' <span class="tag ev-form">FORMATIVE</span>' : '');
function evTypeField(c, e){

    <div class="seg full ev-seg" role="group" aria-label="Type d'évaluation" style="margin-top:0"><button type="button" data-etype="std" aria-pressed="true">Classique</button><button type="button" data-etype="endu" aria-pressed="false">🏃 Endurance (compteur de tours)</button></div>`;
}

  </div>`;

    <label class="toggle"><input type="checkbox" id="ef-dec" ${e && evDec(e) ? 'checked' : ''}>Notes à virgule (ex. 2,5)</label><p class="small muted" style="margin:-6px 0 0">Décoché : seulement des notes entières (1, 2, 3…).</p>`;

let EF = null;

function evFormApply(c, o){

  if (old.tours !== t || EF.max0 !== +o.max) Object.entries(o.endu.laps).forEach(([pid, n]) => o.s[pid] = enScore(n, t, +o.max));
  c.enduLast = {min: mn, tours: t, max: +o.max};
}

/* --- Saisie des notes (classe et groupe) ---
   e.s[pid] : nombre, ou 'abs' (absent), 'D' (dispensé), 'CM' (certificat médical) : ces trois-là ne comptent pas dans la note.
   Un certificat de l'élève à la date de l'éval est repris tout seul en CM (sauf si on l'a retiré : e.cmOff[pid]).
   e.dec : notes à virgule permises (sinon entières ; vieilles évals avec des virgules et endurance : permises).
   Après une note, on passe tout seul à l'élève suivant. */
const EV_TAGS = {abs: 'Abs', D: 'D', CM: 'CM'};
const evTag = s => typeof s === 'string' && EV_TAGS[s] ? s : null;
const evTagTxt = s => s;
const evTagLong = s => ({abs: 'absent', D: 'dispensé', CM: 'certificat médical'})[s] || s;
const evDec = e => e.dec === true || (e.dec == null && (!!e.endu || Object.values(e.s || {}).some(v => typeof v === 'number' && v % 1)));
function evCertFill(c, e){
  const d = e.date || today(); let n = 0;
  c.pupils.forEach(p => { if (e.s[p.id] == null && !(e.cmOff || {})[p.id] && certOn(p, d)){ e.s[p.id] = 'CM'; n++; } });
  if (n) save(c.id);
}
function evSinHTML(p, s, cid){
  const t = evTag(s), dc = cid ? ` data-cid="${cid}"` : '';
  return `<span class="sin"><input class="inp num" inputmode="decimal" enterkeyhint="next" aria-label="Note de ${esc(p.n)}" data-in="${p.id}"${dc} value="${typeof s === 'number' ? esc(fr(s, 2)) : ''}" ${t ? 'disabled' : ''} placeholder="${t ? EV_TAGS[t] : '—'}">${Object.entries(EV_TAGS).map(([k, l]) => `<button class="btn abs" type="button" data-tag="${k}" data-abs="${p.id}"${dc} aria-pressed="${t === k}">${l}</button>`).join('')}</span>`;
}
function evBindSin(sb, get, redraw){
  const go = n => { if (!n) return; n.focus(); try { n.scrollIntoView({block: 'center', behavior: 'smooth'}); } catch(x){} };
  const nextAfter = pid => { const a = [...sb.querySelectorAll('[data-in]')], i = a.findIndex(x => x.dataset.in === pid); return a.slice(i + 1).find(x => !x.disabled); };
  sb.querySelectorAll('[data-in]').forEach(inp => {
    const pid = inp.dataset.in;
    inp.oninput = () => { clearTimeout(inp._t); const {c, e} = get(inp), raw = inp.value.trim(), dec = evDec(e);
      if (/[.,]$/.test(raw)){ if (!dec){ inp.style.borderColor = 'var(--bad)'; toast('Notes entières seulement (coche « Notes à virgule » dans Modifier)'); } return; }
      const v = parseNum(raw);
      if (v == null){ delete e.s[pid]; inp.style.borderColor = ''; save(c.id); return; }
      if (v < 0 || v > +e.max || (!dec && v % 1)){ inp.style.borderColor = 'var(--bad)'; if (!dec && v % 1) toast('Notes entières seulement (coche « Notes à virgule » dans Modifier)'); return; }
      e.s[pid] = v; inp.style.borderColor = ''; save(c.id);
      // élève suivant : tout de suite si la note ne peut plus s'allonger (ex. 7 sur 10), sinon après un court instant (1 → 10 ?)
      const fin = /[.,]\d/.test(raw) || (!dec && v * 10 > +e.max);
      if (fin) go(nextAfter(pid)); else inp._t = setTimeout(() => { if (document.activeElement === inp) go(nextAfter(pid)); }, dec ? 1500 : 1100);
    };
    inp.onkeydown = ev => { if (ev.key === 'Enter'){ clearTimeout(inp._t); const n = nextAfter(pid); if (n) go(n); else inp.blur(); } };
  });
  sb.querySelectorAll('[data-tag]').forEach(b => b.onclick = () => { const {c, e} = get(b), pid = b.dataset.abs, k = b.dataset.tag;
    if (e.s[pid] === k){ delete e.s[pid]; if (k === 'CM') (e.cmOff = e.cmOff || {})[pid] = 1; }
    else { e.s[pid] = k; if (e.cmOff) delete e.cmOff[pid]; }
    save(c.id); redraw();
    const me = [...sb.querySelectorAll('[data-in]')].find(x => x.dataset.in === pid);
    go(e.s[pid] != null ? nextAfter(pid) : me);
  });
}

/* --- Feuille des notes : bouton du compteur, tours par élève --- */
function evScoresHead(c, e){
  let h = '';
  if (e.kind === 'form') h += '<div class="ev-formnote"><span class="tag ev-form">FORMATIVE</span><span class="small">Pour info : ne compte pas dans le bulletin.</span></div>';
  if (e.endu){
    const run = enRunGet(), mine = run && enKey(run) === c.id + ':' + e.id, nl = Object.keys(e.endu.laps || {}).length;
    h += `<div class="card ev-endu-c"><div><b>🏃 Endurance · ${fr(e.endu.min, 2)} min</b><br><span class="small muted">${e.endu.tours} tours = ${fr(+e.max, 2)}/${fr(+e.max, 2)}${nl ? ` · ${nl} élève${nl > 1 ? 's' : ''} déjà compté${nl > 1 ? 's' : ''}` : ''}</span></div>
      <button class="btn pri block en-go" type="button" id="es-endu">${mine ? '▶ Reprendre le compteur' : '▶ Démarrer l\'évaluation'}</button></div>`;
  }
  return h;
}
function bindEvScoresHead(c, e){ if ($('es-endu')) $('es-endu').onclick = () => { closeSheet(); enOpen(c.id, e.id); }; }
const evLapsTxt = (e, p) => { const n = e.endu && (e.endu.laps || {})[p.id]; return n != null ? `<span class="pts">${n} tour${n > 1 ? 's' : ''}</span>` : ''; };
function evFormList(c, vp, p){
  return c.evals.filter(e => e.periodId === vp.id && e.kind === 'form').map(e => { const s = e.s[p.id];
    return `<div class="evt"><span class="d">${e.date ? esc(fmtD(e.date)) : ''}</span><span class="l">${esc(e.name)} <span class="small muted">(formatif, ne compte pas)</span></span><b class="num">${evTag(s) ? evTagTxt(s) : s == null ? '—' : fr(s, 2)}<span class="muted">/${fr(+e.max, 2)}</span></b></div>`; }).join('');
}

/* ====== Compteur de tours plein écran ====== */
const EN_KEY = 'carnet-eps-endu';
const enRunGet = () => { try { return JSON.parse(localStorage.getItem(EN_KEY)) || null; } catch(e){ return null; } };
const enRunPut = r => { try { if (r) localStorage.setItem(EN_KEY, JSON.stringify(r)); else localStorage.removeItem(EN_KEY); } catch(e){} };
let EN = null, EN_AC = null;
/* un compteur = une ou plusieurs évaluations liées (une par classe du groupe) */
const enItems = r => r.items || [{cid: r.cid, eid: r.eid}];
const enKey = r => enItems(r).map(x => x.cid + ':' + x.eid).join(',');
function enFind(r){
  const parts = enItems(r).map(({cid, eid}) => { const c = S.classes.find(x => x.id === cid), e = c && c.evals.find(x => x.id === eid); return e && e.endu ? {c, e} : null; }).filter(Boolean);
  return parts.length ? {parts, c: parts[0].c, e: parts[0].e, name: parts.map(x => x.c.name).join(' + ')} : null;
}
const enTot = r => Object.values(r.laps || {}).reduce((a, b) => a + b, 0);
const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

/* son et vibration (le son se débloque au premier toucher, comme l'exige l'iPhone) */
function enAudio(){ try { if (!EN_AC) EN_AC = new (window.AudioContext || window.webkitAudioContext)(); if (EN_AC.state === 'suspended') EN_AC.resume(); } catch(e){} }
function enTone(f, d, t0 = 0, v = .25){ const a = EN_AC; if (!a) return;
  try { const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0; o.type = 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .03); } catch(e){} }
const enClick = () => enTone(1500, .05, 0, .12);
const enBeep = (n, long) => { for (let i = 0; i < n; i++) enTone(880, long && i === n - 1 ? 1 : .28, i * .4, .35); };
const enBuzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch(e){} };
async function enWake(){ try { if (navigator.wakeLock) EN.wl = await navigator.wakeLock.request('screen'); } catch(e){} }

function enAbsents(parts){
  const s = new Set(); let roll = false;
  parts.forEach(({c}) => { const ls = c.lessons.filter(l => l.date === today()); if (!ls.length) return; roll = true;
    c.pupils.forEach(p => { if (ls.every(l => ['A', 'D'].includes(effA(p, l)))) s.add(p.id); }); });
  return {s, roll};
}
/* élèves du compteur : par prénom (A → Z), absents à la fin */
const enAll = () => EN.parts.flatMap(({c}) => pupilsOf(c));
function enIds(){
  const r = EN.run, ab = enAbsents(EN.parts).s;
  let ps = enAll().filter(p => !r.excl || !ab.has(p.id) || (r.laps[p.id] || 0) > 0);
  // ordre alphabetique des prenoms (toutes classes melangees), absents et dispenses a la fin
  const cmp = (x, y) => (x || '').localeCompare(y || '', 'fr', {sensitivity: 'base'});
  ps = [...ps].sort((a, b) => (ab.has(a.id) - ab.has(b.id)) || cmp(nomPre(a).pre, nomPre(b).pre) || cmp(nomPre(a).nom, nomPre(b).nom));
  if (r.sort) ps = [...ps].sort((a, b) => (r.laps[b.id] || 0) - (r.laps[a.id] || 0) || byName(a, b));
  return ps.map(p => p.id);
}
/* en grand : le prénom (+ initiale du nom si deux prénoms pareils) ; en petit : la classe quand il y en a plusieurs */
function enName(p){ return [EN.nc.get(p.id) || nomCourt(p), EN.parts.length > 1 ? (EN.pm.get(p.id) || {}).c?.name || '' : '']; }
const enP = pid => (EN.pm.get(pid) || {}).p;
const enEl = () => EN.rt.elapsed();

/* enOpen(cid, eid) pour une classe, ou enOpen([{cid, eid}, …]) pour toutes les classes d'un groupe */
function enOpen(items, eid){
  if (!Array.isArray(items)) items = [{cid: items, eid}];
  const key = enKey({items}), old = enRunGet();
  if (old && enKey(old) !== key && enFind(old) && (enTot(old) || old.st !== 'idle')){
    const f = enFind(old);

/* grille : nombre de colonnes choisi pour que toutes les cases tiennent sans défiler, le plus grandes possible */
function enLayout(){
  const g = $('en-grid'); if (!g || !EN) return;
  const n = EN.ids.length || 1, cs = getComputedStyle(g), W = g.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), H = g.clientHeight - parseFloat(cs.paddingBottom), gap = 6;
  let best = null;
  for (let cols = 1; cols <= n; cols++){ const rows = Math.ceil(n / cols), tw = (W - gap * (cols - 1)) / cols, th = (H - gap * (rows - 1)) / rows, sc = Math.min(tw, th * 1.25);
    if (!best || sc > best.sc) best = {sc, cols, rows, tw, th}; }
  g.style.gridTemplateColumns = `repeat(${best.cols}, minmax(0, 1fr))`; g.style.gridTemplateRows = `repeat(${best.rows}, minmax(0, 1fr))`;
  g.style.setProperty('--fn', Math.max(12, Math.min(best.th * .24, best.tw * .17, 30)) + 'px'); // prénoms courts : un peu plus grands
  g.style.setProperty('--fc', Math.max(16, Math.min(best.th * .42, best.tw * .36, 80)) + 'px');
  g.classList.toggle('tiny', best.th < 66);
}

function enPaint(pid){

}
function enAgo(pid){
  const t = document.querySelector(`.en-t[data-pid="${pid}"]`); if (!t) return;
  const l = EN.run.last[pid], on = l > 0 && (EN.run.st === 'run' || EN.run.st === 'pause');

}
function enMsg(pid, txt, cls){

  t.classList.remove('hit', 'dup', 'minus'); void t.offsetWidth; t.classList.add(cls);

}
function enInfo(){
  if (!EN) return; const r = EN.run, tours = EN.e.endu.tours, full = EN.ids.filter(pid => (r.laps[pid] || 0) >= tours).length;
  $('en-info').textContent = `${EN.ids.length} élèves · ${enTot(r)} tours · ${full} ✓ 100 %`;
  const u = r.undo[r.undo.length - 1], b = $('en-undo');
  b.disabled = !u || r.st === 'sum';
  b.textContent = u ? `↶ Annuler ${(EN.nc.get(u.pid) || '?')} ${u.d > 0 ? '+1' : '−1'}` : '↶ Annuler';

function enAdd(pid, d){
  const r = EN.run, now = Date.now();
  if (r.st === 'idle'){ enMsg(pid, 'Touche GO', 'dup'); return; }
  if (r.st === 'done' || r.st === 'sum'){ enMsg(pid, 'Terminé', 'dup'); return; }
  const n = r.laps[pid] || 0;
  if (d > 0){
    if (r.last[pid] && now - r.last[pid] < enGuardMs()){ enMsg(pid, 'déjà compté', 'dup'); enBuzz(60); return; }
    r.undo.push({pid, d: 1, last0: r.last[pid] || null}); r.laps[pid] = n + 1; r.last[pid] = now; enMsg(pid, '+1', 'hit'); enClick(); enBuzz(15);
  } else {

    r.undo.push({pid, d: -1, last0: r.last[pid] || null}); r.laps[pid] = n - 1; r.last[pid] = null; enMsg(pid, '−1 tour', 'minus'); enTone(300, .15, 0, .2); enBuzz([40, 60, 40]);
  }

function enUndo(){

  r.laps[u.pid] = Math.max(0, (r.laps[u.pid] || 0) - u.d); r.last[u.pid] = u.last0;
  enSave(); enPaint(u.pid); enMsg(u.pid, u.d > 0 ? 'annulé −1' : 'annulé +1', 'minus'); if (r.sort) enReorder(); enInfo();

/* tri par tours : les cases glissent à leur nouvelle place (seulement quand un tour change) */
function enReorder(){
  const g = $('en-grid'), els = [...g.querySelectorAll('.en-t')], first = new Map(els.map(x => [x.dataset.pid, x.getBoundingClientRect()]));
  EN.ids = enIds(); EN.ids.forEach(pid => { const x = g.querySelector(`.en-t[data-pid="${pid}"]`); if (x) g.appendChild(x); });
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  els.forEach(x => { const a = first.get(x.dataset.pid), b = x.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top; if (!dx && !dy) return;
    x.style.transition = 'none'; x.style.transform = `translate(${dx}px,${dy}px)`;
    requestAnimationFrame(() => requestAnimationFrame(() => { x.style.transition = 'transform .35s ease'; x.style.transform = ''; })); });
}

function enFlash(txt){ const f = $('en-flash'); if (!f) return; f.textContent = txt; f.hidden = false; clearTimeout(EN.flT); EN.flT = setTimeout(() => { if ($('en-flash')) $('en-flash').hidden = true; }, 3500); }

  const put = (row, n) => { n = Math.max(0, Math.min(999, Math.round(n) || 0)); r.laps[row.dataset.spid] = n; row.querySelector('input').value = n;

    toast(`Points enregistrés pour ${nb} élève${nb > 1 ? 's' : ''}`);
  };
}

/* ====== Nom / prénom, et onglet Évaluation par groupe (les classes qui ont cours ensemble) ======
   - Élève : p.n = « Nom Prénom » reste le nom complet (bulletin, Excel, Drive, commentaires, tri).
     p.nom et p.pre sont écrits à la création et quand on modifie la fiche. Pour les anciens élèves (p.n seul),
     ils sont déduits de p.n à l'affichage, sans rien enregistrer (pas de changement de c.ts, donc rien à synchroniser) :
       · des mots en MAJUSCULES et d'autres pas : MAJUSCULES = nom (« DUPONT Léa ») ;
       · sinon le dernier mot = prénom, le reste = nom (« Van Damme Léa ») ;
       · liste collée avec deux colonnes (tabulation, ; ou ,) : 1re = nom, 2e = prénom.
     Si p.n a changé ailleurs (ancienne version de l'appli) et ne correspond plus à p.nom + p.pre, p.n gagne.
   - Nom court (appel, compteur de tours) : le prénom ; deux prénoms pareils dans ce qui est affiché (l'appel peut réunir
     deux classes) : « Prénom N. », puis plus de lettres du nom si besoin.
   - Groupes de l'onglet Évaluation : les classes d'un même créneau de l'horaire S.settings.tt (sans les groupes d'activité),
     plus chaque classe qui n'est jamais en groupe (et un groupe d'activité seulement s'il a des évaluations).
     Une évaluation de groupe = une évaluation dans chaque classe (c.evals, rien ne change pour bulletin, Excel, Drive),
     liées par le même e.gid. Les anciennes sans gid sont réunies si nom + date + barème sont pareils.
   Tout passe par save(c.id) : appareil + Drive. */

/* --- Nom et prénom --- */
const nomUp = w => w.length > 1 && w === w.toLocaleUpperCase('fr') && w !== w.toLocaleLowerCase('fr');
const nomClean = s => String(s || '').replace(/\s+/g, ' ').trim();
function splitNom(n){
  const w = nomClean(n).split(' ').filter(x => x && !/^\d+$/.test(x));
  if (w.length < 2) return ['', w[0] || ''];
  const up = w.filter(nomUp);
  if (up.length && up.length < w.length) return [up.join(' '), w.filter(x => !nomUp(x)).join(' ')];
  return [w.slice(0, -1).join(' '), w[w.length - 1]];
}
const joinNom = (nom, pre) => [nomClean(nom), nomClean(pre)].filter(Boolean).join(' ');
function nomPre(p){
  if ((p.nom != null || p.pre != null) && joinNom(p.nom, p.pre) === nomClean(p.n)) return {nom: nomClean(p.nom), pre: nomClean(p.pre)};
  const [nom, pre] = splitNom(p.n); return {nom, pre};
}
function pupilNew(c, nom, pre){
  nom = nomClean(nom); pre = nomClean(pre);
  const p = {id: nid('e'), n: joinNom(nom, pre), nom, pre};
  if (c.sexe === 'G' || c.sexe === 'F') p.g = c.sexe;
  c.pupils.push(p); return p;
}
/* liste collée (création de classe, Ajouter des élèves) */
function addPupils(c, text){
  const out = [];
  String(text || '').split(/\r?\n/).forEach(l => {
    const f = l.split(/[\t;,]+/).map(nomClean).filter(x => x && !/^\d+$/.test(x)), n = f.join(' ');
    if (!n || /^(nom|élève|eleve)\b/i.test(n)) return;
    const [nom, pre] = f.length === 2 ? f : splitNom(n);
    out.push(pupilNew(c, nom, pre));
  });
  return out;
}

/* --- Nom court : prénom, + initiale(s) du nom si deux prénoms pareils parmi les élèves affichés --- */
const nomKey = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
function nomsCourts(ps){
  const m = new Map(), by = new Map();
  ps.forEach(p => { const {nom, pre} = nomPre(p), base = pre || nom || p.n, k = nomKey(base);
    if (!by.has(k)) by.set(k, []); by.get(k).push({p, nom, base}); });
  by.forEach(list => {
    if (list.length === 1){ m.set(list[0].p.id, list[0].base); return; }
    // pour chacun, juste assez de lettres du nom pour le distinguer des autres (au moins l'initiale)
    const pre = (x, k) => nomKey(x.nom.slice(0, k));
    list.forEach(x => {
      if (!x.nom){ m.set(x.p.id, x.base); return; }
      let k = 1; while (k < x.nom.length && list.some(y => y !== x && pre(y, k) === pre(x, k))) k++;
      m.set(x.p.id, k >= x.nom.length ? `${x.base} ${x.nom}` : `${x.base} ${x.nom.slice(0, k).trim()}.`);
    });
  });
  return m;
}
let NCOURT = new Map();
const nomCourt = p => NCOURT.get(p.id) || nomPre(p).pre || p.n;

/* --- Fiche élève : deux cases --- */

    <label class="f" style="flex:1 1 120px">Prénom<input class="inp" id="pp-pre" value="${esc(pre)}" autocomplete="off" autocapitalize="words" spellcheck="false"></label></div>

/* ====== Onglet Évaluation ====== */
const EVG_KEY = 'carnet-eps-evgroupe';
function evGroups(){
  const idx = id => S.classes.findIndex(c => c.id === id), seen = new Map();
  tt().forEach(s => { const ids = [...new Set(s.cls)].filter(id => idx(id) >= 0 && !isAct(id)).sort((a, b) => idx(a) - idx(b));
    if (ids.length) seen.set(ids.join(','), ids); });
  const inMulti = new Set([...seen.values()].filter(x => x.length > 1).flat());
  const out = [...seen.values()].filter(x => x.length > 1 || !inMulti.has(x[0]));
  S.classes.forEach(c => { if (out.some(x => x.includes(c.id)) || (c.act && !c.evals.length)) return; out.push([c.id]); });
  return out.map(ids => ({key: ids.join(','), ids, cls: ids.map(id => S.classes[idx(id)]), name: clsName(ids)}))
    .sort((a, b) => (a.cls.some(c => c.act) - b.cls.some(c => c.act)) || a.name.localeCompare(b.name, 'fr', {numeric: true}));
}
function evSlots(ids){
  return tt().filter(s => [...new Set(s.cls)].filter(id => !isAct(id) && S.classes.some(c => c.id === id)).sort().join(',') === [...ids].sort().join(','))
    .sort((a, b) => a.d - b.d || hI(a.h) - hI(b.h)).map(s => DAYS.find(d => d[0] === s.d)[1].slice(0, 2).toLowerCase() + '. ' + slotLabel(s)).join(' · ');
}
/* la même période dans chaque classe (même nom, sinon même rang, sinon la date) */
function evPerMap(cls, vp0){
  const i0 = periodsOf(cls[0]).findIndex(p => p.id === vp0.id);
  return new Map(cls.map(c => { const ps = periodsOf(c); return [c.id, c === cls[0] ? vp0 : ps.find(p => p.name === vp0.name) || ps[i0] || periodOf(c, vp0.start)]; }));
}
function evBuckets(cls, pm){
  const out = [];
  cls.forEach(c => { const vp = pm.get(c.id); if (!vp) return;
    c.evals.filter(e => e.periodId === vp.id).forEach(e => {
      const k = e.gid ? 'g:' + e.gid : 'n:' + nomKey(e.name) + '|' + (e.date || '') + '|' + (+e.max);
      let b = out.find(x => x.k === k && !x.items.some(it => it.c === c));
      if (!b) out.push(b = {k, items: []});
      b.items.push({c, e});
    }); });
  return out.sort((a, b) => { const x = a.items[0].e.date || '', y = b.items[0].e.date || ''; return x < y ? -1 : x > y ? 1 : 0; });
}
function renderEvalTab(m){
  const gs = evGroups();
  if (!gs.length){ m.innerHTML = `<section class="sec"><h2>Évaluation</h2><div class="card empty"><p class="muted">Pas encore de classe à évaluer. Crée une classe dans l'onglet Classes.</p></div></section>`; return; }
  let key = null; try { key = localStorage.getItem(EVG_KEY); } catch(e){}
  const g = gs.find(x => x.key === key) || gs[0], c0 = g.cls[0], multi = g.cls.length > 1;
  let vp0 = viewPeriod(c0); if (vp0 === 'year') vp0 = periodOf(c0, today());
  const chips = `<label class="f">Classe / groupe<select class="inp" id="evg">${gs.map(x => { const sl = evSlots(x.ids);
    return `<option value="${esc(x.key)}"${x === g ? ' selected' : ''}>${esc(x.name)} · ${esc(sl || (x.cls[0].act ? 'activité' : 'seule'))}</option>`; }).join('')}</select></label>`;
  if (!vp0){ m.innerHTML = `<section class="sec"><h2>Évaluation</h2>${chips}<div class="card empty"><p>Ajoute une période dans Classes › Élèves.</p></div></section>`; bindEvTab(m, g, null); return; }
  const pm = evPerMap(g.cls, vp0), bs = evBuckets(g.cls, pm);
  const tot = g.cls.map(c => { const vp = pm.get(c.id); return vp ? c.evals.filter(e => e.periodId === vp.id && e.kind !== 'form').reduce((a, e) => a + +e.max, 0) : 0; });
  const totTxt = new Set(tot).size === 1 ? 'total sur ' + fr(tot[0]) : 'total sur ' + g.cls.map((c, i) => `${fr(tot[i])} en ${esc(c.name)}`).join(', ');
  m.innerHTML = `<section class="sec">
    <h2>Évaluation</h2>
    ${chips}
    <div class="chips" id="egp">${periodsOf(c0).map(p => `<button class="chip" type="button" data-egp="${p.id}" aria-pressed="${p.id === vp0.id}">${esc(p.name)}${p.type === 'piscine' ? ' <span class="tag piscine" style="padding:1px 6px">P</span>' : ''}</button>`).join('')}</div>
    <p class="small muted" style="margin:0">${multi ? `Une évaluation créée ici est faite pour <b>${esc(g.name)}</b> en même temps (même nom, date et barème). Les notes vont dans le bulletin de chaque classe.` : `Les notes vont dans le bulletin de ${esc(g.name)}.`} Les évaluations certificatives de la période s'additionnent (${totTxt}) et comptent pour ${100 - S.settings.se} % du bulletin. Les formatives (pour info) ne comptent pas.</p>
    <button class="btn pri block" type="button" id="eg-new">+ Nouvelle évaluation${multi ? ' · ' + esc(g.name) : ''}</button>
    ${bs.length ? bs.map((b, i) => { const e = b.items[0].e, n = b.items.reduce((a, it) => a + it.c.pupils.length, 0);
      const vals = b.items.flatMap(({c, e}) => c.pupils.map(p => e.s[p.id]).filter(v => typeof v === 'number')), avg = vals.length ? vals.reduce((a, x) => a + x, 0) / vals.length : null;
      const part = multi && b.items.length < g.cls.length;
      return `<button class="ev" type="button" data-eb="${i}"><span class="t"><b>${esc(e.name)}${evTags(e)}</b><span class="small muted">${e.date ? esc(fmtD(e.date)) + ' · ' : ''}${vals.length}/${n} notés · moyenne ${fr(avg)}</span>${part ? `<span class="tag gr-only">${esc(b.items.map(x => x.c.name).join(' + '))} seulement</span>` : ''}</span><span class="sur num">/${fr(+e.max)}</span></button>`; }).join('')
      : `<div class="card empty"><p class="muted">Pas encore d'évaluation pour ${esc(vp0.name)}.</p></div>`}
  </section>`;
  bindEvTab(m, g, vp0);
  $('eg-new').onclick = () => openGroupEvalForm(g.cls, vp0, null);
  m.querySelectorAll('[data-eb]').forEach(x => x.onclick = () => openGroupScores(bs[+x.dataset.eb].items));
}
function bindEvTab(m, g, vp0){
  const evg = m.querySelector('#evg'); if (evg) evg.onchange = () => { try { localStorage.setItem(EVG_KEY, evg.value); } catch(e){} render(); };
  m.querySelectorAll('[data-egp]').forEach(x => x.onclick = () => { const p = g.cls[0].periods.find(q => q.id === x.dataset.egp); if (!p) return;

/* formulaire : celui des évaluations (type, endurance, formative), enregistré dans chaque classe du groupe */
function openGroupEvalForm(cls, vp0, items){
  if (items) cls = items.map(x => x.c);

  openEvalForm(c0, items ? null : vp0, e0);

    document.querySelector('.sheet .sh h2').textContent = (items ? 'Modifier · ' : 'Nouvelle évaluation · ') + names;
    sb.insertAdjacentHTML('afterbegin', `<div class="gr-for"><b>Pour ${esc(names)}</b><span class="small muted">${items ? 'Les changements valent pour les ' + cls.length + ' classes.' : 'Une évaluation dans chaque classe, liées entre elles : modifier ou supprimer change les ' + cls.length + '.'}</span></div>`);

    const gid = (items && (items.find(x => x.e.gid) || {}).e?.gid) || nid('g'), out = [];
    const put = (c, o) => { o.name = name; o.max = max; o.date = date; o.periodId = (pm.get(c.id) || periodOf(c, date)).id; if (multi) o.gid = gid; evFormApply(c, o); };
    if (items) items.forEach(({c, e}) => { if (EF) EF.max0 = +e.max; put(c, e); out.push({c, e}); });
    else cls.forEach(c => { const o = {id: nid('v'), s: {}}; put(c, o); c.evals.push(o); out.push({c, e: o}); });

}

/* Données : une ligne par élève, événements datés (les plus récents d'abord) */
function suData(c, vp){
  const year = vp === 'year', st = S.settings, T = +st.T || 0, Cc = +st.C || 0;
  const ls = c.lessons.filter(l => year || periodOf(c, l.date)?.id === vp.id).sort((a, b) => suKey(a) < suKey(b) ? 1 : -1);
  const pers = year ? periodsOf(c) : [vp];

    </div>`;
}
function bindReg(){

}

/* ====== Classes : onglet Élève (fiche complète), bulletin d'un élève, classes regroupées, alertes ======
   - Une classe s'ouvre sur 2 onglets : Élève (liste → fiche) puis Bulletin. Points, Tableau de suivi et Gérer les élèves
     sont des outils ouverts depuis l'onglet Élève (UI.ctab = 'points' | 'suivi' | 'pupils').
   - Fiche (openPupil) : alerte, bouton « Son bulletin » (fiBulletin : période en cours, périodes précédentes, année),
     historique daté de tout (fiHistHTML).
   - Case « Regrouper » à droite de MES CLASSES (localStorage carnet-eps-regroupe) : les classes qui ont une heure ensemble
     dans l'horaire (S.settings.tt) forment un groupe, ouvert d'un coup (UI.cgrp = ids, localStorage carnet-eps-cgrp).
   - Alerte : FI_ALN (3) oublis de tenue ou perturbations (exclusions comprises) dans la période : bandeau à l'appel,
     dans la liste et la fiche, et un message quand on note le 3e. Rien à copier. */
const FI_ALN = 3;
const fiLS = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){ return null; } };
const fiRegroupe = () => fiLS('carnet-eps-regroupe') === '1';
try { const g = JSON.parse(fiLS('carnet-eps-cgrp') || 'null'); if (Array.isArray(g)) UI.cgrp = g; } catch(e){}
const fiSetGrp = ids => { UI.cgrp = ids && ids.length > 1 ? ids : null; fiLS('carnet-eps-cgrp', UI.cgrp ? JSON.stringify(UI.cgrp) : null); };

/* --- Alertes (période de la date donnée) --- */
function fiCounts(c, p, date){
  const vp = periodOf(c, date || today()); const o = {k: 0, d: 0, vp};
  if (!vp) return o;
  c.lessons.forEach(l => { if (periodOf(c, l.date)?.id !== vp.id || effA(p, l) === 'A') return; const m = l.m[p.id] || {};
    if (m.k) o.k++; if (m.x || m.d) o.d++; });
  const a = ((c.adj || {})[vp.id] || {})[p.id]; if (a){ o.k += +a.t || 0; o.d += +a.c || 0; }
  return o;
}
function fiAlerts(c, p, date){
  const n = fiCounts(c, p, date), out = [];
  if (n.k >= FI_ALN) out.push(`${n.k} oublis de tenue`);
  if (n.d >= FI_ALN) out.push(`${n.d} perturbations`);
  return out;
}
const fiAlertTxt = (c, p, date) => { const a = fiAlerts(c, p, date); return a.length ? '⚠ ' + a.join(' · ') + ' cette période' : ''; };
function fiAlertLine(c, p, date){ const t = fiAlertTxt(c, p, date); return t ? `<div class="rg-line fi-al-line"><span class="fi-al">${esc(t)}</span></div>` : ''; }
// message au moment où on note le 3e oubli / la 3e perturbation
function fiAlertToast(c, p, date, k){
  const n = fiCounts(c, p, date)[k];
  if (n === FI_ALN) toast(`⚠ ${nomCourt(p)} : ${n} ${k === 'k' ? 'oublis de tenue' : 'perturbations'} cette période`);
  return n === FI_ALN;
}

/* --- Groupes de classes (heures en commun dans l'horaire) --- */
function fiGroups(){
  const ok = new Set(S.classes.filter(c => !c.act).map(c => c.id)), up = {};
  const f = x => up[x] === x || up[x] == null ? (up[x] = x) : (up[x] = f(up[x]));
  tt().forEach(s => { const ids = (s.cls || []).filter(id => ok.has(id)); for (let i = 1; i < ids.length; i++) up[f(ids[i])] = f(ids[0]); });
  const by = new Map();
  S.classes.forEach(c => { const r = ok.has(c.id) ? f(c.id) : c.id; if (!by.has(r)) by.set(r, []); by.get(r).push(c); });
  return [...by.values()];
}
const fiSlots = ids => tt().filter(s => s.cls.some(id => ids.includes(id))).sort((a, b) => a.d - b.d || hI(a.h) - hI(b.h))
  .filter((s, i, a) => a.findIndex(x => x.d === s.d && x.h === s.h) === i)
  .map(s => DAYS.find(d => d[0] === s.d)[1].slice(0, 3).toLowerCase() + '. ' + slotLabel(s));

function fiClassList(m){
  const reg = fiRegroupe();
  const one = c => { const {p, avg} = classAvg(c), slots = fiSlots([c.id]);
    return `<button class="ev" type="button" data-cl="${c.id}"><span class="t"><b>${esc(c.name)}</b><span class="small muted">${c.pupils.length} élève${c.pupils.length > 1 ? 's' : ''}${c.act ? ' · activité (présences)' : p ? ' · ' + esc(p.name) : ''}${p && p.type === 'piscine' ? ' · piscine' : ''}${slots.length ? '<br>' + esc(slots.join(', ')) : ''}</span></span><span class="sur num">${avg != null ? fr(avg) + '<small style="font-size:14px"> %</small>' : ''}</span></button>`; };
  const grp = cs => { const ids = cs.map(c => c.id), n = cs.reduce((a, c) => a + c.pupils.length, 0), slots = fiSlots(ids);
    return `<button class="ev fi-grp" type="button" data-grp="${ids.join(',')}"><span class="t"><b>${cs.map(c => esc(c.name)).join(' + ')}</b><span class="small muted">${cs.length} classes ensemble · ${n} élèves${slots.length ? '<br>' + esc(slots.join(', ')) : ''}</span></span><span class="sur fi-grp-n">${cs.length}</span></button>`; };
  m.innerHTML = `<section class="sec">
    <div class="fi-hd"><h2>Mes classes</h2><label class="fi-chk"><input type="checkbox" id="cl-grp" ${reg ? 'checked' : ''}><span>Regrouper par groupes</span></label></div>
    ${reg ? `<p class="small muted" style="margin:0">Les classes qui ont cours ensemble (horaire) s'ouvrent d'un coup.</p>` : ''}
    ${reg ? fiGroups().map(cs => cs.length > 1 ? grp(cs) : one(cs[0])).join('') : S.classes.map(one).join('')}
    <button class="btn pri block" type="button" id="cl-new">+ Nouvelle classe</button>
    <button class="btn block" type="button" id="cl-xls">Bulletin Excel de toutes les classes</button>
    <p class="small muted" style="margin:0">Un onglet par classe dans le même fichier, pour la période en cours.</p>
  </section>`;
  $('cl-grp').onchange = e => { fiLS('carnet-eps-regroupe', e.target.checked ? '1' : '0'); render(); };
  m.querySelectorAll('[data-cl]').forEach(b => b.onclick = () => { S.cur = b.dataset.cl; fiSetGrp(null); UI.cview = true; UI.ctab = 'eleve'; saveUI(); save(); render(); window.scrollTo(0, 0); });
  m.querySelectorAll('[data-grp]').forEach(b => b.onclick = () => { const ids = b.dataset.grp.split(','); S.cur = ids[0]; fiSetGrp(ids); UI.cview = true; UI.ctab = 'eleve'; saveUI(); save(); render(); window.scrollTo(0, 0); });
  $('cl-new').onclick = openNewClass;
  $('cl-xls').onclick = () => exportXlsx(S.classes.filter(c => !c.act).map(c => [c, periodOf(c, today())]).filter(x => x[1]), 'Bulletins EPS toutes les classes');
}

/* --- Vue d'une classe ou d'un groupe --- */
const FI_TOOLS = {points: ['Points de savoir-être', renderPoints], suivi: ['Tableau de suivi', renderSuivi], pupils: ['Gérer les élèves', renderManage]};

function fiClassView(c, m){

/* --- Onglet Évaluations : une colonne par évaluation de la période, le résultat de chaque élève --- */
function fiEvalsRecap(cs, m){
  const c0 = cs[0], vp = viewPeriod(c0);
  const bloc = c => {
    const v = viewPeriod(c), evs = c.evals.filter(e => v === 'year' || e.periodId === v?.id).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    if (!evs.length) return `${cs.length > 1 ? `<h3 class="fi-cl">${esc(c.name)}</h3>` : ''}<div class="card empty small muted">Pas encore d'évaluation ${v === 'year' ? 'cette année' : 'sur cette période'}.</div>`;
    const cell = (e, p) => { const s = e.s[p.id];
      if (evTag(s)) return `<td class="muted">${evTagTxt(s)}</td>`;
      if (typeof s !== 'number') return '<td class="muted">—</td>';
      return `<td class="${s < +e.max / 2 ? 'bad' : ''}">${fr(s, 2)}</td>`; };
    const moy = e => { const x = c.pupils.map(p => e.s[p.id]).filter(s => typeof s === 'number'); return x.length ? fr(x.reduce((a, b) => a + b, 0) / x.length, 1) : '—'; };
    return `${cs.length > 1 ? `<h3 class="fi-cl">${esc(c.name)}</h3>` : ''}<div class="tblw"><table class="bt num fi-evt">
      <thead><tr><th>Élève</th>${evs.map(e => `<th data-ev="${c.id}|${e.id}" title="${esc(e.name)}">${esc(e.name.length > 14 ? e.name.slice(0, 13) + '…' : e.name)}${e.kind === 'form' ? ' (F)' : ''}<br>/${fr(+e.max, 2)}${e.date ? ' · ' + esc(fmtD(e.date)) : ''}</th>`).join('')}</tr></thead>
      <tbody>${pupilsOf(c).map(p => `<tr data-pid="${p.id}" data-cid="${c.id}"><td>${esc(p.n)}</td>${evs.map(e => cell(e, p)).join('')}</tr>`).join('')}
      <tr class="fi-moy"><td>Moyenne</td>${evs.map(e => `<td>${moy(e)}</td>`).join('')}</tr></tbody>
    </table></div>`;
  };
  m.innerHTML = `<section class="sec">
    <h2>Évaluations</h2>
    ${periodChips(c0, true)}
    <p class="small muted" style="margin:0">Toutes les évaluations ${vp === 'year' ? 'de l\'année' : 'de la période'} d'un coup d'œil. Touche le titre d'une colonne pour modifier ses notes, un élève pour sa fiche. (F) = formative, ne compte pas.</p>
    ${cs.map(bloc).join('')}
  </section>`;
  // la période choisie vaut pour toutes les classes du groupe
  m.querySelectorAll('#pchips [data-p]').forEach(b => b.onclick = () => { cs.forEach(x => { UI.period[x.id] = b.dataset.p === 'year' ? 'year' : ((x.periods.find(p => p.id === b.dataset.p) || periodOf(x, (c0.periods.find(p => p.id === b.dataset.p) || {}).start || today()) || {}).id || b.dataset.p); }); saveUI(); render(); });
  m.querySelectorAll('[data-ev]').forEach(th => th.onclick = () => { const [cid, eid] = th.dataset.ev.split('|'), c = S.classes.find(x => x.id === cid), e = c && c.evals.find(x => x.id === eid); if (e) openEvalScores(c, e); });
  m.querySelectorAll('tr[data-pid]').forEach(tr => tr.onclick = () => openPupil(S.classes.find(x => x.id === tr.dataset.cid), tr.dataset.pid));
}
function fiEleves(cs, m){
  const grp = cs.length > 1, d = today();
  const row = (c, p) => { const vp = periodOf(c, d), r = vp ? compute(c, vp).res[p.id] : null, al = fiAlertTxt(c, p, d), cert = certOn(p, d);
    const bits = r ? [r.total != null ? fr(r.total, 0) + ' %' : '', r.abs ? r.abs + ' abs.' : '', r.kit ? r.kit + ' oubli' + (r.kit > 1 ? 's' : '') : '', r.d + r.x ? (r.d + r.x) + ' pert.' : ''].filter(Boolean) : [];

/* --- Fiche : historique daté de tout --- */
function fiHistHTML(c, p, vp){
  const year = vp === 'year', inP = date => year || periodOf(c, date)?.id === vp.id, ev = [];
  const hh = l => l.h ? slotLabel(l) : '';
  let nL = 0, nP = 0;
  c.lessons.filter(l => inP(l.date)).forEach(l => {
    nL++; const m = l.m[p.id] || {}, a = effA(p, l), pool = l.type === 'piscine', sp = l.sport ? ' · ' + l.sport : (pool ? ' · piscine' : '');
    const add = (t, ic, cls) => ev.push({date: l.date, k: rgKey(l), h: hh(l), t, ic, cls, sp});
    if (a === 'A'){ add('Absent', '✗', 'abs'); return; }
    nP++;
    if (a === 'R') add('En retard', '⏱', '');
    if (a === 'D') add(certOn(p, l.date, l.type) ? 'Dispensé (certificat)' : 'Dispensé', '🩺', '');
    if (m.k) add(pool ? 'Affaires de piscine oubliées' : 'Tenue de sport oubliée', '👕', 'k');
    if (m.np) add('Ne nage pas', '🏊', '');
    if (m.rg && pool){ const s = rgStreak(c, l, p); add('Règles (ne nage pas)' + (s > 1 ? ` · ${s}e semaine de suite` : ''), 'R', ''); }
    if (m.x) add('Exclu du cours', '⛔', 'd'); else if (m.d) add('Perturbe le cours', '👎', 'd');
  });
  c.evals.filter(e => e.date ? inP(e.date) : (year || e.periodId === vp.id)).forEach(e => { const s = e.s[p.id]; if (s == null) return;
    ev.push({date: e.date || '', k: (e.date || '') + '99', h: '', t: `${e.kind === 'form' ? 'Éval. formative' : 'Évaluation'} « ${e.name} » : ${evTag(s) ? evTagLong(s) : fr(s, 2) + '/' + fr(+e.max, 2)}`, ic: '📝', cls: 'fe', sp: ''}); });
  (p.certs || []).forEach(x => { if (!(year || inP(x.from) || inP(x.to))) return;
    ev.push({date: x.from, k: x.from + '00', h: '', t: `Certificat médical jusqu'au ${dFR(x.to)}${zoneTxt(x) ? ' (' + zoneTxt(x) + ')' : ''}${x.note ? ' · ' + x.note : ''}`, ic: '🩺', cls: '', sp: ''}); });
  (year ? periodsOf(c) : [vp]).forEach(pp => { const a = ((c.adj || {})[pp.id] || {})[p.id]; if (!a) return;
    if (+a.t) ev.push({date: pp.start, k: pp.start + '00', h: '', t: `${a.t} point${a.t > 1 ? 's' : ''} de tenue repris du relevé de l'école`, ic: '👕', cls: 'k', sp: ''});
    if (+a.c) ev.push({date: pp.start, k: pp.start + '00', h: '', t: `${a.c} point${a.c > 1 ? 's' : ''} d'attitude repris du relevé de l'école`, ic: '👎', cls: 'd', sp: ''}); });
  ev.sort((a, b) => a.k < b.k ? 1 : a.k > b.k ? -1 : 0);
  let mo = '';
  const lines = ev.map(e => { const mm = e.date ? MOISL[dOf(e.date).getMonth()] + ' ' + e.date.slice(0, 4) : '', head = mm !== mo ? `<div class="fi-mo">${esc(mm)}</div>` : ''; mo = mm;
    return head + `<div class="evt fi-ev ${e.cls}"><span class="d">${e.date ? esc(fmtD(e.date)) : ''}${e.h ? '<br>' + esc(e.h) : ''}</span><span class="fi-ic">${e.ic}</span><span class="l">${esc(e.t)}${e.sp ? `<span class="small muted">${esc(e.sp)}</span>` : ''}</span></div>`; }).join('');
  return `<h3>Historique daté</h3><div class="card"><div class="small muted" style="padding-bottom:6px">${year ? 'Toute l\'année' : esc(vp.name)} : présent à ${nP} cours sur ${nL}. Les cours sans rien à signaler ne sont pas listés.</div>${lines || '<span class="muted small">Rien à signaler.</span>'}</div>`;
}

/* --- Bulletin d'un seul élève --- */
function fiBulletin(c, pid, per){
  const ps = pupilsOf(c), i = ps.findIndex(x => x.id === pid), p = ps[i]; if (!p) return;
  const pers = periodsOf(c);
  let vp = per === 'year' ? 'year' : pers.find(x => x.id === per) || periodOf(c, today());
  if (!vp){ toast('Ajoute une période dans Réglages'); return; }
  const year = vp === 'year', X = year ? computeYear(c) : compute(c, vp), r = X.res[p.id], st = S.settings, seP = +st.se, T = +st.T || 0, Cc = +st.C || 0;
  const key = year ? 'year' : vp.id, mine = c.com && c.com[key] && typeof c.com[key][p.id] === 'string' ? c.com[key][p.id] : null;
  const com = mine != null ? mine : comText(c, vp, X, p), k = comCounts(c, X, p, vp);
  const row = (l, v, cls) => `<div class="fi-br ${cls || ''}"><span>${l}</span><b class="num">${v}</b></div>`;
  const fo = year ? [] : c.evals.filter(e => e.periodId === vp.id && e.kind === 'form' && e.s[p.id] != null);
  const h = `
    <div class="chips" id="fb-chips">${pers.map(x => `<button class="chip" type="button" data-fb="${x.id}" aria-pressed="${!year && vp.id === x.id}">${esc(x.name)}</button>`).join('')}<button class="chip" type="button" data-fb="year" aria-pressed="${year}">Année</button></div>
    <div class="fi-bh"><div><div class="small muted">${esc(c.name)} · ${year ? 'Année' : esc(vp.name)}${year ? '' : ' · ' + esc(suRange(c, vp))}</div><b>${esc(p.n)}</b></div>
      <div class="fi-tot num ${r.total != null && r.total < 50 ? 'bad' : ''}">${fr(r.total)}<small> %</small></div></div>
    ${!year && periodOf(c, today())?.id === vp.id && fiAlertTxt(c, p, today()) ? `<div class="fi-al fi-al-b">${esc(fiAlertTxt(c, p, today()))}</div>` : ''}
    <div class="card fi-bt">
      ${year ? (X.periods || []).map(pp => { const t = compute(c, pp).res[p.id]; return row(esc(pp.name), t.total != null ? fr(t.total) + ' %' : 'S-être ' + fr(t.se) + '/' + seP); }).join('') : ''}
      ${row('Savoir-être', `${fr(r.se)}<small>/${seP}</small>`, 'big')}
      ${year ? '' : row('&nbsp;&nbsp;Tenue', `${r.t}<small>/${T}</small>`) + row('&nbsp;&nbsp;Attitude', `${r.c}<small>/${Cc}</small>`)}
      ${row('Savoir-faire', `${fr(r.sf)}<small>/${100 - seP}</small>`, 'big')}
      ${year ? '' : r.evals.map(({e, s}) => row('&nbsp;&nbsp;' + esc(e.name) + (e.date ? ` <span class="small muted">${esc(fmtD(e.date))}</span>` : ''), evTag(s) ? evTagTxt(s) : s == null ? '—' : `${fr(s, 2)}<small>/${fr(+e.max, 2)}</small>`)).join('')}
      ${row(year ? 'Moyenne de l\'année' : 'Total', `${fr(r.total)}<small> %</small>`, 'big tot')}
    </div>
    ${fo.length ? `<h3>Formatif (ne compte pas)</h3><div class="card fi-bt">${fo.map(e => row(esc(e.name), evTag(e.s[p.id]) ? evTagTxt(e.s[p.id]) : `${fr(e.s[p.id], 2)}<small>/${fr(+e.max, 2)}</small>`)).join('')}</div>` : ''}
    <div class="card fi-bt">${row('Absences', k.abs)}${row('Retards', r.late || 0)}${row('Oublis de tenue', k.gym + k.adjT + k.pool)}${k.np ? row('Pas nagé', k.np) : ''}${row('Perturbations', k.d)}${row('Exclusions', k.x)}</div>
    <h3>Commentaire${mine != null ? ' <span class="tag com-man">✎ modifié</span>' : ''}</h3>
    <div class="card small">${esc(com) || '<span class="muted">Pas de commentaire.</span>'}</div>
    <div class="row2"><button class="btn" type="button" id="fb-copy">Copier le commentaire</button><button class="btn" type="button" id="fb-back">‹ Retour à la fiche</button></div>`;
  openSheet('Bulletin · ' + p.n, h, {prev: ps[i - 1] && (() => fiBulletin(c, ps[i - 1].id, year ? 'year' : vp.id)), next: ps[i + 1] && (() => fiBulletin(c, ps[i + 1].id, year ? 'year' : vp.id)), pos: `${i + 1}/${ps.length}`});
  sheetOnClose = () => render();
  document.querySelectorAll('#fb-chips [data-fb]').forEach(b => b.onclick = () => fiBulletin(c, pid, b.dataset.fb));
  $('fb-copy').onclick = () => { if (!com.trim()){ toast('Commentaire vide'); return; } comCopy(com, 'Commentaire copié'); };
  $('fb-back').onclick = () => openPupil(c, pid);
}

<script>
/* Scanner de document pour le Carnet (certificats médicaux).
   scanDoc(fichier, boite) affiche la photo avec 4 coins à placer (trouvés tout seuls si la feuille
   ressort du fond), redresse la feuille puis la passe en noir et blanc bien contrasté.
   Renvoie une image JPEG (data URL) ou null si on annule. */
(() => {
  const charger = f => new Promise((ok, ko) => { const u = URL.createObjectURL(f), i = new Image(); i.onload = () => { URL.revokeObjectURL(u); ok(i); }; i.onerror = ko; i.src = u; });

  // Coins de la feuille : zone claire la plus grande (seuil d'Otsu), puis ses 4 extrémités.
  function coins(img){
    const k = 360 / Math.max(img.naturalWidth, img.naturalHeight), w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, w, h);
    const d = cx.getImageData(0, 0, w, h).data, g = new Uint8Array(w * h), hist = new Array(256).fill(0);
    for (let i = 0; i < w * h; i++){ const v = (d[i * 4] * 3 + d[i * 4 + 1] * 6 + d[i * 4 + 2]) / 10 | 0; g[i] = v; hist[v]++; }
    let somme = 0; for (let i = 0; i < 256; i++) somme += i * hist[i];
    let sB = 0, wB = 0, meil = 0, seuil = 128;
    for (let t = 0; t < 256; t++){ wB += hist[t]; if (!wB) continue; const wF = w * h - wB; if (!wF) break; sB += t * hist[t];
      const mB = sB / wB, mF = (somme - sB) / wF, v = wB * wF * (mB - mF) * (mB - mF); if (v > meil){ meil = v; seuil = t; } }
    const vu = new Uint8Array(w * h), pile = new Int32Array(w * h);
    let best = null, bestN = 0;
    for (let s = 0; s < w * h; s++){
      if (vu[s] || g[s] <= seuil) continue;
      let n = 0, top = 0, tl = [0, 0, 1e9], br = [0, 0, -1e9], tr = [0, 0, -1e9], bl = [0, 0, 1e9];
      pile[top++] = s; vu[s] = 1;
      while (top){ const p = pile[--top], x = p % w, y = p / w | 0; n++;
        if (x + y < tl[2]) tl = [x, y, x + y]; if (x + y > br[2]) br = [x, y, x + y];
        if (x - y > tr[2]) tr = [x, y, x - y]; if (x - y < bl[2]) bl = [x, y, x - y];
        if (x > 0 && !vu[p - 1] && g[p - 1] > seuil){ vu[p - 1] = 1; pile[top++] = p - 1; }
        if (x < w - 1 && !vu[p + 1] && g[p + 1] > seuil){ vu[p + 1] = 1; pile[top++] = p + 1; }
        if (y > 0 && !vu[p - w] && g[p - w] > seuil){ vu[p - w] = 1; pile[top++] = p - w; }
        if (y < h - 1 && !vu[p + w] && g[p + w] > seuil){ vu[p + w] = 1; pile[top++] = p + w; } }
      if (n > bestN){ bestN = n; best = [tl, tr, br, bl]; }
    }
    const marge = [[.06, .06], [.94, .06], [.94, .94], [.06, .94]].map(([a, b]) => [a * img.naturalWidth, b * img.naturalHeight]);
    if (!best || bestN < w * h * .12 || bestN > w * h * .97) return marge;
    return best.map(([x, y]) => [x / k, y / k]);
  }

  // Homographie qui envoie le rectangle de sortie sur les 4 coins de la photo.
  function homographie(src, W, H){
    const dst = [[0, 0], [W, 0], [W, H], [0, H]], A = [], b = [];
    for (let i = 0; i < 4; i++){ const [x, y] = dst[i], [u, v] = src[i];
      A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
      A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v); }
    for (let c = 0; c < 8; c++){ let m = c; for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[m][c])) m = r;
      [A[c], A[m]] = [A[m], A[c]]; [b[c], b[m]] = [b[m], b[c]];
      for (let r = 0; r < 8; r++){ if (r === c) continue; const f = A[r][c] / A[c][c]; for (let k = c; k < 8; k++) A[r][k] -= f * A[c][k]; b[r] -= f * b[c]; } }
    return b.map((v, i) => v / A[i][i]);
  }
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

  function redresser(img, q){
    const larg = Math.max(dist(q[0], q[1]), dist(q[3], q[2])), haut = Math.max(dist(q[0], q[3]), dist(q[1], q[2]));
    const s = Math.min(1, 1500 / Math.max(larg, haut)), W = Math.round(larg * s), H = Math.round(haut * s);
    // photo d'origine, au plus 2400 px
    const k = Math.min(1, 2400 / Math.max(img.naturalWidth, img.naturalHeight)), sw = Math.round(img.naturalWidth * k), sh = Math.round(img.naturalHeight * k);
    const sc = document.createElement('canvas'); sc.width = sw; sc.height = sh; const sx = sc.getContext('2d'); sx.drawImage(img, 0, 0, sw, sh);
    const sd = sx.getImageData(0, 0, sw, sh).data, gs = new Float32Array(sw * sh);
    for (let i = 0; i < sw * sh; i++) gs[i] = (sd[i * 4] * 3 + sd[i * 4 + 1] * 6 + sd[i * 4 + 2]) / 10;
    const M = homographie(q.map(([x, y]) => [x * k, y * k]), W, H), out = new Float32Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
      const z = M[6] * x + M[7] * y + 1, u = (M[0] * x + M[1] * y + M[2]) / z, v = (M[3] * x + M[4] * y + M[5]) / z;
      const x0 = Math.max(0, Math.min(sw - 2, u | 0)), y0 = Math.max(0, Math.min(sh - 2, v | 0)), fx = Math.min(1, Math.max(0, u - x0)), fy = Math.min(1, Math.max(0, v - y0)), p = y0 * sw + x0;
      out[y * W + x] = (gs[p] * (1 - fx) + gs[p + 1] * fx) * (1 - fy) + (gs[p + sw] * (1 - fx) + gs[p + sw + 1] * fx) * fy;
    }
    return {W, H, out};
  }

  // Noir et blanc : on enleve les ombres (fond flou) puis on pousse le contraste.
  function encrer({W, H, out}){
    const pc = document.createElement('canvas'); pc.width = W; pc.height = H; const px = pc.getContext('2d');
    const im = px.createImageData(W, H);
    for (let i = 0; i < W * H; i++){ const v = out[i]; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; }
    px.putImageData(im, 0, 0);
    const bw = Math.max(1, Math.round(W / 24)), bh = Math.max(1, Math.round(H / 24)), bc = document.createElement('canvas'); bc.width = bw; bc.height = bh;
    const bx = bc.getContext('2d'); bx.imageSmoothingEnabled = true; bx.drawImage(pc, 0, 0, bw, bh);
    const fc = document.createElement('canvas'); fc.width = W; fc.height = H; const fx = fc.getContext('2d'); fx.imageSmoothingEnabled = true; fx.filter = 'blur(6px)'; fx.drawImage(bc, 0, 0, W, H);
    const fond = fx.getImageData(0, 0, W, H).data;
    for (let i = 0; i < W * H; i++){
      let v = out[i] / Math.max(40, fond[i * 4]);       // 1 = papier, < 1 = encre
      v = (v - .55) / (.9 - .55); v = v < 0 ? 0 : v > 1 ? 1 : v; v = Math.pow(v, 1.6) * 255;
      im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v;
    }
    px.putImageData(im, 0, 0);
    return pc;
  }
  function jpeg(cv){
    for (const [cote, q] of [[1500, .72], [1300, .65], [1100, .6], [900, .55], [750, .5]]){
      const k = Math.min(1, cote / Math.max(cv.width, cv.height)), c2 = document.createElement('canvas');
      c2.width = Math.round(cv.width * k); c2.height = Math.round(cv.height * k); c2.getContext('2d').drawImage(cv, 0, 0, c2.width, c2.height);
      const d = c2.toDataURL('image/jpeg', q); if (d.length < 230000) return d;
    }
    throw new Error('trop grand');
  }

  window.scanDoc = async (fichier, boite) => {
    const img = await charger(fichier), q = coins(img);
    return new Promise(fin => {
      boite.innerHTML = `<div class="small muted" style="margin:4px 0">Place les 4 ronds sur les coins de la feuille, puis valide.</div>
        <div style="position:relative;touch-action:none;user-select:none"><canvas id="sc-cv" style="width:100%;display:block;border-radius:10px"></canvas></div>
        <div class="row2" style="margin-top:8px"><button class="btn" type="button" id="sc-brut">Garder la photo</button><button class="btn pri" type="button" id="sc-ok">✓ Valider le scan</button></div>`;
      const cv = boite.querySelector('#sc-cv'), k = Math.min(1, 900 / Math.max(img.naturalWidth, img.naturalHeight));
      cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
      const cx = cv.getContext('2d'), pts = q.map(([x, y]) => [x * k, y * k]);
      const dessin = () => {
        cx.drawImage(img, 0, 0, cv.width, cv.height);
        cx.fillStyle = 'rgba(0,0,0,.35)'; cx.beginPath(); cx.rect(0, 0, cv.width, cv.height); cx.moveTo(...pts[0]); [3, 2, 1].forEach(i => cx.lineTo(...pts[i])); cx.closePath(); cx.fill('evenodd');
        cx.strokeStyle = '#1f5fd1'; cx.lineWidth = Math.max(2, cv.width / 220); cx.beginPath(); pts.forEach((p, i) => i ? cx.lineTo(...p) : cx.moveTo(...p)); cx.closePath(); cx.stroke();
        const r = Math.max(10, cv.width / 32);
        pts.forEach(p => { cx.beginPath(); cx.arc(p[0], p[1], r, 0, 7); cx.fillStyle = 'rgba(31,95,209,.35)'; cx.fill(); cx.lineWidth = Math.max(2, cv.width / 260); cx.strokeStyle = '#fff'; cx.stroke(); });
      };
      dessin();
      let pris = -1;
      const pos = e => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) * cv.width / b.width, (e.clientY - b.top) * cv.height / b.height]; };
      cv.addEventListener('pointerdown', e => { const p = pos(e); let m = 1e9; pts.forEach((q, i) => { const d = dist(p, q); if (d < m){ m = d; pris = i; } }); if (m > cv.width / 4) pris = -1; else { cv.setPointerCapture(e.pointerId); e.preventDefault(); } });
      cv.addEventListener('pointermove', e => { if (pris < 0) return; const p = pos(e); pts[pris] = [Math.max(0, Math.min(cv.width, p[0])), Math.max(0, Math.min(cv.height, p[1]))]; dessin(); e.preventDefault(); });
      const lacher = () => pris = -1; cv.addEventListener('pointerup', lacher); cv.addEventListener('pointercancel', lacher);
      boite.querySelector('#sc-ok').onclick = () => {
        boite.querySelector('#sc-ok').textContent = 'Un instant…';
        setTimeout(() => { try { fin(jpeg(encrer(redresser(img, pts.map(([x, y]) => [x / k, y / k]))))); } catch(e){ fin(null); } }, 30);
      };
      boite.querySelector('#sc-brut').onclick = () => { const c2 = document.createElement('canvas'); c2.width = img.naturalWidth; c2.height = img.naturalHeight; c2.getContext('2d').drawImage(img, 0, 0); try { fin(jpeg(c2)); } catch(e){ fin(null); } };
    });
  };
})();

<script>
/* Compteurs du recapitulatif (absences, oublis, pas nage, perturbations, exclusions). */
function comCounts(c, X, p, vp){
  const o = {abs: 0, gym: 0, pool: 0, np: 0, d: 0, x: 0, adjT: 0};
  // points retires avant l'appli (releve de l'ecole) : tenue -> oublis, comportement -> perturbations
  (vp === 'year' ? (X.periods || []) : [vp]).forEach(pp => { const a = ((c.adj || {})[pp.id] || {})[p.id]; if (a){ o.adjT += +a.t || 0; o.d += +a.c || 0; } });
  X.lessons.forEach(l => {
    const a = effA(p, l); if (a === 'A'){ o.abs++; return; }
    const m = l.m[p.id] || {};
    if (m.k){ if (l.type === 'piscine') o.pool++; else o.gym++; }
    if (m.np) o.np++; // regles : jamais comptees ni mentionnees
    if (m.x) o.x++; else if (m.d) o.d++;
  });
  return o;
}
function comText(c, vp, X, p){
  // Recap neutre : seulement les chiffres qui expliquent la note (aucun jugement, aucun conseil).
  const r = X.res[p.id], st = S.settings, seP = +st.se, n0 = v => fr(v, 0), year = vp === 'year', out = [];
  if (year){
    const per = (X.periods || []).map(pp => { const t = compute(c, pp).res[p.id].total; return t != null ? `${pp.name} : ${n0(t)} %` : null; }).filter(Boolean);
    if (per.length) out.push(per.join(', ') + '.');
    if (r.total != null) out.push(`Moyenne de l'année : ${n0(r.total)} %.`);
    if (r.se != null) out.push(`Savoir-être moyen ${n0(r.se)}/${seP}` + (r.sf != null ? `, savoir-faire moyen ${n0(r.sf)}/${100 - seP}.` : '.'));
  } else {
    const se = `avoir-être ${n0(r.se)}/${seP} (tenue ${r.t}/${+st.T || 0}, attitude ${r.c}/${+st.C || 0})`;
    if (r.total != null){ out.push(`${vp.name} : ${n0(r.total)} %.`, `S${se}.`); if (r.sf != null) out.push(`Savoir-faire ${n0(r.sf)}/${100 - seP}.`); }
    else out.push(`${vp.name} : s${se}.`);
    const ev = r.evals.filter(o => typeof o.s === 'number');
    if (ev.length) out.push('Évaluations : ' + ev.map(o => `${o.e.name.trim() || 'évaluation'} ${fr(o.s, 2)}/${fr(+o.e.max, 2)}`).join(', ') + '.');
    const fo = c.evals.filter(e => e.periodId === vp.id && e.kind === 'form' && typeof e.s[p.id] === 'number');
    if (fo.length) out.push('Formatif : ' + fo.map(e => `${e.name.trim() || 'évaluation'} ${fr(e.s[p.id], 2)}/${fr(+e.max, 2)}`).join(', ') + '.');
  }
  const k = comCounts(c, X, p, vp), salle = k.gym + k.adjT;
  if (k.abs) out.push(`Absences : ${k.abs}.`);
  if (k.pool) out.push(`Oublis de tenue : ${[salle ? salle + ' en salle' : '', k.pool + ' à la piscine'].filter(Boolean).join(', ')}.`);
  else if (salle) out.push(`Oublis de tenue : ${salle}.`);
  if (k.np) out.push(`Pas nagé : ${k.np}.`);
  if (k.d) out.push(`Perturbations : ${k.d}.`);
  if (k.x) out.push(`Exclusions : ${k.x}.`);
  return out.join(' ');
}
function comCopy(txt, ok){
  const done = () => toast(ok || 'Copié');
  const old = () => { const t = document.createElement('textarea'); t.value = txt; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(t); t.select(); let r = false; try { r = document.execCommand('copy'); } catch(e){} t.remove(); r ? done() : toast('Copie impossible, sélectionne le texte à la main'); };
  try { if (navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(done, old); return; } } catch(e){}
  old();
}
function openComments(c, vp){
  const X = vp === 'year' ? computeYear(c) : compute(c, vp), key = vp === 'year' ? 'year' : vp.id;
  const auto = S.settings.comAuto !== false;
  const store = () => { if (!c.com) c.com = {}; if (!c.com[key]) c.com[key] = {}; return c.com[key]; };
  const man = pid => (c.com && c.com[key] && typeof c.com[key][pid] === 'string') ? c.com[key][pid] : null;
  const ps = pupilsOf(c), gen = {};
  ps.forEach(p => gen[p.id] = comText(c, vp, X, p));
  const cur = pid => { const v = man(pid); return v != null ? v : auto ? gen[pid] : ''; };
  const pct = p => { const r = X.res[p.id]; return r.total; };
  openSheet(`Commentaires · ${vp === 'year' ? 'Année' : vp.name}`, `
    <p class="small muted" style="margin:0">${auto ? 'Récapitulatif écrit tout seul d\'après les points, les évaluations et les oublis. Tu peux le modifier : ta version est gardée.' : 'Commentaire automatique désactivé (Réglages) : écris ton texte, ou touche ✨ Proposer un texte.'}</p>
    <button class="btn pri block" type="button" id="com-all">📋 Tout copier (${esc(c.name)})</button>
    ${ps.map(p => { const t = pct(p);
      return `<div class="card com-it" data-cpid="${p.id}"><div class="hd"><b>${esc(p.n)}</b>${t != null ? `<span class="tag ${t < 50 ? 'com-low' : ''}" style="${t < 50 ? '' : 'background:var(--surface2)'}">${t < 50 ? '⚠ ' : ''}${fr(t, 0)} %</span>` : ''}<span class="tag com-man" data-man ${man(p.id) != null ? '' : 'hidden'}>✎ modifié</span></div>
        <textarea class="inp" rows="4" aria-label="Commentaire de ${esc(p.n)}" placeholder="${auto ? '' : 'Écris ton commentaire…'}"></textarea>
        <div class="row2"><button class="btn" type="button" data-copy>Copier</button><button class="btn" type="button" data-reset>${auto ? '↺ Texte automatique' : '✨ Proposer un texte'}</button></div></div>`; }).join('')}`);
  const sb = document.querySelector('.sheet .sb');
  sb.querySelectorAll('[data-cpid]').forEach(box => {
    const pid = box.dataset.cpid, ta = box.querySelector('textarea'), tag = box.querySelector('[data-man]'), rs = box.querySelector('[data-reset]');
    const sync = () => { const m = man(pid) != null; tag.hidden = !m; if (auto) rs.disabled = !m; };
    const fit = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px'; };
    ta.value = cur(pid); sync(); requestAnimationFrame(fit);
    let tm = null;
    const keep = () => { clearTimeout(tm); tm = null; const v = ta.value, st = store();
      if (auto ? v === gen[pid] : v.trim() === '') delete st[pid]; else st[pid] = v;
      if (!Object.keys(st).length) delete c.com[key];
      save(c.id); sync(); };
    ta.oninput = () => { fit(); clearTimeout(tm); tm = setTimeout(keep, 400); };
    ta.onblur = () => { if (tm) keep(); };
    box.querySelector('[data-copy]').onclick = () => { if (tm) keep(); const v = ta.value.trim(); if (!v){ toast('Commentaire vide'); return; } comCopy(v, 'Commentaire copié'); };
    rs.onclick = () => { clearTimeout(tm); tm = null; ta.value = gen[pid]; fit(); keep(); if (!auto) toast('Texte proposé, tu peux le modifier'); };
  });
  $('com-all').onclick = () => {
    sb.querySelectorAll('[data-cpid]').forEach(box => box.querySelector('textarea').blur());
    const lines = ps.map(p => [p.n, cur(p.id).replace(/\s*\n\s*/g, ' ').trim()]).filter(x => x[1]).map(([n, t]) => `${n} : ${t}`);
    if (!lines.length){ toast('Aucun commentaire à copier'); return; }
    comCopy(lines.join('\n'), `${lines.length} commentaire${lines.length > 1 ? 's' : ''} copié${lines.length > 1 ? 's' : ''}`);
  };
}
</script>

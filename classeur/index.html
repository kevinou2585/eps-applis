<script id="data" type="application/json">{"general":[["Ateliers à 3 niveaux de couleur","Pour un même exercice, préparer trois versions marquées par des cônes de couleur : vert (facile), orange (standard), rouge (défi). L'élève choisit et peut changer. Les élèves faibles réussissent, les meilleurs ne s'ennuient pas."],["Rituel d'entrée","Même début à chaque leçon : appel en 2 minutes, objectif du jour écrit au tableau, puis le premier jeu de l'échauffement est déjà connu. Ça fait gagner du temps et ça rassure les élèves fragiles."],["Échauffement autonome","À partir de la leçon 3, un groupe de 3-4 élèves mène l'échauffement à partir de la fiche. Bon moyen d'impliquer les élèves moins sportifs."],["Rôles pour tous","Arbitre, chronométreur, coach, observateur avec une grille simple, secrétaire. Les élèves dispensés ou blessés ont toujours un rôle et une note de participation."],["Évaluer le progrès","Noter les performances de la leçon 1 (record de départ) dans une liste. Les grilles de ce classeur réservent des points au progrès : un élève faible qui progresse peut avoir une bonne note."],["Auto-évaluation","En fin de leçon (2 minutes), l'élève lève 1, 2 ou 3 doigts : « J'ai réussi le critère du jour ? ». Pour l'évaluation, une petite fiche « je pense avoir… / le prof a noté… »."],["Constituer les équipes","Le professeur fait les équipes (jamais deux capitaines qui choisissent), équilibrées et mixtes, et les garde 2 ou 3 leçons pour que les élèves apprennent à jouer ensemble."],["Moins de files d'attente","Plus d'ateliers plus petits : 4 à 6 élèves par atelier au maximum, plusieurs ballons. Un élève faible qui attend ne progresse pas."],["Consignes courtes","Une consigne de 30 secondes maximum, une démonstration, puis on joue. On corrige en jouant, par petits groupes, plutôt qu'en arrêtant toute la classe."]],"cycles":[{"id":"basket","nom":"Basket-ball","icon":"🏀","couleur":"#e8743b","intro":"Cycle d'initiation au basket-ball : manier le ballon en dribble, passer et recevoir, tirer au panier puis jouer collectivement en respectant les règles de base (marcher, double dribble, contacts). Les situations viennent surtout du livret « École secondaire & primaire II » et du Tome 02 ; les règles et fondamentaux de la partie théorique du livret « EP à la maison ».","theorie":[866,868,867],"materiel":"1 ballon de basket par élève (taille 5 ou 6), chasubles 4 couleurs, cônes, cerceaux, 2 à 4 paniers, seaux ou bancs suédois, sifflet.","lecons":[{"titre":"Maîtriser le ballon : le dribble","obj":["Dribbler main droite et main gauche sans regarder le ballon","Protéger son ballon en se déplaçant","Changer de main au signal"],"ech":[{"n":"Attraper la balle","t":8,"d":"Chaque élève dribble dans l'espace. 2 à 3 « voleurs » sans ballon tentent de chiper un ballon ; celui qui perd son ballon devient voleur. Exiger le dribble (pas le ballon en main).","r":675,"v":"Imposer la main faible pendant 1 minute.","c":null,"s":"voleurs"},{"n":"Échanger le ballon","t":7,"d":"Tout le monde dribble sur place puis en marchant ; au coup de sifflet, on échange son ballon avec un partenaire sans arrêter de dribbler.","r":687,"v":"Le professeur appelle un prénom : cet élève essaie de faire perdre le ballon à un camarade.","c":null,"s":"libre"}],"corps":[{"n":"Pousser le ballon","t":15,"d":"Dans un demi-terrain, chacun dribble et protège son ballon (corps entre ballon et adversaire) tout en essayant de sortir le ballon des autres. Celui qui perd le contrôle fait 3 tours de dribble autour du terrain puis revient (pas d'élimination longue).","r":658,"v":null,"c":"Je garde mon ballon 30 secondes sans le perdre.","s":"libre"},{"n":"Bâton + dribble","t":10,"d":"L'élève dribble d'une main et tient un bâton vertical de l'autre. Au signal, il lâche le bâton, change de main et rattrape le bâton avant sa chute, sans arrêter le dribble.","r":554,"v":"Sans bâton : simple changement de main au sifflet, devant/derrière le dos.","c":null,"s":"libre"},{"n":"Défi sonique – dribble","t":10,"d":"Par deux, un ballon chacun. On fait tourner un cerceau au sol (comme une toupie) ; tant qu'il tourne, on fait le plus de tours possible autour en dribblant.","r":614,"v":null,"c":null,"s":"deux"},{"n":"Dribble bas – dribble haut","t":10,"d":"Par deux, un bâton tenu par les deux élèves avec un cône-coupelle enfilé dessus. Le dribbleur descend en dribble bas puis remonte en dribble haut pour faire glisser la coupelle d'un côté à l'autre.","r":526,"v":"Niveau avancé : deux ballons, les deux élèves dribblent.","c":null,"s":"deux"},{"n":"Traverser la rue","t":10,"d":"4 groupes dans les 4 coins du terrain, un ballon chacun. Au signal, tout le groupe traverse en dribble vers le coin opposé sans toucher personne ni perdre le ballon.","r":633,"v":null,"c":"Je traverse sans contact et sans perte de balle.","s":"coins"},{"n":"Ballon passé en cercle","t":10,"d":"En cercle, chacun dribble sur place. Au signal « à droite ! », on lâche son ballon et on reprend celui du voisin de droite sans qu'il s'arrête de rebondir. Idem « à gauche ».","r":643,"v":null,"c":null,"s":"cercle"}],"mission":"Garder son ballon 30 secondes face aux voleurs"},{"titre":"Passer et recevoir","obj":["Réaliser une passe à deux mains poitrine et une passe à terre","Recevoir le ballon les mains en coupe, bras tendus vers le passeur","Se démarquer pour recevoir"],"ech":[{"n":"Formation de groupes","t":7,"d":"Chaque élève dribble dans l'espace ; au signal le professeur annonce un nombre (2, 3, 4…) et les élèves forment des groupes de ce nombre en continuant à dribbler.","r":660,"v":null,"c":null,"s":"libre"},{"n":"Chat sauveur avec ballon","t":8,"d":"1 ou 2 chats (une frite en mousse), 1 ou 2 sauveurs avec un ballon. Un élève touché est figé ; un sauveur le libère en échangeant 6 passes avec lui à 3 m.","r":622,"v":null,"c":null,"s":"chat"}],"corps":[{"n":"Va rapidement","t":10,"d":"Groupes de 4-5 en petit cercle, un ballon chacun. Tous passent en même temps au voisin (sens horaire) et reçoivent celui de l'autre voisin. Compter le nombre de tours sans faire tomber de ballon.","r":549,"v":"Changer de sens au sifflet ; passe à terre uniquement.","c":null,"s":"cercle"},{"n":"Passe alternée","t":10,"d":"Groupes de 3 en ligne : celui du milieu passe à un bout et prend sa place, le receveur passe à l'autre bout et prend sa place, etc. Passe poitrine puis passe à terre.","r":678,"v":null,"c":null,"s":"trois"},{"n":"Courir plus vite que le ballon","t":10,"d":"Grand cercle (2-3 m entre élèves). Un coureur fait le tour du cercle pendant que le groupe fait faire un tour complet au ballon par des passes. Qui revient le premier : le coureur ou le ballon ?","r":478,"v":null,"c":null,"s":"cerclecourse"},{"n":"Bobinho (passe à dix… contre deux)","t":15,"d":"Cercle de 6-8 élèves avec 2 défenseurs au centre. Les joueurs du cercle se passent le ballon ; si un défenseur l'intercepte, il échange sa place avec le passeur fautif.","r":72,"v":null,"c":"Ma passe arrive dans les mains du partenaire.","s":"cercle2"},{"n":"Jeu des 10 passes","t":20,"d":"Deux équipes sur un demi-terrain. Une équipe marque 1 point si elle réalise 10 passes sans interception, comptées à voix haute. Interdit de marcher avec le ballon ; pas de contact.","r":663,"v":"Autoriser 2 dribbles avant de passer ; diminuer à 6 passes si la classe peine.","c":null,"s":"match"}],"mission":"Faire voyager le ballon : 10 passes sans interception"},{"titre":"Tirer au panier","obj":["Tirer à une main, coude sous le ballon, poignet cassé vers le panier","Choisir une distance de tir adaptée","Enchaîner dribble et tir"],"ech":[{"n":"Courir au centre","t":7,"d":"Deux équipes assises sur les lignes de fond, ballons sur la ligne médiane. Au signal, chacun court prendre un ballon, revient en dribble à sa ligne puis le rapporte au centre. La première équipe complète marque.","r":650,"v":null,"c":null,"s":"centre"},{"n":"Vous ne passerez pas (variante ballon)","t":8,"d":"Un attrapeur au centre ; les autres traversent le terrain en dribblant. Celui qui est touché ou perd son ballon devient attrapeur avec le précédent.","r":236,"v":null,"c":null,"s":"traverser"}],"corps":[{"n":"Lancer : 1, 2 ou 3 points","t":15,"d":"Par 3 au panier : marquer trois distances (lancer franc = 1 point, distance moyenne = 2 points, la plus éloignée = 3 points). Chacun tire depuis chaque distance de face puis en diagonale, utiliser la planche.","r":867,"v":null,"c":"Je réussis au moins 2 tirs sur 5 à 2 points.","s":"tir"},{"n":"Panier ! (élimination douce)","t":15,"d":"Une colonne devant chaque panier. Celui qui marque gagne 1 point et retire le droit de tir du suivant ; celui qui rate va au bout de la colonne. Pas d'élimination définitive : on compte les points.","r":655,"v":null,"c":null,"s":"tir"},{"n":"Mini-circuit dribble + tir","t":15,"d":"Circuit : sauts pieds joints dans des cerceaux avec le ballon serré entre les pieds, slalom en dribble main droite/main gauche entre des cônes, puis tir. À chaque échec, on fait un pas en avant pour le tir suivant.","r":532,"v":"Remplacer la cible par le panier ; terminer par un double pas pour les plus avancés.","c":null,"s":"slalom"},{"n":"Balle dans la tour","t":20,"d":"Deux équipes ; à chaque bout, un élève debout sur un banc tient un seau (« panier mobile ») et essaie d'attraper les tirs de son équipe. Passes et dribbles autorisés, pas de contact, les autres joueurs n'entrent pas dans la zone du porteur de seau.","r":638,"v":"Pour la sécurité, le porteur reste au sol dans une zone interdite aux autres.","c":null,"s":"match"}],"mission":"Marquer 1, 2 ou 3 points : chacun choisit sa distance"},{"titre":"Jouer ensemble : conserver et progresser","obj":["Faire progresser le ballon vers le panier par des passes","Se démarquer dans un espace libre","Passer avant de tirer"],"ech":[{"n":"Pegobol","t":8,"d":"Jeu du chat où plusieurs chats ne peuvent toucher un fuyard qu'en tenant le ballon : ils doivent donc se faire des passes pour s'approcher. Ajouter un 2e ballon après 3 minutes.","r":274,"v":null,"c":null,"s":"chat"},{"n":"Formation de groupes (passes)","t":7,"d":"Les élèves dribblent ; au signal « 3 ! », former un trio et réaliser 5 passes avant de repartir.","r":660,"v":null,"c":null,"s":"libre"}],"corps":[{"n":"Le plus de passes","t":15,"d":"Une équipe court 5 tours de terrain pendant que l'autre, au centre, enchaîne le plus de passes possible en faisant toucher le ballon à tous. On inverse les rôles et on compare.","r":672,"v":"Les coureurs dribblent un ballon pendant leurs tours.","c":null,"s":"cerclecourse"},{"n":"Balle-espion (version basket)","t":15,"d":"Deux équipes, chacune dans son demi-terrain ; un joueur de chaque équipe est placé derrière la ligne de fond adverse. Réussir une passe à son « espion » : le passeur va le rejoindre. L'équipe qui fait passer le plus de joueurs gagne.","r":639,"v":null,"c":null,"s":"match"},{"n":"Panier après 5 passes","t":20,"d":"4 contre 4 sur un demi-terrain. Un panier ne compte (2 points) qu'après au moins 5 passes entre joueurs différents de l'équipe. Les classes à l'aise doivent aussi dribbler.","r":654,"v":null,"c":"Mon équipe marque après 5 passes au moins une fois par match.","s":"match"},{"n":"Défendre la tour","t":15,"d":"Une équipe dans un grand cercle protège un cône posé sur une caisse ; l'équipe à l'extérieur se passe le ballon pour trouver l'ouverture et renverser le cône. Si les défenseurs captent le ballon, on inverse les rôles.","r":162,"v":null,"c":null,"s":"tour"}],"mission":"Panier après 5 passes : tout le monde touche le ballon"},{"titre":"Les règles du jeu et le match 3 contre 3","obj":["Connaître et appliquer les règles de base : marcher, double dribble, contact, 3 secondes","Arbitrer un match d'élèves","Jouer un 3c3 en respectant les règles"],"ech":[{"n":"Traverser la rue","t":7,"d":"Rappel de la leçon 1 : traversée en dribble par groupes, puis avec changement de main au milieu du terrain.","r":633,"v":null,"c":null,"s":"coins"},{"n":"Va rapidement","t":8,"d":"Cercles de 4, passes simultanées ; puis passe à terre ; puis ajout d'un pas de pivot avant de passer.","r":549,"v":null,"c":null,"s":"cercle"}],"corps":[{"n":"Les règles en action","t":10,"d":"En 5 minutes de démonstration : le marcher (plus de 2 pas ballon en main), le double dribble, la faute de contact, la règle des 3 secondes dans la raquette, la valeur des paniers (1, 2, 3 points). Les élèves miment chaque faute et le geste d'arbitrage.","r":866,"v":null,"c":null,"s":"explication"},{"n":"Tournoi 3 contre 3 « panier après 5 passes »","t":30,"d":"Matchs de 5 minutes sur demi-terrain. Une équipe au repos arbitre (un arbitre, un marqueur). Panier valable après 3 passes, puis jeu libre au 3e match.","r":654,"v":null,"c":"Je fais moins de 2 fautes de règlement par match.","s":"match"},{"n":"Baquetvolley","t":25,"d":"Jeu original pour finir : on joue au basket mais le ballon peut aussi être joué avec les gestes du volley (passe haute, manchette, service) ; on peut dribbler, passer comme au basket ou choisir un geste de volley. On marque au panier. Les élèves proposent une nouvelle règle à tester.","r":636,"v":null,"c":null,"s":"match"}],"mission":"Le tournoi 3 contre 3 : jouer et arbitrer"},{"titre":"Évaluation","eval":true,"obj":["Évaluer le dribble, le tir et le jeu collectif","Évaluer l'application des règles et le fair-play"],"ech":[{"n":"Attraper la balle","t":8,"d":"Échauffement connu : dribble en fuyant les voleurs, main droite puis main gauche.","r":675,"v":null,"c":null,"s":"voleurs"},{"n":"Va rapidement + tirs libres","t":7,"d":"3 minutes de passes simultanées en cercle, puis 4 minutes de tirs libres à son panier.","r":549,"v":null,"c":null,"s":"cercle"}],"corps":[{"n":"Épreuve 1 – Parcours dribble","t":20,"d":"Parcours chronométré : slalom en dribble main droite à l'aller entre 5 cônes, main gauche au retour, puis tir. 2 essais, on garde le meilleur. Les élèves en attente s'entraînent au tir ou chronomètrent.","r":532,"v":null,"c":null,"s":"slalom"},{"n":"Épreuve 2 – Tirs","t":15,"d":"5 tirs à distance moyenne (2 points) et 3 lancers francs. Un camarade compte les réussites.","r":867,"v":null,"c":null,"s":"tir"},{"n":"Épreuve 3 – Match 3 contre 3 observé","t":30,"d":"Matchs de 5 minutes « panier après 3 passes ». Le professeur observe avec la grille ; les élèves au repos arbitrent.","r":654,"v":null,"c":null,"s":"match"}],"grille":[["Dribble",5,"Dribble en avançant sans perdre le ballon (2) ; utilise les deux mains, même maladroitement (1) ; termine le parcours, quel que soit le temps (1) ; tir final tenté (1)"],["Tir",4,"Tire à deux mains ou à une main, ballon au-dessus de la tête (2) ; réussite sur 5 (panier ou cible) : 1 = 1, 2 et + = 2"],["Jeu collectif",5,"Passe à un partenaire au lieu de garder le ballon (2) ; se déplace pour recevoir (2) ; revient en défense (1)"],["Progrès",3,"Compare avec son record de la leçon 1 (parcours ou tirs) : amélioration nette = 3, légère = 2, même niveau mais effort = 1"],["Règles et attitude",3,"Respecte les règles principales (1) ; arbitre ou compte les points pour les autres (1) ; accepte les décisions (1)"]],"mission":"La finale de la ligue"}],"fun":{"titre":"La ligue des dribbleurs","pitch":"Chaque leçon, les équipes gagnent des étoiles. À la leçon 6, la finale de la ligue désigne les champions de la classe.","badges":["Dribbleur de rue : dribbler 30 s sans perdre le ballon","Passeur fou : 5 passes de suite dans son équipe","Sniper : 2 paniers sur 5"]},"niveau":{"facile":["Ballons taille 5 ou ballons en mousse, légèrement dégonflés : moins de rebonds incontrôlés.","Paniers abaissés quand c'est possible, sinon cible au tableau (carré) ou cerceau posé sur un banc : toucher = 1 point.","« Marcher » toléré à 3 pas au début ; le double dribble est seulement signalé, pas sanctionné, en leçons 1 et 2.","Défense à distance de bras, sans toucher le ballon en mains : l'attaquant a le temps de lever la tête."],"defi":["Dribble main faible imposée.","Tir après dribble (double pas) au lieu du tir à l'arrêt.","Défense individuelle autorisée à voler le ballon."],"idees":["Tableau des records de classe (parcours dribble, tirs sur 5) affiché chaque leçon : les élèves faibles battent leur propre record, pas celui des autres.","Point « tir 1 contre 0 » : en fin de match, l'élève qui n'a pas encore marqué tire seul, sans défenseur.","Règle « tout le monde touche » : un panier compte double si les 3 joueurs ont touché le ballon."]}},{"id":"volley","nom":"Volley-ball","icon":"🏐","couleur":"#3b7be8","intro":"Cycle d'initiation au volley-ball : passe haute (« touche » dans les livrets), manchette (traduite « titre »), service et construction de l'attaque en 3 touches, avec beaucoup de formes de jeu adaptées (rebond autorisé, lancer-attraper, jeu coopératif). Sources : surtout le livret « École secondaire & primaire II » et l'« Activités pour l'EPS scolaire ».","theorie":[863,873],"materiel":"Ballons de volley souples ou ballons d'initiation, baudruches, filet ou corde tendue (2 m - 2,10 m), cerceaux à suspendre, cônes, chasubles, une bâche ou un drap opaque pour le volley aveugle.","lecons":[{"titre":"Découvrir le ballon et la passe haute","obj":["Se placer sous le ballon","Réaliser une passe haute à deux mains (doigts en coupe au-dessus du front)","Garder le ballon en l'air avec ses partenaires"],"ech":[{"n":"Volley avec baudruches","t":8,"d":"Deux équipes de part et d'autre du filet, chacun avec une baudruche gonflée. En musique, on renvoie les baudruches chez l'adversaire. À l'arrêt de la musique, l'équipe qui a le moins de baudruches chez elle marque.","r":693,"v":null,"c":null,"s":"filet"},{"n":"Qui passe dessous ?","t":7,"d":"Le professeur lance un ballon de volley très haut ; à chaque rebond au sol, un élève doit passer dessous. Plus le rebond diminue, plus c'est difficile : réflexes et déplacements bas.","r":683,"v":null,"c":null,"s":"libre"}],"corps":[{"n":"Jonglage individuel","t":10,"d":"Chacun avec un ballon (ou baudruche) le garde en l'air le plus longtemps possible avec des passes hautes ; puis alterner passe haute / manchette.","r":588,"v":null,"c":"10 touches d'affilée sans chute.","s":"libre"},{"n":"Traverser à deux","t":15,"d":"Par deux avec un ballon : traverser le terrain d'un côté à l'autre en se faisant des passes hautes sans laisser tomber. Si le ballon tombe, on repart du début. Course entre binômes.","r":653,"v":null,"c":null,"s":"deux"},{"n":"Toquinho","t":20,"d":"Groupes de 4-5 en cercle, un ballon de volley : enchaîner passes hautes et manchettes en comptant à voix haute. Record du groupe sur 3 essais.","r":688,"v":"Obligation de toucher une fois le ballon pour soi (contrôle) avant de passer.","c":null,"s":"cercle"},{"n":"Main collée (lancer-attraper au filet)","t":20,"d":"Deux équipes de part et d'autre du filet. Le ballon doit passer par les mains de tous les joueurs avant que le dernier le renvoie par-dessus le filet ; on interdit de marcher ballon en main. Point si le ballon tombe chez l'adversaire. Deux ballons en jeu pour plus d'activité.","r":673,"v":"Exiger que la dernière passe soit une passe haute.","c":null,"s":"filet"}],"mission":"Record de la classe en baudruches et passes hautes"},{"titre":"La manchette","obj":["Réaliser une manchette bras tendus, mains jointes, jambes fléchies","Orienter la manchette vers un partenaire","Recevoir un ballon qui arrive vite"],"ech":[{"n":"La chaîne (chat qui s'allonge)","t":7,"d":"Un chat ; chaque élève touché lui donne la main et la chaîne grandit jusqu'à ce que tous soient pris.","r":265,"v":null,"c":null,"s":"chat"},{"n":"Jonglage manchette","t":8,"d":"Individuellement : 5 manchettes, 5 passes hautes, puis alterner. Ensuite par deux à 3 m.","r":588,"v":null,"c":null,"s":"deux"}],"corps":[{"n":"Balle au mur","t":15,"d":"Par deux face à un mur : l'un lance le ballon contre le mur, l'autre doit le renvoyer en manchette (ou l'attraper bras tendus pour les débutants). Celui qui rate laisse sa place à un challenger.","r":640,"v":null,"c":"Je renvoie 3 balles d'affilée en manchette.","s":"mur"},{"n":"Qui passe dessous ? (manchette)","t":10,"d":"Reprise de l'échauffement de la leçon 1, mais en renvoyant le ballon en manchette à chaque rebond.","r":683,"v":null,"c":null,"s":"libre"},{"n":"Volley avec rebond (volley-tennis)","t":25,"d":"Équipes de 4 de part et d'autre du filet. Le ballon peut rebondir une fois au sol avant chaque touche ; 3 touches maximum par camp. Service par en dessous. Idéal pour ceux qui ont du mal à frapper en manchette.","r":696,"v":null,"c":null,"s":"filet"},{"n":"Toquinho manchette","t":15,"d":"Cercles de 4-5 : seules les manchettes comptent. Record du groupe.","r":688,"v":null,"c":null,"s":"cercle"}],"mission":"Battre le record de manchettes du groupe"},{"titre":"Le service","obj":["Servir par en dessous (main en pelle, ballon tenu devant soi)","Viser une zone","Recevoir un service"],"ech":[{"n":"Le chat au service","t":8,"d":"Les chats ne peuvent toucher un fuyard qu'en lui envoyant une balle en mousse avec un geste de service par en dessous. Le professeur corrige le geste.","r":680,"v":null,"c":null,"s":"chat"},{"n":"Toquinho","t":7,"d":"Cercles de 4 en passe haute et manchette pour activer les bras et les jambes.","r":688,"v":null,"c":null,"s":"cercle"}],"corps":[{"n":"Service dans les cerceaux","t":15,"d":"Des cerceaux sont suspendus au filet ou à une corde à différentes hauteurs ; servir pour faire passer le ballon dans un cerceau. 1 point par cerceau traversé.","r":612,"v":null,"c":"Mon service passe le filet 3 fois sur 5.","s":"tir"},{"n":"Le sauvetage","t":20,"d":"Deux équipes de part et d'autre du filet. Chaque équipe a un « sauveteur » placé derrière la ligne de fond adverse, qui sert vers son équipe : un coéquipier qui attrape le ballon sans qu'il tombe est sauvé et rejoint le sauveteur pour servir à son tour. La première équipe entièrement sauvée gagne.","r":348,"v":null,"c":null,"s":"filet"},{"n":"Nettoyer son camp (au service)","t":15,"d":"Deux équipes, beaucoup de ballons. Pendant 60 secondes, on renvoie un maximum de ballons chez l'adversaire, uniquement par un service. L'équipe qui a le moins de ballons dans son camp gagne.","r":530,"v":null,"c":null,"s":"filet"},{"n":"Voleixiga","t":15,"d":"Chaque équipe a des ballons d'une couleur. Au signal, on les envoie par-dessus le filet (lancer puis service) pour qu'ils restent dans le camp adverse ; on compte ensuite les ballons de sa couleur chez l'adversaire.","r":410,"v":null,"c":null,"s":"filet"}],"mission":"Le service qui passe dans les cerceaux"},{"titre":"Construire l'attaque en 3 touches","obj":["Utiliser les 3 touches : réception, passe, renvoi","Renvoyer dans un espace libre","Se replacer après chaque échange"],"ech":[{"n":"Chat des cerceaux","t":7,"d":"Cerceaux au sol (moins que d'élèves). On n'est protégé que dans un cerceau ; au sifflet tout le monde doit changer de cerceau.","r":273,"v":null,"c":null,"s":"cerceaux"},{"n":"Trois touches et attaque","t":8,"d":"Grand cercle, un ballon : on compte « un, deux… » et à « trois ! » le joueur frappe le ballon vers un autre. S'il le contrôle, l'attaquant sort et rejoint le cercle des sortis (on ne reste jamais inactif).","r":689,"v":null,"c":null,"s":"cercle"}],"corps":[{"n":"3 touches et poursuite","t":20,"d":"Deux équipes de part et d'autre du filet ; obligation de 3 touches (attraper autorisé au début), la 3e envoie le ballon chez l'adversaire. Quand le ballon tombe, l'équipe qui a marqué poursuit l'autre jusqu'à sa ligne de fond : les joueurs touchés changent d'équipe.","r":682,"v":null,"c":null,"s":"filet"},{"n":"Le filet humain","t":20,"d":"3 groupes : deux équipes jouent au volley (ballon tenu autorisé, 3e contact = renvoi), le 3e groupe forme le filet en se tenant les mains. Si le filet intercepte le ballon, il entre en jeu et l'équipe fautive devient le filet.","r":686,"v":null,"c":null,"s":"filet"},{"n":"Volley par zones numérotées","t":25,"d":"Chaque camp est divisé en 4 zones numérotées (1-2 au fond, 3-4 près du filet). Un ballon qui tombe dans une zone rapporte son numéro de points. Fixer un score exact à atteindre (ex. 21 pile) pour obliger à viser.","r":694,"v":null,"c":"Je renvoie dans une zone choisie et je l'annonce.","s":"filet"}],"mission":"Construire l'attaque en 3 touches"},{"titre":"Jouer ensemble : formes de jeu adaptées","obj":["Coopérer pour faire durer l'échange","Jouer en 4 contre 4 avec 3 touches","S'adapter à une contrainte nouvelle"],"ech":[{"n":"Volley avec baudruches","t":7,"d":"Reprise de l'échauffement de la leçon 1, avec obligation de frapper en passe haute.","r":693,"v":null,"c":null,"s":"filet"},{"n":"Toquinho record","t":8,"d":"Cercles de 4 : battre le record de la leçon 1.","r":688,"v":null,"c":null,"s":"cercle"}],"corps":[{"n":"Volley coopératif à la corde mobile","t":20,"d":"Le filet est remplacé par une corde tenue par deux élèves qui se déplacent. Les deux équipes jouent ensemble : objectif commun d'atteindre 25 échanges sans faire tomber le ballon. Variante : tous doivent toucher le ballon, alternance filles/garçons.","r":692,"v":null,"c":null,"s":"filet"},{"n":"Volley avec soutien extérieur","t":25,"d":"Dans chaque camp, une équipe joue sur le terrain et une autre se place autour : les joueurs de l'extérieur peuvent remettre en jeu un ballon qui sort (cela ne compte pas dans les 3 touches). Quand une équipe perd le point, son groupe extérieur entre sur le terrain.","r":695,"v":null,"c":null,"s":"filet"},{"n":"Volley aveugle","t":20,"d":"Le filet est recouvert d'une bâche ou d'un drap : on ne voit pas l'adversaire et le ballon apparaît par surprise. Échange d'impressions à la fin : quelles informations utilise-t-on pour se placer ?","r":690,"v":null,"c":null,"s":"filet"}],"mission":"Volley-surprise : filet caché et corde mobile"},{"titre":"Évaluation","eval":true,"obj":["Évaluer passe haute, manchette et service","Évaluer le jeu en 3 touches et l'attitude"],"ech":[{"n":"Toquinho","t":8,"d":"Cercles de 4 en passe haute et manchette.","r":688,"v":null,"c":null,"s":"cercle"},{"n":"Jonglage libre","t":7,"d":"Jonglage individuel puis par deux à 3 m.","r":588,"v":null,"c":null,"s":"deux"}],"corps":[{"n":"Épreuve 1 – Jonglage et mur","t":15,"d":"Au mur : enchaîner le plus de passes hautes possible (sur 30 s), puis le plus de manchettes. Un camarade compte.","r":640,"v":null,"c":null,"s":"mur"},{"n":"Épreuve 2 – Service","t":15,"d":"5 services par en dessous depuis 6 m du filet (les plus à l'aise depuis la ligne de fond) vers le camp adverse, puis 3 services dans une zone annoncée.","r":612,"v":null,"c":null,"s":"tir"},{"n":"Épreuve 3 – Match 4 contre 4 observé","t":35,"d":"Matchs de 6 minutes, 3 touches obligatoires (un rebond autorisé pour les élèves en difficulté). Le professeur observe avec la grille.","r":696,"v":null,"c":null,"s":"filet"}],"grille":[["Passe haute et manchette",6,"Se place sous le ballon (2) ; passe haute mains en triangle, même après rattrapage (2) ; manchette bras tendus (2)"],["Service",4,"Geste par en dessous (2) ; services passés sur 5, distance au choix : 1-2 = 1, 3 et + = 2"],["Jeu",4,"Fait au moins une touche utile par échange (2) ; renvoie de l'autre côté (2)"],["Progrès",3,"Compte de jongles au mur comparé à la leçon 1 : amélioration nette = 3, légère = 2, effort = 1"],["Attitude",3,"Encourage et coopère (2) ; respecte les règles et l'adversaire (1)"]],"mission":"Le grand match des records"}],"fun":{"titre":"Opération : ballon en l'air","pitch":"Une seule règle d'or pour toute la classe : le ballon ne doit jamais toucher le sol. On bat des records collectifs à chaque leçon.","badges":["Jongleur : 10 touches d'affilée","Mur de briques : 3 manchettes renvoyées de suite","Canonnier : service qui passe 3 fois sur 5"]},"niveau":{"facile":["Ballons en mousse, ballons de plage ou ballons légers « soft » : la peur du ballon disparaît.","Filet abaissé (ou corde à 2 m) et petits terrains de 4,5 × 4,5 m.","Un rebond au sol autorisé entre chaque touche ; la balle peut être attrapée puis relancée en passe haute (« passe-attrapé »).","Service à la main par en dessous ou lancé, à 4-6 m du filet."],"defi":["Plus de rebond, 3 touches obligatoires.","Service depuis la ligne de fond.","Renvoi dans une zone annoncée."],"idees":["Match « coopératif » avant le match compétitif : les deux équipes comptent ensemble le nombre d'échanges consécutifs.","Jeu du « 1-2-3 » : chaque équipe doit dire le numéro de la touche à voix haute. Ça oblige à construire et ça calme le jeu.","Rotation obligatoire après chaque point gagné : chacun sert à son tour."]}},{"id":"hand","nom":"Handball","icon":"🤾","couleur":"#2f9e6b","intro":"Cycle d'initiation au handball : manipuler, passer et recevoir en mouvement, tirer en appui et en suspension, jouer sans marcher avec le ballon (3 pas, 3 secondes), respecter la zone et défendre. Les livrets proposent beaucoup de jeux pré-sportifs « pour le handball » (tours, cônes, couloirs), qui forment le cœur de ce cycle.","theorie":[858,862],"materiel":"Ballons de handball taille 1 ou balles en mousse, 2 buts (ou cônes/bancs), cônes et bouteilles, cerceaux, chasubles, bancs suédois.","lecons":[{"titre":"Manipuler, passer, recevoir","obj":["Tenir le ballon d'une main","Passer à une main au-dessus de l'épaule","Recevoir en mouvement"],"ech":[{"n":"Attraper la balle (handball)","t":8,"d":"Chacun dribble un ballon de hand ; 2-3 voleurs essaient de le chiper. Celui qui perd devient voleur.","r":675,"v":null,"c":null,"s":"voleurs"},{"n":"Balle de hanche","t":7,"d":"Chacun lance son ballon en l'air et le rattrape. Au signal, il le laisse rebondir, court toucher 3 ballons devant lui et revient avant que son ballon ne s'arrête.","r":644,"v":null,"c":null,"s":"libre"}],"corps":[{"n":"Passe en avançant","t":15,"d":"Par deux, à 2-3 m : l'un avance avec le ballon, l'autre recule ; passe, puis inversion des rôles. Passe à une main.","r":677,"v":null,"c":null,"s":"deux"},{"n":"Passe alternée à trois","t":10,"d":"Groupes de 3 en ligne : passe puis prendre la place du receveur.","r":678,"v":null,"c":null,"s":"trois"},{"n":"Passer et courir","t":15,"d":"Deux équipes en cercle chacune sur son demi-terrain ; un ballon posé sur un cône au centre. Après 10 passes, celui qui a fait la 10e court chercher le ballon du cône. Point à la première équipe.","r":258,"v":null,"c":"10 passes sans chute.","s":"cercle"},{"n":"Bobinho","t":10,"d":"Cercle de 6-8 avec 2 défenseurs au centre ; passes à une main uniquement.","r":72,"v":null,"c":null,"s":"cercle2"},{"n":"Courir plus vite que le ballon","t":15,"d":"Les élèves en rangée à 4 m les uns des autres se passent le ballon jusqu'au dernier pendant qu'un coureur sprinte le long de la rangée. Le coureur arrive-t-il avant le ballon ?","r":478,"v":null,"c":null,"s":"cerclecourse"}],"mission":"Passer en courant sans faire tomber le ballon"},{"titre":"Tirer","obj":["Tirer à une main en appui","Viser un coin ou une cible","Tirer après une course d'élan"],"ech":[{"n":"Courir au centre","t":7,"d":"Deux équipes, ballons au centre ; aller chercher, revenir, rapporter (ballon en main puis en dribble).","r":650,"v":null,"c":null,"s":"centre"},{"n":"Le cerceau volant","t":8,"d":"Le professeur lance un cerceau en l'air (ou le fait rouler) ; les élèves tentent d'y faire passer leur ballon.","r":613,"v":null,"c":null,"s":"libre"}],"corps":[{"n":"Tir sur cible avec saut","t":15,"d":"Course d'élan, saut, tir par-dessus une corde tendue vers des cônes-cibles. Augmenter la distance progressivement. En relais par équipes.","r":498,"v":null,"c":"Je renverse au moins 2 cibles sur 5.","s":"tir"},{"n":"Frappez la tour","t":15,"d":"Grand cercle, un gardien protège un cône au centre. Les joueurs se passent le ballon à la main et tirent quand une ouverture apparaît. Celui qui renverse prend la place du gardien.","r":18,"v":null,"c":null,"s":"tour"},{"n":"Balle à la cible","t":15,"d":"Cercle avec un seau/cône au centre défendu par un élève. On passe pour déséquilibrer le défenseur puis on tire. Celui qui perd le ballon prend la place du défenseur.","r":637,"v":null,"c":null,"s":"tour"},{"n":"Défendre la tour","t":20,"d":"Une équipe dans un grand cercle protège une tour (cône sur une caisse) ; l'autre, autour, passe et tire. Si les défenseurs captent le ballon, ils courent défendre leur propre tour : le jeu bascule.","r":162,"v":null,"c":null,"s":"tour"}],"mission":"Renverser la tour gardée"},{"titre":"Jouer sans marcher : les 3 secondes","obj":["Passer vite (ballon gardé 3 secondes maximum)","Se démarquer quand on n'a pas le ballon","Intercepter sans arracher le ballon des mains"],"ech":[{"n":"Pegobol","t":8,"d":"Chats avec ballon : ils doivent se passer le ballon pour toucher un fuyard, le porteur ne peut pas courir.","r":274,"v":null,"c":null,"s":"chat"},{"n":"Va rapidement","t":7,"d":"Cercles de 4, passes simultanées à une main.","r":549,"v":null,"c":null,"s":"cercle"}],"corps":[{"n":"Brûler le cône","t":25,"d":"2 contre 2 puis 3 contre 3. Chaque équipe défend un cône entouré de 2 cerceaux vides ; pour tirer sur le cône adverse, il faut être dans un de ses cerceaux. Le porteur ne bouge pas et garde le ballon 3 secondes maximum ; interdit d'arracher le ballon.","r":329,"v":null,"c":"Je ne marche pas avec le ballon.","s":"match"},{"n":"Jeu des 10 passes","t":20,"d":"Deux équipes ; 10 passes comptées à voix haute = 1 point. Porteur immobile, 3 secondes maximum.","r":663,"v":null,"c":null,"s":"match"},{"n":"Quatre cerceaux","t":20,"d":"Par deux (ou 2 contre 2) autour de 4 cerceaux au sol : lancer le ballon en rebond dans un cerceau pour rendre la réception difficile ; l'adversaire attrape et renvoie aussitôt. Chaque balle ratée = un point pour l'autre.","r":335,"v":null,"c":null,"s":"deux"}],"mission":"Le jeu des 10 passes sans marcher"},{"titre":"Attaquer, défendre et respecter la zone","obj":["Respecter la zone du gardien","Défendre en s'interposant entre l'attaquant et le but","Tirer depuis l'extérieur de la zone"],"ech":[{"n":"Couloir de survie (à la main)","t":8,"d":"Un coureur traverse le terrain en dribble pendant que les autres, sur les côtés, essaient de toucher son ballon avec des passes et tirs. Touché = nouveau coureur.","r":529,"v":null,"c":null,"s":"couloir"},{"n":"Passe alternée","t":7,"d":"Groupes de 3, passe à une main puis passe à rebond.","r":678,"v":null,"c":null,"s":"trois"}],"corps":[{"n":"Brûlez le couloir","t":20,"d":"Une équipe en colonne : le premier lance le ballon au loin puis court renverser les cônes dispersés ; l'équipe adverse récupère le ballon et doit le toucher par des passes (interdit de marcher ballon en main) avant qu'il ait fini. On compte les coureurs réussis puis on inverse.","r":330,"v":null,"c":null,"s":"files"},{"n":"Balle-espion","t":20,"d":"Deux équipes sur un terrain de volley ; réussir une passe à son « espion » placé derrière la ligne de fond adverse. Le passeur le rejoint. Défendre = s'interposer sans contact.","r":639,"v":null,"c":null,"s":"match"},{"n":"But de handball sur bancs","t":25,"d":"Deux équipes ; un banc à chaque bout avec cônes ou canettes dessus. Un point par cône renversé au tir. La défense respecte la zone de handball ; imposer un nombre de passes par des joueurs différents avant de tirer.","r":668,"v":null,"c":"Je tire hors de la zone.","s":"match"}],"mission":"Attaquer le but sur bancs"},{"titre":"Jeux de variantes et match","obj":["Adapter son jeu à des règles qui changent","Jouer un match avec gardien","Appliquer les règles de base"],"ech":[{"n":"Attraper la balle","t":7,"d":"Dribble à une main en fuyant les voleurs.","r":675,"v":null,"c":null,"s":"voleurs"},{"n":"Passer et courir","t":8,"d":"Deux cercles d'équipe, 10 passes puis course au ballon central.","r":258,"v":null,"c":null,"s":"cercle"}],"corps":[{"n":"Quicabol","t":15,"d":"Sur un petit terrain (10 m × 3 m) coupé par un filet bas, en 1c1 ou 2c2 : lancer le ballon pour qu'il rebondisse dans le camp adverse ; l'adversaire doit l'attraper avant le 2e rebond et renvoyer aussitôt. Travaille la précision du tir et la réception.","r":547,"v":null,"c":null,"s":"filet"},{"n":"Hand-fut","t":20,"d":"Match de handball classique (passes et dribbles à la main) mais le but ne peut être marqué que du pied ou de la tête. Un gardien par équipe.","r":669,"v":null,"c":null,"s":"match"},{"n":"Match de handball","t":30,"d":"Matchs de 6 minutes 5c5 (4 + gardien) sur demi-terrain ou terrain réduit. Rappel des règles : 3 pas, 3 secondes, pas de contact, zone interdite. Les équipes au repos arbitrent.","r":668,"v":null,"c":null,"s":"match"}],"mission":"Le vrai match de hand"},{"titre":"Évaluation","eval":true,"obj":["Évaluer passe-réception, tir et jeu collectif","Évaluer le respect des règles"],"ech":[{"n":"Va rapidement","t":7,"d":"Cercles de 4, passes simultanées.","r":549,"v":null,"c":null,"s":"cercle"},{"n":"Passe en avançant","t":8,"d":"Par deux, passes en déplacement sur la longueur du terrain.","r":677,"v":null,"c":null,"s":"deux"}],"corps":[{"n":"Épreuve 1 – Passes en mouvement","t":15,"d":"Par deux sur 20 m aller-retour : nombre de passes réussies sans chute ni marcher ; deux essais.","r":677,"v":null,"c":null,"s":"deux"},{"n":"Épreuve 2 – Tir","t":15,"d":"5 tirs après course d'élan vers des cibles placées dans le but (cônes, cerceaux suspendus), hors zone.","r":498,"v":null,"c":null,"s":"tir"},{"n":"Épreuve 3 – Match observé","t":35,"d":"Matchs 5c5 de 6 minutes ; le professeur observe avec la grille.","r":668,"v":null,"c":null,"s":"match"}],"grille":[["Passe et réception",6,"Passe à une main arrivant au partenaire (2) ; attrape à deux mains (2) ; passes réussies sur l'épreuve : moins de 5 = 1, 5 et + = 2"],["Tir",4,"Bras armé au-dessus de l'épaule (2) ; cibles touchées : 1 = 1, 2 et + = 2"],["Jeu collectif",4,"Se démarque pour recevoir (2) ; passe vite au lieu de garder le ballon (2)"],["Progrès",3,"Comparaison avec la leçon 1 (passes ou tirs) : nette = 3, légère = 2, effort = 1"],["Règles et attitude",3,"Respecte la zone et les contacts (2) ; fair-play (1)"]],"mission":"Le siège final"}],"fun":{"titre":"Les gardiens de la tour","pitch":"Chaque équipe protège sa tour et attaque celle des autres. Une tour renversée = une pierre gagnée. Qui bâtira le plus grand château ?","badges":["Main de velours : 10 passes sans chute","Bras de catapulte : 2 cibles sur 5","Mur vivant : défendre sans toucher l'adversaire"]},"niveau":{"facile":["Ballons en mousse ou taille 1 : plus faciles à tenir d'une main et moins douloureux à la réception.","Règle des 3 pas assouplie au début (on tolère 4 ou 5 pas) ; on l'applique strictement à partir de la leçon 4.","Buts réduits avec cibles (cerceaux, cônes) et pas de gardien en leçons 1 à 3, ou gardien à genoux.","Défense « sans contact » : on gêne en se plaçant, jamais en touchant le joueur."],"defi":["3 pas et zone strictement arbitrés.","Tir en suspension.","Défense en zone à 2 lignes."],"idees":["Joker « passe obligatoire » : avant de tirer, au moins 3 joueurs différents touchent le ballon.","Les gardiens changent à chaque but encaissé : tout le monde essaie, personne n'y reste longtemps.","Fiche d'observation simple pour les élèves au repos : cocher qui reçoit des passes. On voit vite qui est oublié."]}},{"id":"foot","nom":"Football / Futsal","icon":"⚽","couleur":"#5a8f2f","intro":"Cycle de football en salle (futsal) : conduite de balle, passe et contrôle, frappe, occupation de l'espace puis jeu avec gardien et règles. Les situations viennent des quatre livrets ; les règles et les exercices de conduite viennent des fiches théoriques « Futsal » du livret « EP à la maison ».","theorie":[871,872,873],"materiel":"1 ballon de futsal (ou ballon mousse) par élève, petits buts ou cônes, bouteilles en plastique, chasubles, bancs, cerceaux.","lecons":[{"titre":"Conduire le ballon","obj":["Conduire avec l'intérieur, l'extérieur et la semelle","Lever la tête pendant la conduite","Protéger le ballon"],"ech":[{"n":"Voleurs de ballons (aux pieds)","t":8,"d":"Chacun conduit un ballon au pied ; 2-3 voleurs essaient de le prendre. Celui qui perd son ballon devient voleur.","r":675,"v":null,"c":null,"s":"voleurs"},{"n":"Courir au centre (au pied)","t":7,"d":"Deux équipes ; aller chercher un ballon au centre et le ramener en conduite à sa ligne puis le rapporter.","r":650,"v":null,"c":null,"s":"centre"}],"corps":[{"n":"Ateliers de conduite","t":15,"d":"Conduite à la semelle, zigzag en alternant les deux pieds, slalom entre obstacles le plus vite possible, contrôle à la semelle à l'arrêt (pied droit puis gauche).","r":873,"v":null,"c":"Je fais le slalom sans toucher de cône.","s":"slalom"},{"n":"Traverser la rue (au pied)","t":10,"d":"4 groupes aux 4 coins ; traverser vers le coin opposé ballon au pied sans contact.","r":633,"v":null,"c":null,"s":"coins"},{"n":"Couloir de survie","t":15,"d":"Un coureur conduit un ballon d'un bout à l'autre du terrain ; les autres, sur les lignes de côté, frappent des ballons pour toucher le sien. Touché = on change de coureur.","r":529,"v":null,"c":null,"s":"couloir"},{"n":"Vole si tu peux","t":10,"d":"Plusieurs ballons au centre, moins que d'élèves. Au signal, chacun essaie d'en prendre un et de le conduire ; ceux qui n'en ont pas peuvent en voler un (dans le terrain uniquement).","r":343,"v":null,"c":null,"s":"libre"},{"n":"Vous ne passerez pas (au pied)","t":15,"d":"Les élèves traversent le terrain ballon au pied ; un défenseur au centre essaie de toucher ou de prendre un ballon. Celui qui perd devient défenseur.","r":236,"v":null,"c":null,"s":"traverser"}],"mission":"Conduire le ballon sans se le faire voler"},{"titre":"Passer et contrôler","obj":["Passer avec l'intérieur du pied","Contrôler à la semelle ou intérieur","Jouer en une ou deux touches"],"ech":[{"n":"Formation de groupes (au pied)","t":7,"d":"Conduite libre ; au signal « 3 ! », former un trio et se faire 5 passes avant de repartir.","r":660,"v":null,"c":null,"s":"libre"},{"n":"Toquinho football","t":8,"d":"Cercles de 5 : passes au pied ; une seule touche pour les plus avancés ; on compte le record.","r":688,"v":null,"c":null,"s":"cercle"}],"corps":[{"n":"Bowling avec les pieds","t":10,"d":"Face à des bouteilles regroupées, les renverser en passe intérieur du pied, puis extérieur, puis pied faible.","r":647,"v":null,"c":null,"s":"tir"},{"n":"Balle au mur (passes basses)","t":20,"d":"Deux équipes séparées par la ligne médiane ; on marque en frappant le ballon contre le mur adverse, uniquement avec des passes basses de l'intérieur du pied. Ajouter des ballons et une bouteille au fond de chaque camp (10 points).","r":641,"v":null,"c":null,"s":"mur"},{"n":"Bobinho au pied","t":15,"d":"Cercle de 6-8, 2 défenseurs au centre ; passes au pied. Celui qui se fait prendre le ballon va au centre.","r":72,"v":null,"c":null,"s":"cercle2"},{"n":"Match à passes obligatoires","t":20,"d":"Match de futsal normal mais un but ne compte qu'après un nombre de passes fixé par le professeur (3 à 5).","r":664,"v":null,"c":"Mon équipe marque après au moins 3 passes.","s":"match"}],"mission":"Toquinho : record de passes du cercle"},{"titre":"Frapper et tirer","obj":["Frapper du coup de pied (lacets)","Viser une cible","Tirer en première intention"],"ech":[{"n":"Chat au ballon","t":7,"d":"Le chat conduit un ballon et touche les fuyards en frappant bas dans leurs jambes. Les touchés deviennent chats avec un ballon.","r":681,"v":null,"c":null,"s":"chat"},{"n":"Appel des numéros","t":8,"d":"Deux équipes dos à dos au centre, chaque élève a un numéro ; un ballon à chaque point de penalty. Au numéro appelé, les deux élèves courent frapper au but. Point au premier arrivé et au buteur.","r":136,"v":null,"c":null,"s":"centre"}],"corps":[{"n":"Frappe sur cible","t":10,"d":"Un ballon de basket posé sur un cône ; le faire tomber en frappant du cou-de-pied, pied droit puis gauche, à distance croissante.","r":501,"v":null,"c":null,"s":"tir"},{"n":"Défi précision à 360°","t":15,"d":"Des cônes en cercle autour d'un joueur placé au centre avec quelques ballons ; il frappe un ballon vers chaque cône. On compte les cônes touchés.","r":604,"v":null,"c":null,"s":"tir"},{"n":"Artilleur","t":20,"d":"Par deux : un gardien et un buteur, de part et d'autre du terrain. Le gardien lance au buteur qui doit marquer du premier coup ; l'adversaire peut gêner le lancer sans les mains. On change les rôles quand on marque.","r":630,"v":null,"c":null,"s":"tir"},{"n":"Conebol sans gardien","t":20,"d":"Match sans gardien : des bouteilles/cônes sur la ligne de but ; un but = une bouteille renversée. Personne n'entre dans la zone : on tire de l'extérieur.","r":652,"v":null,"c":"Je tire de loin et je vise.","s":"match"}],"mission":"Viser juste : faire tomber la cible"},{"titre":"Occuper l'espace","obj":["Rester à son poste (défense, attaque)","Utiliser la largeur du terrain","Passer à un partenaire mieux placé"],"ech":[{"n":"Chasseurs au pied","t":8,"d":"Deux chasseurs aux extrémités frappent bas pour toucher les élèves au centre ; les touchés deviennent chasseurs.","r":648,"v":null,"c":null,"s":"couloir"},{"n":"Passe alternée au pied","t":7,"d":"Groupes de 3 en ligne : passe puis prendre la place.","r":678,"v":null,"c":null,"s":"trois"}],"corps":[{"n":"Attaque contre défense","t":20,"d":"Le terrain et les équipes sont coupés en deux : les défenseurs ne dépassent pas la ligne médiane, les attaquants ne reviennent pas. Rotation des rôles et du gardien.","r":631,"v":null,"c":null,"s":"match"},{"n":"Jeu par secteurs","t":25,"d":"Chaque demi-terrain est divisé en 4 carrés avec un joueur de chaque équipe par carré (8c8 + 2 gardiens). On ne sort pas de son carré : on dribble son adversaire direct et on passe à un partenaire mieux placé.","r":662,"v":"Avec moins d'élèves : 2 secteurs par demi-terrain.","c":null,"s":"match"},{"n":"Cône roi","t":20,"d":"Équipes de 2-3. Chaque équipe aligne 2-3 cônes au fond de son demi-terrain et cache une balle sous l'un (le cône roi). On frappe pour faire tomber le cône roi adverse ; interdit de franchir la ligne médiane ou d'entrer dans le cercle des cônes. Main = tir direct.","r":542,"v":null,"c":null,"s":"match"}],"mission":"Attaque contre défense"},{"titre":"Le gardien, les règles et le match","obj":["Connaître les règles du futsal (fautes, 4 secondes, coups francs, cartons)","Jouer avec un gardien","Arbitrer"],"ech":[{"n":"Ballon et cône","t":7,"d":"Chacun lance son ballon au sol, puis court le rattraper en conduite et le stopper semelle ; variante : frapper légèrement puis le rattraper avec l'autre pied.","r":515,"v":null,"c":null,"s":"libre"},{"n":"Bobinho au pied","t":8,"d":"Cercles de 6 avec 2 défenseurs.","r":72,"v":null,"c":null,"s":"cercle2"}],"corps":[{"n":"Les règles du futsal","t":10,"d":"Présentation courte : fautes techniques (coup franc direct) et personnelles (indirect), règle des 4 secondes, gardien et zone, jet franc des 10 m à la 6e faute, cartons jaune/rouge. Les élèves rejouent chaque situation.","r":872,"v":null,"c":null,"s":"explication"},{"n":"Conebol avec gardien","t":25,"d":"Futsal où le but est un cône entouré de 2 zones : une petite où personne n'entre, une grande réservée au gardien. Faire tomber le cône = but. Infraction de zone = ballon au gardien adverse.","r":651,"v":null,"c":null,"s":"match"},{"n":"Match de futsal arbitré","t":30,"d":"Matchs de 6 minutes ; l'équipe au repos arbitre et compte les fautes. Passes obligatoires si un joueur garde trop le ballon.","r":664,"v":null,"c":null,"s":"match"}],"mission":"Le match arbitré par les élèves"},{"titre":"Évaluation","eval":true,"obj":["Évaluer conduite, passe et frappe","Évaluer le jeu et les règles"],"ech":[{"n":"Voleurs de ballons (aux pieds)","t":8,"d":"Conduite en fuyant les voleurs.","r":675,"v":null,"c":null,"s":"voleurs"},{"n":"Toquinho football","t":7,"d":"Cercles de passes au pied.","r":688,"v":null,"c":null,"s":"cercle"}],"corps":[{"n":"Épreuve 1 – Parcours de conduite","t":20,"d":"Slalom chronométré entre 6 cônes, contrôle semelle, passe dans un mini-but (2 cônes à 1 m) à 6 m. 2 essais.","r":873,"v":null,"c":null,"s":"slalom"},{"n":"Épreuve 2 – Frappe","t":15,"d":"5 frappes du cou-de-pied vers des cibles (bouteilles, cônes) depuis 8-10 m.","r":499,"v":null,"c":null,"s":"tir"},{"n":"Épreuve 3 – Match observé","t":30,"d":"Matchs de 6 minutes avec gardien ; le professeur observe avec la grille.","r":651,"v":null,"c":null,"s":"match"}],"grille":[["Conduite",5,"Ballon près du pied (2) ; termine le parcours sans perdre le ballon plus de 2 fois (2) ; passe finale tentée (1)"],["Frappe",4,"Pied d'appui à côté du ballon (2) ; cibles atteintes : 1 = 1, 2 et + = 2"],["Jeu collectif",5,"Passe à un partenaire (2) ; se déplace dans l'espace libre (2) ; défend en se plaçant (1)"],["Progrès",3,"Parcours comparé à la leçon 1 : net = 3, léger = 2, effort = 1"],["Règles et attitude",3,"Respecte les règles et l'adversaire (2) ; arbitre un match (1)"]],"mission":"La finale de la coupe"}],"fun":{"titre":"La coupe du monde de la classe","pitch":"Chaque équipe choisit un pays et un cri de guerre. Les points gagnés pendant les leçons comptent pour la phase de groupes ; la leçon 6 est la finale.","badges":["Collé au pied : slalom sans toucher de cône","Passe décisive : une passe qui amène un but","Canonnier : faire tomber 2 cibles sur 5"]},"niveau":{"facile":["Ballons légèrement dégonflés ou en mousse : ils roulent moins vite et se contrôlent mieux.","Terrains réduits, mini-buts larges (3 m) sans gardien en leçons 1 et 2.","Règle « pas de tacle, pas de jeu aérien » : le ballon reste au sol, plus sûr pour les élèves timides.","Zone protégée de 2 m autour d'un joueur qui contrôle le ballon (on attend qu'il joue)."],"defi":["Deux touches maximum.","Conduite pied faible.","Gardien actif et but plus petit."],"idees":["Équipes mixtes et règle « un but d'une fille ou d'un élève qui n'a pas encore marqué vaut double ».","Les « experts » (élèves en club) jouent avec le pied faible ou servent de passeurs neutres.","Défi du jour au tableau (ex. 10 passes de suite à deux) à réussir pendant l'échauffement."]}},{"id":"athle","nom":"Athlétisme","icon":"🏃","couleur":"#c94a8a","intro":"Cycle d'athlétisme en trois familles : courir (vitesse, réaction, relais, haies), sauter (longueur, triple saut, hauteur) et lancer (poids, disque, javelot, lancer à genoux). Le Tome 02 propose une série complète de fiches « athlétisme » avec matériel improvisé (sac de sable pour le poids, cerceau pour le disque, bâton ou frite pour le javelot).","theorie":[863,859],"materiel":"Cônes, plots et lattes ou bâtons pour haies basses, cordes, cerceaux, sacs de sable ou ballons lestés (1 à 2 kg), ballons de médecine légers, frites en mousse ou vortex, journaux, chronomètres, décamètre, tapis de réception.","lecons":[{"titre":"Vitesse et réaction","obj":["Réagir vite à un signal","Démarrer en position basse","Courir en ligne droite à vitesse maximale"],"ech":[{"n":"Course mille-pattes","t":7,"d":"En relais : le premier fait l'aller-retour, puis prend la main du deuxième, puis du troisième… jusqu'à ce que toute l'équipe court main dans la main. On recommence en inversant l'ordre.","r":106,"v":null,"c":null,"s":"files"},{"n":"Courir dans le cône","t":8,"d":"Par deux, face à face, un cône entre eux. Le professeur annonce « assis, saute, pas à droite, demi-tour… » puis « COURS ! » : le premier qui attrape le cône gagne le point.","r":110,"v":null,"c":null,"s":"duel"}],"corps":[{"n":"Courir plus vite que le ballon","t":15,"d":"Un élève fait rouler un gros ballon sur la piste ; les coureurs partent en même temps et doivent arriver avant le ballon. Augmenter la force du lancer progressivement.","r":478,"v":null,"c":"J'arrive avant le ballon 3 fois sur 4.","s":"course"},{"n":"Course aux journaux","t":15,"d":"Courir vite avec une feuille de journal posée sur la poitrine : elle ne tient que si l'on court assez vite. En relais par équipes.","r":430,"v":null,"c":null,"s":"course"},{"n":"Touche et cours","t":10,"d":"Par deux face à face : le fuyard frappe les mains du chasseur puis sprinte vers une ligne à 10 m ; le chasseur réagit et essaie de le toucher avant la ligne. On alterne.","r":76,"v":null,"c":null,"s":"course"},{"n":"Parcours des couleurs","t":15,"d":"Un grand cercle de cônes de couleur. Le professeur annonce une ou plusieurs couleurs ; le coureur y sprinte dans l'ordre. En duel sur deux circuits identiques.","r":489,"v":null,"c":null,"s":"cerceaux"},{"n":"Course aux cerceaux","t":10,"d":"Sprint vers une ligne de cerceaux (un par coureur) ; on retire un cerceau à chaque manche : celui qui n'en trouve pas fait 10 sauts et revient au tour suivant.","r":123,"v":null,"c":null,"s":"cerceaux"}],"mission":"Réagir plus vite que le ballon"},{"titre":"Les relais","obj":["Respecter la zone et le moment du départ","Transmettre un objet sans s'arrêter","Coopérer dans son équipe"],"ech":[{"n":"Je veux mon cône","t":8,"d":"Cônes en cercle ; on court autour et au sifflet chacun saisit un cône. Celui qui n'en a pas fait une tâche (5 squats) puis revient.","r":316,"v":null,"c":null,"s":"cercle"},{"n":"Zigzag entre bâtons","t":7,"d":"Relais en zigzag entre des bâtons couchés au sol, puis en posant un pied dans chaque espace.","r":485,"v":null,"c":null,"s":"slalom"}],"corps":[{"n":"Course collective (relais)","t":15,"d":"Équipes en colonne derrière une ligne : chacun court jusqu'à la ligne d'arrivée ; le suivant ne part que lorsque le précédent la touche. Départ anticipé = on recommence sa course.","r":94,"v":null,"c":"Je pars au bon moment, sans anticiper.","s":"files"},{"n":"Course contre le ballon (en cercle)","t":10,"d":"Le ballon fait le tour du cercle de main en main pendant qu'un coureur fait le tour extérieur.","r":478,"v":null,"c":null,"s":"cerclecourse"},{"n":"Relais déménageur","t":15,"d":"Devant chaque colonne, des cônes à 1-2 m d'intervalle et 5 objets : on déplace les objets un par un jusqu'au premier cône, puis au deuxième… jusqu'au bout.","r":143,"v":null,"c":null,"s":"files"},{"n":"Cube magique en relais","t":15,"d":"Relais où chaque coureur, à l'autre bout, ne peut échanger que deux pièces de couleur d'une grille pour reproduire le modèle. Course + réflexion.","r":84,"v":null,"c":null,"s":"files"},{"n":"Relais d'exercices","t":10,"d":"Tous en position de pompe en colonne ; le dernier court se placer devant et se met en position ; le suivant part, etc.","r":180,"v":null,"c":null,"s":"files"}],"mission":"Le relais des déménageurs"},{"titre":"Haies et sauts en longueur","obj":["Franchir des obstacles bas sans ralentir","Prendre son impulsion sur un pied","Enchaîner trois bonds"],"ech":[{"n":"Regarde la vague","t":8,"d":"Le professeur fait rouler un cerceau (ou glisser une coupelle) vers la ligne d'élèves qui doivent sauter par-dessus.","r":423,"v":null,"c":null,"s":"saut"},{"n":"Saute à droite","t":7,"d":"Une corde au sol ; le professeur annonce un nombre (ou un calcul) et tous font ce nombre de sauts latéraux en rythme, en terminant du bon côté.","r":418,"v":null,"c":null,"s":"saut"}],"corps":[{"n":"Course de haies basses","t":20,"d":"Départ « à vos marques, prêts, partez » en position basse ; franchir 4 à 6 haies basses (cônes + lattes, bouteilles) sur 20-30 m. Ajuster la hauteur à chacun.","r":467,"v":null,"c":"Je franchis toutes les haies sans m'arrêter.","s":"haies"},{"n":"Sauter la rivière","t":20,"d":"Deux cordes forment une rivière que l'on franchit après élan ; on écarte progressivement les cordes pour trouver sa distance maximale. Réception sur tapis ou sable.","r":422,"v":null,"c":null,"s":"saut"},{"n":"Trois sauts (triple bond)","t":25,"d":"Trois bonds pieds joints enchaînés depuis une ligne ; puis trois appuis alternés (D-G-D ou G-D-G) ; puis avec quelques pas d'élan. On mesure le total.","r":466,"v":null,"c":null,"s":"saut"}],"mission":"Franchir la rivière et les haies"},{"titre":"Saut en hauteur et lancer du poids","obj":["Franchir une corde en ciseau","Pousser un engin depuis l'épaule","Respecter les règles de sécurité des lancers"],"ech":[{"n":"Chat saute-mouton","t":8,"d":"Les élèves touchés s'accroupissent tête rentrée ; un camarade les délivre en sautant par-dessus (mains sur le dos).","r":278,"v":null,"c":null,"s":"chat"},{"n":"Regarde la vague","t":7,"d":"Sauts au-dessus de cerceaux qui roulent, puis par-dessus une corde agitée au ras du sol.","r":423,"v":null,"c":null,"s":"saut"}],"corps":[{"n":"Marée haute","t":20,"d":"Une corde lâche tenue par deux élèves ; on la franchit en ciseau. À chaque tour réussi par tous, « MARÉE HAUTE ! » : on monte la corde. Variante : sauter par-dessus à l'aller, passer dessous au retour.","r":427,"v":null,"c":"Je franchis la corde à hauteur de mes genoux.","s":"saut"},{"n":"Lancer à genoux","t":15,"d":"À genoux sur un tapis, ballon tenu à deux mains derrière la tête (comme une touche) : lancer le plus loin possible en basculant sur le tapis devant. 3 essais, on garde le meilleur.","r":463,"v":null,"c":null,"s":"lancer"},{"n":"Lancer du poids","t":30,"d":"Engin improvisé (sac de sable de 1-2 kg scotché). Poids calé entre cou et épaule, lancer en poussée (jamais en lançant du bras) depuis un cercle de 2 m sans en sortir. Mesurer chaque jet. Zone de chute dégagée, on ramasse tous ensemble au signal.","r":459,"v":null,"c":null,"s":"lancer"}],"mission":"Marée haute : jusqu'où peux-tu sauter ?"},{"titre":"Lancer du disque et du javelot","obj":["Lancer en rotation","Lancer en ligne avec élan","Mesurer et noter ses performances"],"ech":[{"n":"Courir dans le cône","t":7,"d":"Duels de réaction en paires.","r":110,"v":null,"c":null,"s":"duel"},{"n":"Lancer en rotation sur cible","t":8,"d":"Dos aux cibles (seaux, pneus), faire un demi-tour puis lancer une petite balle vers la cible ; puis un tour, puis un tour et demi.","r":464,"v":null,"c":null,"s":"tir"}],"corps":[{"n":"Lancer du disque","t":25,"d":"Initiation avec un cerceau ou un frisbee : lancer depuis un cercle vers des cibles à distances croissantes, puis le plus loin possible. Corps de profil, bras long, rotation des hanches.","r":460,"v":null,"c":"Mon disque atterrit dans le secteur 3 fois sur 3.","s":"lancer"},{"n":"Lancer du javelot","t":25,"d":"Avec un bâton léger, une frite en mousse ou un vortex : d'abord viser des cerceaux posés à différentes distances, puis lancer le plus loin possible après 3 pas d'élan, au-dessus de l'épaule, sans franchir la ligne.","r":461,"v":null,"c":null,"s":"lancer"},{"n":"Course guidée","t":15,"d":"Par deux reliés par une corde : un coureur les yeux bandés et son guide. Marche, puis petite course sur une ligne droite dégagée. On échange les rôles. Discussion sur la confiance.","r":465,"v":null,"c":null,"s":"guide"}],"mission":"Lancer comme les dieux grecs : disque et javelot"},{"titre":"Évaluation : triathlon","eval":true,"obj":["Évaluer une course, un saut et un lancer","Évaluer les progrès depuis le début du cycle"],"ech":[{"n":"Course mille-pattes","t":7,"d":"Relais de mise en train.","r":106,"v":null,"c":null,"s":"files"},{"n":"Gammes","t":8,"d":"Montées de genoux, talons-fesses, sauts sur un pied, puis 2 accélérations.","r":859,"v":null,"c":null,"s":"course"}],"corps":[{"n":"Épreuve 1 – Sprint ou haies","t":20,"d":"Chacun choisit : 30 m plat ou 30 m haies basses. 2 essais chronométrés par des camarades.","r":467,"v":null,"c":null,"s":"haies"},{"n":"Épreuve 2 – Triple bond","t":20,"d":"3 essais de triple bond (élan court) mesurés.","r":466,"v":null,"c":null,"s":"saut"},{"n":"Épreuve 3 – Lancer au choix","t":25,"d":"Poids (sac de sable), disque (cerceau/frisbee) ou javelot (frite) : 3 essais mesurés, on garde le meilleur.","r":459,"v":null,"c":null,"s":"lancer"}],"grille":[["Course",5,"Départ au signal sans anticiper (1) ; court droit dans son couloir (1) ; progrès sur le temps de la leçon 1 : net = 3, léger = 2, égal = 1"],["Saut",5,"Enchaîne les bonds sans s'arrêter (2) ; progrès sur la leçon 2 : net = 3, léger = 2, égal = 1"],["Lancer",5,"Respecte la zone et la technique simple (2) ; progrès : net = 3, léger = 2, égal = 1"],["Sécurité et rôles",5,"Respecte les consignes des lancers (2) ; chronomètre ou mesure correctement (2) ; encourage (1)"]],"mission":"La cérémonie des records"}],"fun":{"titre":"Les Jeux olympiques de la classe","pitch":"Chaque élève a un carnet d'athlète : on note ses records à chaque leçon et on cherche à se battre soi-même. Médailles de bronze, d'argent et d'or à la clé.","badges":["Fusée : battre son record de 30 m","Kangourou : battre son record de sauts","Hercule : battre son record de lancer"]},"niveau":{"facile":["Distances courtes (20-30 m) et haies très basses : lattes, frites posées sur des cônes, cordes au sol.","Barème de la classe calculé sur ses propres résultats en leçon 1 : chacun est noté sur son progrès, pas sur un barème national.","Lancers avec engins légers : sac de sable 500 g, frite (javelot), anneau/frisbee (disque).","Triple bond remplacé par « 3 bonds au choix » (pied gauche, pied droit) avec marques au sol."],"defi":["Départ en position basse au coup de sifflet.","Haies plus hautes ou plus rapprochées.","Élan plus long au saut."],"idees":["Carnet de performance individuel (une demi-feuille) rempli à chaque leçon : les élèves voient leur courbe de progrès.","Format « décathlon de classe » : chaque épreuve rapporte des points d'équipe, ce qui donne un rôle à tous.","Les élèves dispensés deviennent chronométreurs, juges de lancer ou secrétaires."]}},{"id":"raquette","nom":"Sports de raquette","icon":"🏓","couleur":"#8a5ad1","intro":"Cycle commun tennis de table / mini-tennis / badminton : apprivoiser la raquette, échanger, diriger la balle, servir et jouer en match. Les livrets proposent beaucoup d'éducatifs au sol (tennis au sol, jeu du cercle, ping-cup) qui permettent de faire jouer toute la classe sans tables. Les règles du tennis et du badminton se trouvent dans la partie théorique du livret « EP à la maison ».","theorie":[861,872,854],"materiel":"1 raquette (tennis de table, badminton ou raquette de plage) par élève, balles de tennis de table, balles de tennis/mousse, volants, cerceaux, coupelles, gobelets, ruban adhésif pour tracer des « tables » au sol, bancs ou cordes pour les ar joueur ; interdiction de viser trois fois de suite le même joueur.","r":486,"v":null,"c":null,"s":"quatre"},{"n":"Progression tennis de table","t":25,"d":"1) lancer la balle pour qu'elle rebondisse sur la table/le sol et tombe dans un plateau ; 2) même chose au service avec la raquette ; 3) recevoir la balle lancée en l'attrapant avec un gobelet ; 4) recevoir à la raquette ; 5) mini-match.","r":854,"v":null,"c":null,"s":"raquettes"}],"mission":"Le jeu des 4 carrés"},{"titre":"Servir et compter les points","obj":["Servir de façon réglementaire","Connaître le comptage tennis (15-30-40-jeu) et badminton (21 points)","Jouer contre un mur"],"ech":[{"n":"Frescobol","t":8,"d":"Échanges sans rebond, records par paire.","r":448,"v":null,"c":null,"s":"deux"},{"n":"Équilibre sur la raquette","t":7,"d":"Jongles haut-bas, changement de face de raquette.","r":710,"v":null,"c":null,"s":"libre"}],"corps":[{"n":"Les règles","t":10,"d":"Tennis : simple/double, rebond dans le terrain, 15-30-40-jeu, set en 6 jeux. Badminton : 21 points, service sous la taille en diagonale, côté droit si score pair. Les élèves recopient ou miment.","r":861,"v":null,"c":null,"s":"explication"},{"n":"Service en tennis de table","t":15,"d":"Étapes 1 et 2 de la progression : faire rebondir dans son camp puis chez l'adversaire et viser un plateau d'œufs ou un gobelet.","r":854,"v":null,"c":null,"s":"raquettes"},{"n":"Racketball / jeu au mur","t":20,"d":"Une corde tendue entre deux chaises ou un mur avec trois lignes (inspiré du squash) : frapper la balle (ou une baudruche au début) pour la renvoyer ; point quand l'autre ne renvoie pas.","r":779,"v":null,"c":null,"s":"mur"},{"n":"Mini-match au comptage tennis","t":20,"d":"Tennis au sol en 1c1 : servir, compter 15-30-40-jeu. On tourne d'adversaire après chaque jeu.","r":592,"v":null,"c":null,"s":"raquettes"}],"mission":"Compter comme au tennis : 15, 30, 40, jeu !"},{"titre":"Jeux collectifs à raquette et tournoi","obj":["Jouer en double","Coopérer avec son

,"Service qui part vers le camp adverse (2) ; services réussis sur 5 : 1-2 = 1, 3 et + = 2"],["Jeu",5,"Fait durer l'échange (2) ; renvoie de l'autre côté (2) ; se replace au centre (1)"],["Progrès",3,"Échanges à deux comparés à la leçon 1 : net = 3, léger = 2, effort = 1"],["Règles et attitude",3,"Compte correctement les points (2) ; respecte l'adversaire et le matériel (1)"]],"mission":"Le tournoi final"}],"fun":{"titre":"Le tournoi des raquettes d'or","pitch":"Les tables et terrains sont numérotés : on gagne, on monte ; on perd, on descend. Le but est d'atteindre la table d'or avant la fin du cycle.","badges":["Équilibriste : traverser la salle balle sur la raquette","Métronome : échange de 10 frappes","Œil de lynx : toucher la coupelle 2 fois"]},"niveau":{"facile":["Ballons de baudruche ou balles en mousse avant la balle réelle : elles vont lentement.","Raquettes à main (raquettes de plage, assiettes en carton) ou prise courte sur le manche.","Coopération avant compétition : on compte les échanges à deux avant de compter les points.","Service à la main (lancer la balle) autorisé pour les élèves en difficulté."],"defi":["Jeu en zone réduite ou sur un seul côté.","Service réglementaire uniquement.","Viser des cibles au sol."],"idees":["Montée-descente : les tables ou terrains sont numérotés ; le gagnant monte, le perdant descend. Chacun finit par jouer contre quelqu'un de son niveau.","Matchs en 3 minutes au lieu de 11 points : tout le monde change souvent d'adversaire.","Défi « record de la classe » d'échanges à deux, affiché chaque semaine."]}},{"id":"brulee","nom":"Balle brûlée / balle au prisonnier","icon":"🎯","couleur":"#d4a017","intro":"Les livrets brésiliens consacrent des dizaines de fiches à la « queimada » (balle brûlée, chez nous balle au prisonnier). Attention : la traduction automatique l'a parfois rendue par « télécharger » ou « brûlure ». Ce cycle travaille le lancer précis, l'esquive, la réception et la stratégie collective, avec des variantes à rôles qui limitent les éliminations. Toujours utiliser des balles souples et viser sous les épaules.","theorie":[865,855],"materiel":"Balles en mousse ou en caoutchouc souple (6 à 10), cônes et bouteilles, cerceaux, chasubles 4 couleurs, bancs ou tapis pour faire des abris.","lecons":[{"titre":"Lancer et esquiver","obj":["Lancer à une main vers une cible mobile, sous les épaules","Esquiver en restant dans l'espace de jeu","Respecter la règle de sécurité (pas de tir à la tête)"],"ech":[{"n":"La bouteille chanceuse","t":8,"d":"En cercle autour d'un cerceau où tournent une bouteille et une balle. Celui que désigne la bouteille prend la balle et essaie de toucher quelqu'un ; tous s'enfuient dans les limites du terrain de volley.","r":445,"v":null,"c":null,"s":"cercle"},{"n":"Pierre-papier-ciseaux brûlé","t":7,"d":"Par deux, une balle sur un cône entre eux : le gagnant du « chifoumi » prend la balle et essaie de toucher l'autre qui s'enfuit. 5 points gagnants puis on change de partenaire.","r":583,"v":null,"c":null,"s":"duel"}],"corps":[{"n":"Bang-bang","t":10,"d":"Duels dos à dos à 5 m, mains sur la tête ; au sifflet, se retourner, ramasser la balle, lancer et esquiver en même temps.","r":327,"v":null,"c":null,"s":"duel"},{"n":"Brûler dans le cercle","t":15,"d":"4 élèves en colonne (mains sur les hanches) dans un cercle ; 4 autres à l'extérieur se passent la balle pour toucher le dernier de la colonne. On tourne toutes les 2 minutes.","r":323,"v":null,"c":"Je touche le dernier en moins de 10 passes.","s":"cercle2"},{"n":"L'arène","t":15,"d":"Une enceinte de bancs ; en duel ou en équipe, on lance la balle à ras du sol pour toucher les jambes de l'adversaire. Touché = un nouveau concurrent entre.","r":334,"v":null,"c":null,"s":"duel"},{"n":"Le couloir brûlant","t":25,"d":"Une équipe traverse un couloir tracé ; l'autre, à l'extérieur des lignes, lance pour toucher les coureurs. On compte les coureurs arrivés intacts, puis on inverse.","r":328,"v":null,"c":null,"s":"couloir"}],"mission":"Toucher sous les épaules, jamais plus haut"},{"titre":"Viser juste : les cibles","obj":["Lancer précis sur une cible fixe","Protéger une cible","Passer pour se rapprocher de la cible"],"ech":[{"n":"Roulette brûlée","t":8,"d":"Comme la bouteille chanceuse : le désigné fait 3 pas puis lance sur le plus proche.","r":544,"v":null,"c":null,"s":"cercle"},{"n":"ABC brûlé","t":7,"d":"Cercle de 10 : passes en récitant l'alphabet ; celui qui rate la réception doit dire un animal commençant par la lettre avant d'être touché.","r":606,"v":null,"c":null,"s":"cercle"}],"corps":[{"n":"Le cône protégé","t":15,"d":"En duel : chacun protège son cône (sans se coucher devant, à 50 cm minimum) et essaie de faire tomber celui de l'autre à la main.","r":477,"v":null,"c":null,"s":"duel"},{"n":"Brûle le cône protégé","t":20,"d":"Deux équipes ; chaque joueur protège un cône entouré d'un cerceau. Quand son cône tombe, il aide un coéquipier. Les dernières équipes défendent un seul cône ensemble.","r":319,"v":null,"c":"Je renverse un cône par une passe et un tir.","s":"match"},{"n":"Bowling brûlé","t":30,"d":"Chaque équipe a des quilles dans un grand cercle au centre de son camp et 2-3 ballons. On lance depuis son camp ou les côtés du camp adverse pour faire tomber toutes les quilles adverses.","r":325,"v":null,"c":null,"s":"prisonnier"}],"mission":"Protéger son cône"},{"titre":"La balle au prisonnier et ses variantes","obj":["Connaître les règles : touché sans rebond, prisonniers, libération","Attraper la balle pour ne pas être touché","Utiliser ses prisonniers pour attaquer"],"ech":[{"n":"Brûlé : qui en prend le plus","t":8,"d":"Tous au centre du terrain ; deux lanceurs derrière les lignes de fond. Chaque élève touché rejoint l'équipe de celui qui l'a touché. Quelle équipe sera la plus grande ?","r":569,"v":null,"c":null,"s":"couloir"},{"n":"Pierre-papier-ciseaux brûlé","t":7,"d":"Duels de réaction.","r":583,"v":null,"c":null,"s":"duel"}],"corps":[{"n":"Balle au prisonnier inversée","t":20,"d":"Règles classiques (touché sans rebond = prisonnier derrière le camp adverse ; un prisonnier qui touche un adversaire revient). Variante : quand il y a plus de deux prisonniers, le premier revient en changeant d'équipe. Le jeu reste rapide et équilibré.","r":320,"v":null,"c":null,"s":"prisonnier"},{"n":"L'ange gardien","t":20,"d":"Chaque équipe choisit un « ange » qui ne peut jamais être touché : il peut attraper et renvoyer toutes les balles. Ses coéquipiers se protègent derrière lui.","r":684,"v":null,"c":null,"s":"prisonnier"},{"n":"Le diamant","t":25,"d":"Balle au prisonnier avec un cône (le diamant) au milieu de chaque camp : le faire tomber fait gagner la manche. Un « immortel » par équipe protège le diamant. Les prisonniers peuvent aussi viser le diamant.","r":324,"v":null,"c":"Je choisis : viser un joueur ou le diamant.","s":"prisonnier"}],"mission":"L'ange gardien et le diamant"},{"titre":"Jeux à rôles et stratégie","obj":["Élaborer une stratégie d'équipe","Garder un rôle secret","Gérer trois équipes"],"ech":[{"n":"Brûler dans le cercle","t":8,"d":"Rotation rapide toutes les minutes.","r":323,"v":null,"c":null,"s":"cercle2"},{"n":"Bang-bang","t":7,"d":"Duels de réaction, on change d'adversaire à chaque point.","r":327,"v":null,"c":null,"s":"duel"}],"corps":[{"n":"Balle au prisonnier aux échecs","t":25,"d":"Chaque équipe désigne en secret (au professeur) un roi, une reine et un cavalier. Roi touché = fin de la manche ; reine touchée = l'équipe libère tous ses prisonniers adverses ; cavalier touché = il révèle le roi et la reine. Les autres sont des pions.","r":326,"v":null,"c":null,"s":"prisonnier"},{"n":"Brûlé à trois équipes","t":20,"d":"Deux équipes sur les lignes de côté lancent ; la troisième, au centre, ramasse un par un des cônes posés sur les côtés pour les ramener au centre. On compte les cônes récupérés avant que tous soient touchés ; chaque équipe passe au centre.","r":331,"v":null,"c":null,"s":"couloir"},{"n":"Traverse si tu peux","t":20,"d":"Des abris (tapis, bancs, chaises) jalonnent le terrain. Les coureurs traversent en s'abritant pendant que les lanceurs tentent de les toucher. Arrivé intact = on repart pour un nouveau passage.","r":585,"v":null,"c":null,"s":"traverser"}],"mission":"Balle au prisonnier aux échecs"},{"titre":"Les grands jeux à quatre équipes","obj":["Jouer à 4 équipes","Coopérer pour faire progresser la balle sans marcher","Gérer l'effort sur un jeu long"],"ech":[{"n":"Brûlé : qui en prend le plus","t":8,"d":"Comme en leçon 3.","r":569,"v":null,"c":null,"s":"couloir"},{"n":"ABC brûlé","t":7,"d":"Cercles de 10.","r":606,"v":null,"c":null,"s":"cercle"}],"corps":[{"n":"Balle brûlée des quatre coins","t":25,"d":"4 équipes en chasubles, une base (prison) dans chaque coin, un ballon par équipe. Interdit de marcher avec la balle : on se fait des passes. Manches de 3 minutes : l'équipe qui a le moins de joueurs en prison marque.","r":321,"v":null,"c":null,"s":"prisonnier"},{"n":"Brûlé en circuit","t":25,"d":"Une équipe de coureurs en colonne : chacun lance la balle au loin puis fait le tour des cerceaux/cônes. L'autre équipe récupère la balle et se fait des passes pour toucher le coureur. Point aux coureurs qui bouclent le tour.","r":322,"v":null,"c":null,"s":"files"},{"n":"Le couloir brûlant","t":15,"d":"Reprise de la leçon 1 avec deux couloirs en parallèle.","r":328,"v":null,"c":null,"s":"couloir"}],"mission":"Les quatre coins"},{"titre":"Évaluation : tournoi","eval":true,"obj":["Évaluer la précision du lancer, la réception/esquive et le jeu d'équipe","Évaluer le fair-play"],"ech":[{"n":"La bouteille chanceuse","t":8,"d":"Échauffement connu.","r":445,"v":null,"c":null,"s":"cercle"},{"n":"Brûler dans le cercle","t":7,"d":"Rotation rapide.","r":323,"v":null,"c":null,"s":"cercle2"}],"corps":[{"n":"Épreuve 1 – Précision","t":15,"d":"5 lancers sur 3 cônes à 6 m puis 5 lancers sur un camarade mobile (passe dans un couloir) : nombre de réussites.","r":477,"v":null,"c":null,"s":"tir"},{"n":"Épreuve 2 – Esquive et réception","t":10,"d":"Duels « bang-bang » et passages dans l'arène : le professeur observe esquives et réceptions.","r":327,"v":null,"c":null,"s":"duel"},{"n":"Épreuve 3 – Tournoi observé","t":40,"d":"Tournoi de balle au prisonnier « le diamant » ou « l'ange gardien » (au choix de la classe), manches de 5 minutes.","r":324,"v":null,"c":null,"s":"prisonnier"}],"grille":[["Précision",6,"Lancer armé à une main (2) ; cibles fixes touchées : 1-2 = 1, 3 et + = 2 ; cible mobile : 1 = 1, 2 et + = 2"],["Esquive et réception",4,"Esquive en restant dans le terrain (2) ; essaie d'attraper les balles qui arrivent sur lui (2)"],["Jeu d'équipe",4,"Passe à un coéquipier mieux placé avant de lancer (2) ; joue son rôle (1) ; participe à la stratégie (1)"],["Fair-play et sécurité",6,"Dit honnêtement quand il est touché (3) ; vise sous les épaules (3)"]],"mission":"Le tournoi des stratèges"}],"fun":{"titre":"La grande guerre des balles en mousse","pitch":"Ballons en mousse uniquement, et personne n'est éliminé longtemps. Chaque leçon apporte un nouveau personnage : ange gardien, diamant, roi, reine, cavalier.","badges":["Ninja : esquiver 3 tirs de suite","Gardien : attraper une balle à deux mains","Stratège : inventer une tactique d'équipe"]},"niveau":{"facile":["Ballons en mousse uniquement : personne n'a peur d'être touché.","Pas d'élimination définitive : l'élève touché fait un tour de terrain ou passe au « paradis » et revient vite.","Toucher uniquement sous la taille ; le lanceur doit être derrière une ligne.","Terrain plus étroit pour que les lancers des élèves faibles atteignent la cible."],"defi":["Le prisonnier ne revient que s'il attrape un ballon.","Deux ballons en jeu.","Cible mobile à protéger (diamant, ange gardien)."],"idees":["Prévoir un rôle de « médecin » ou de « gardien » à confier en priorité aux élèves les moins à l'aise : ils restent dans le jeu.","Après chaque manche, 30 secondes de concertation d'équipe : on choisit une stratégie et on la dit au professeur.","Faire inventer une variante par groupe en leçon 5 et la jouer."]}},{"id":"opposition","nom":"Jeux d'opposition","icon":"🤼","couleur":"#b5452f","intro":"Cycle de jeux de lutte et d'opposition (préparation au judo, à la lutte et à l'escrime) : saisir, déséquilibrer, pousser, tirer, toucher à distance. Chaque séance commence par le salut et le rappel des règles d'or : pas de coup, pas de saisie à la tête ou au cou, on lâche au signal ou à l'abandon de l'adversaire. Pratiquer sur tapis.","theorie":[863,862],"materiel":"Tapis/tatamis, foulards ou rubans (« queues »), ballons, bâtons en mousse ou manches à balai rembourrés, corde de tir (dont une corde en croix pour 4), coussins, frites en mousse et cartons pour l'escrime.","lecons":[{"titre":"Règles d'or, salut et saisies","obj":["Appliquer le rituel du salut et les règles de sécurité","Saisir et conserver un objet","Accepter le contact dans le respect"],"ech":[{"n":"Arrache la queue","t":8,"d":"Chacun glisse un foulard dans sa ceinture (sans nouer) ; on essaie de voler un maximum de queues tout en protégeant la sienne. On continue même sans queue.","r":1,"v":null,"c":null,"s":"chat"},{"n":"Touche et cours","t":7,"d":"Par deux : le fuyard frappe les mains du chasseur et sprinte vers une ligne ; le chasseur réagit.","r":76,"v":null,"c":null,"s":"course"}],"corps":[{"n":"Rituel et règles d'or","t":5,"d":"Salut debout face à face, rappel des interdits (frapper, tirer les cheveux/vêtements au cou, saisir la tête) et du signal d'arrêt (frapper deux fois le tapis ou dire « stop »).","r":78,"v":null,"c":null,"s":"explication"},{"n":"Opposition des mains","t":10,"d":"Par deux en position de pompe face à face : tirer la main de l'adversaire pour lui faire toucher le sol avec un genou ou le corps.","r":765,"v":null,"c":"Je reste en appui sans poser le genou.","s":"duel"},{"n":"Attrape la queue (duel)","t":15,"d":"En duel dans un carré de tapis : capturer la queue de l'adversaire sans le pousser violemment. Puis en duo contre duo.","r":760,"v":null,"c":null,"s":"duel"},{"n":"La balle d'opposition","t":15,"d":"Par deux, l'un tient un ballon contre lui : l'autre essaie de le récupérer. Le professeur chronomètre ; on salue avant et après chaque duel.","r":78,"v":null,"c":null,"s":"duel"},{"n":"La balle est à moi","t":20,"d":"Tournante de duels d'1 minute : prendre le ballon des mains de l'adversaire, puis le garder. On change de partenaire à chaque manche (catégories de poids proches).","r":761,"v":null,"c":null,"s":"duel"}],"mission":"Voler la queue sans se faire prendre la sienne"},{"titre":"Équilibrer et déséquilibrer","obj":["Garder son équilibre sur une base réduite","Utiliser la poussée et la traction pour déséquilibrer","Chuter sans se faire mal"],"ech":[{"n":"Chifoumi en équipe","t":8,"d":"Deux équipes en file face à une rangée de cerceaux : le gagnant du chifoumi fait avancer toute son équipe d'une case, le perdant retourne au bout de sa file.","r":504,"v":null,"c":null,"s":"files"},{"n":"Opposition des mains","t":7,"d":"Duels courts de 20 secondes en changeant de partenaire.","r":765,"v":null,"c":null,"s":"duel"}],"corps":[{"n":"Combat de coqs","t":15,"d":"Sur un pied, mains sur les épaules de l'adversaire : lui faire poser l'autre pied ou le sortir d'un cercle. Changer de pied d'appui.","r":48,"v":null,"c":"Je gagne en déséquilibrant, pas en poussant d'un coup.","s":"duel"},{"n":"Mini sumo","t":20,"d":"Accroupis face à face (avec ou sans ballon entre les mains) : déséquilibrer l'adversaire pour qu'il touche le tapis. Sur tapis uniquement.","r":764,"v":null,"c":null,"s":"duel"},{"n":"Combat assis pieds contre pieds","t":10,"d":"Assis, plante des pieds contre celle de l'adversaire : lui faire toucher le sol avec les mains ou les pieds.","r":762,"v":null,"c":null,"s":"duel"},{"n":"Le ballon d'opposition","t":20,"d":"Allongés à plat ventre face à face, un ballon entre les deux et une ligne au milieu : pousser le ballon pour qu'il reste le plus longtemps côté adverse ; puis le tirer vers soi.","r":763,"v":null,"c":null,"s":"duel"}],"mission":"Mini sumo et combat de coqs"},{"titre":"Pousser et tirer","obj":["Doser sa force","Utiliser ses appuis et son centre de gravité","Coopérer en équipe de traction"],"ech":[{"n":"Touche et cours","t":7,"d":"Duels de réaction.","r":76,"v":null,"c":null,"s":"course"},{"n":"L'évasion de prison","t":8,"d":"Toute la classe en cercle mains jointes ; un ou deux prisonniers au centre cherchent à sortir en forçant (sans élan) ou en passant dessous.","r":598,"v":null,"c":null,"s":"cercle2"}],"corps":[{"n":"La guerre des bâtons","t":20,"d":"Par deux, chacun tient un bout d'un bâton : tirer l'adversaire dans son cercle (ou hors du tapis). Puis par trois ou plus en cercle, un bâton entre chaque voisin.","r":512,"v":null,"c":"Je garde mes deux pieds dans la zone.","s":"duel"},{"n":"Champion du tir à la corde","t":15,"d":"Dos à dos, une corde passée autour de la taille sur un coussin : chacun avance pour faire tomber les cônes placés devant lui en tirant l'adversaire.","r":540,"v":null,"c":null,"s":"duel"},{"n":"Tir à la corde en croix","t":20,"d":"4 équipes tirent sur une corde en forme de « + » ; il faut atteindre l'objet placé devant soi ou faire sortir les autres du cercle.","r":93,"v":null,"c":null,"s":"duel"},{"n":"Mini sumo (revanche)","t":10,"d":"Tournoi éclair à 3 duels.","r":764,"v":null,"c":null,"s":"duel"}],"mission":"La guerre des bâtons et la corde"},{"titre":"L'escrime : toucher à distance","obj":["Toucher une cible avec la pointe","Se déplacer en garde (avancer, rompre)","Respecter l'adversaire et l'arbitre"],"ech":[{"n":"Arrache la queue","t":7,"d":"Reprise de la leçon 1.","r":1,"v":null,"c":null,"s":"chat"},{"n":"Touche et cours","t":8,"d":"Duels de réaction.","r":76,"v":null,"c":null,"s":"course"}],"corps":[{"n":"Escrime : la cible suspendue","t":15,"d":"Une balle suspendue à hauteur de poitrine : la toucher uniquement avec la pointe de l'« épée » (frite, carton roulé), l'autre main dans le dos, en se déplaçant dans toutes les directions.","r":479,"v":null,"c":"10 touches de la pointe sans toucher avec le côté.","s":"tir"},{"n":"Escrime en duel","t":25,"d":"Bouclier de carton fixé au torse ; épée en carton ou papier journal roulé (ou frite). Fleuret : on touche le torse ; épée : tout le corps. Pas de contact corporel ; peinture lavable ou craie pour marquer les touches.","r":479,"v":null,"c":null,"s":"duel"},{"n":"Tournoi d'escrime","t":25,"d":"Poules de 4 : assauts de 5 touches ou 1 minute. Un élève arbitre et annonce « en garde, prêts, allez ! ».","r":479,"v":null,"c":null,"s":"duel"}],"mission":"Le tournoi d'escrime"},{"titre":"Tournoi multi-ateliers","obj":["Enchaîner différents types d'opposition","Arbitrer un duel","Gérer la victoire et la défaite"],"ech":[{"n":"L'évasion de prison","t":8,"d":"Cercles de 8-10.","r":598,"v":null,"c":null,"s":"cercle2"},{"n":"Opposition des mains","t":7,"d":"Duels de 20 secondes.","r":765,"v":null,"c":null,"s":"duel"}],"corps":[{"n":"Ateliers tournants (4 × 12 min)","t":48,"d":"Atelier 1 : mini sumo. Atelier 2 : combat de coqs. Atelier 3 : la balle d'opposition. Atelier 4 : la guerre des bâtons. Dans chaque atelier, un élève arbitre et note les victoires ; rotation au sifflet.","r":764,"v":null,"c":null,"s":"ateliers"},{"n":"Attrape la queue par équipes","t":17,"d":"Deux équipes en chasubles avec queues : l'équipe qui a le plus de queues à la fin gagne. Reprendre une queue est permis.","r":760,"v":null,"c":null,"s":"chat"}],"mission":"Le grand tour des ateliers"},{"titre":"Évaluation","eval":true,"obj":["Évaluer la maîtrise, la stratégie et le respect des règles dans 3 oppositions","Évaluer le rôle d'arbitre"],"ech":[{"n":"Arrache la queue","t":8,"d":"Échauffement connu.","r":1,"v":null,"c":null,"s":"chat"},{"n":"Opposition des mains","t":7,"d":"Duels de 20 secondes.","r":765,"v":null,"c":null,"s":"duel"}],"corps":[{"n":"Épreuve 1 – Saisir/conserver","t":20,"d":"Duels « la balle est à moi » et « balle d'opposition » (3 duels).","r":761,"v":null,"c":null,"s":"duel"},{"n":"Épreuve 2 – Déséquilibrer","t":20,"d":"Duels mini sumo et combat de coqs (3 duels).","r":764,"v":null,"c":null,"s":"duel"},{"n":"Épreuve 3 – Escrime ou attrape la queue","t":25,"d":"Au choix de l'élève : assaut d'escrime ou duel d'attrape la queue. Chaque élève arbitre aussi un duel.","r":479,"v":null,"c":null,"s":"duel"}],"grille":[["Sécurité et rituel",7,"Salut et règles d'or respectés à chaque duel (4) ; lâche au signal, aucun geste dangereux (3)"],["Efficacité",5,"Reste stable sur ses appuis (2) ; essaie au moins deux actions différentes (2) ; résultats des duels (1)"],["Engagement",4,"Fait tous les duels sans abandonner (2) ; accepte la défaite (2)"],["Arbitrage",4,"Annonce le début et la fin et juge honnêtement (4)"]],"mission":"Le passage de ceinture"}],"fun":{"titre":"L'école des samouraïs","pitch":"Rituel du salut, trois règles d'or et des ceintures de couleur à gagner : blanche (je respecte), jaune (je gagne un duel), verte (j'arbitre juste).","badges":["Ceinture blanche : le salut et les règles d'or à chaque duel","Ceinture jaune : gagner en déséquilibrant","Ceinture verte : arbitrer un duel sans erreur"]},"niveau":{"facile":["Duels entre élèves de taille et de poids proches ; changer souvent de partenaire.","Duels courts (20 à 30 secondes) et départ à genoux pour limiter les chutes.","Le gagnant est celui qui marque des points (toucher, saisir), pas celui qui fait tomber l'autre.","Les élèves inquiets commencent en arbitre ou en coach avant de combattre."],"defi":["Duels debout.","Partenaire plus lourd ou plus fort.","Combiner deux actions (déséquilibrer puis immobiliser)."],"idees":["Rituel fixe à chaque leçon : salut, rappel des 3 règles d'or (je ne fais pas mal, je lâche au signal, je respecte l'arbitre), puis salut final.","Tableau des duels « type tournoi » où on note le nombre de duels faits, pas le nombre de victoires.","Le professeur ou un élève dit « stop » au moindre doute : l'arrêt immédiat est noté."]}},{"id":"adapte","nom":"Sports adaptés et paralympiques","icon":"♿","couleur":"#1f8a9e","intro":"Cycle de découverte des sports paralympiques et adaptés : goalball, volley-ball assis, cécifoot (« cegobol »), boccia, course guidée et volley aveugle. Objectifs moteurs (lancer roulé, défense allongée, jeu au sol) et objectifs d'inclusion : se mettre à la place d'une personne en situation de handicap, guider, faire confiance. Les livrets proposent ces sports dans les trois volumes ; ce cycle les rassemble.","theorie":[865,863],"materiel":"Bandeaux (un par élève), ballons sonores ou ballons glissés dans un sac plastique, cônes, filet de volley baissé à 1,05-1,15 m, ballons de boccia ou balles de tennis de couleur, gouttière (tuyau PVC, deux bâtons), chasubles, une bâche opaque.","lecons":[{"titre":"Guider et faire confiance","obj":["Se déplacer les yeux bandés en sécurité","Guider un partenaire par la voix","Découvrir le goalball"],"ech":[{"n":"Champ de mines guidé","t":8,"d":"Par deux : un élève a les yeux bandés, son guide le fait traverser un terrain parsemé d'objets sans les toucher, à la voix uniquement ; à l'arrivée il lance un cerceau sur une cible.","r":153,"v":null,"c":null,"s":"guide"},{"n":"Chien et chat aveugles","t":7,"d":"En cercle, deux élèves yeux bandés au centre : quand le chien aboie, le chat miaule ; le chien essaie de l'attraper en se guidant au son.","r":92,"v":null,"c":null,"s":"cercle2"}],"corps":[{"n":"Course guidée","t":20,"d":"Reliés par une corde, un coureur yeux bandés et son guide : marche, marche rapide puis course sur ligne droite dégagée, avec quelques obstacles à contourner. On échange les rôles et on discute des sensations.","r":465,"v":null,"c":"Mon guide et moi arrivons sans heurt ni arrêt.","s":"guide"},{"n":"Goalball : le gardien à l'écoute","t":20,"d":"Seul le gardien a les yeux bandés ; un camarade fait rouler le ballon sonore vers le but (2 cônes) ; le gardien le localise à l'oreille et s'allonge pour le stopper. Silence total pendant les tirs.","r":484,"v":null,"c":"J'arrête 3 tirs sur 5.","s":"goalball"},{"n":"Cegobol (cécifoot)","t":25,"d":"Football en binômes : un joueur yeux bandés, son guide le dirige à la voix (droite, gauche, frappe…) sans le toucher. Plusieurs ballons ou plusieurs petits terrains en 1c1 pour éviter les attroupements.","r":656,"v":null,"c":null,"s":"guide"}],"mission":"Traverser le champ de mines avec son guide"},{"titre":"Le goalball","obj":["Lancer le ballon en le faisant rouler vite et bas","Défendre en s'allongeant pour couvrir le but","Respecter le silence"],"ech":[{"n":"Indique ce que tu entends","t":7,"d":"En cercle, assis : un élève montre une partie du corps en en nommant une autre ; le suivant touche la partie entendue (et non vue) et continue.","r":5,"v":null,"c":null,"s":"cercle"},{"n":"Chien et chat aveugles","t":8,"d":"Reprise de la leçon 1.","r":92,"v":null,"c":null,"s":"cercle2"}],"corps":[{"n":"Technique de lancer et de défense","t":20,"d":"Par deux à 9 m : lancer roulé à deux mains puis à une main (comme au bowling) vers un but de 2 cônes ; le défenseur, yeux bandés, se couche sur le côté bras et jambes tendus pour couvrir un maximum d'espace.","r":666,"v":null,"c":null,"s":"tir"},{"n":"Match de goalball 3 contre 3","t":45,"d":"Sur un demi-terrain de volley chacun : 3 défenseurs yeux bandés devant leur but (largeur du terrain), qui deviennent attaquants dès qu'ils récupèrent le ballon. Assistants hors terrain pour guider à la voix et remettre le ballon. Premier à 10 buts.","r":484,"v":null,"c":null,"s":"goalball"}],"mission":"Goalball : défendre avec les oreilles"},{"titre":"Le volley-ball assis","obj":["Jouer en gardant le contact des fesses avec le sol","Se déplacer assis","Renvoyer le ballon par-dessus un filet bas"],"ech":[{"n":"Toquinho assis","t":8,"d":"Cercles de 5 assis au sol : passes hautes et manchettes (ou lancer-attraper) sans faire tomber le ballon.","r":688,"v":null,"c":null,"s":"cercle"},{"n":"Passe le ballon <script>
(function(){
const SRC='<!doctype html>\n'+document.documentElement.outerHTML;
const D=JSON.parse(document.getElementById('data').textContent);
const CY=D.cycles, A=D.acts;
const CODE={basket:'BB',volley:'VB',hand:'HB',foot:'FT',athle:'AT',raquette:'RQ',brulee:'BP',opposition:'OP',adapte:'AD'};
const BOOKS=D.books;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chip=c=>`<span class="chip" style="--c:${c.couleur}">${CODE[c.id]}</span>`;
const sum=a=>a.reduce((s,e)=>s+(e.t||0),0);
const cyc=id=>CY.find(c=>c.id===id);

/* ---------- body formatting of original fiches ---------- */
const LAB=/^(OBJECTIFS?|OBJET DE CONNAISSANCE|COMPÉTENCES?|DESCRIPTION|BUT|VARIATIONS?|Variations?|VARIANTES?|Variantes?|REMARQUES?|Remarques?|OBSERVATIONS?|Observations?|NOTE|Note|ADAPTATIONS?|Adaptations?|SUGGESTIONS?|Suggestions?|MATÉRIEL|Matériel|RÈGLES?|Règles|Activité\s*\d+|Répondre|Objectifs?|Description|But)\b\s*(\d+)?\s*[:.\-–]?/;
function fmtBody(t){
  const lines=t.split('\n').map(l=>l.trim()).filter(Boolean);
  const paras=[];let cur=null;
  for(const l of lines){
    const isLab=LAB.test(l), isBul=/^[•➢\-–*·▪]\s*/.test(l)||/^\d+[\).]\s/.test(l);
    const prevEnd=cur&&/[.!?:;»)]$/.test(cur.txt);
    if(!cur||isLab||isBul||(prevEnd&&/^[A-ZÀ-Ý«"]/.test(l)&&l.length>3)){cur={txt:l,lab:isLab,bul:isBul};paras.push(cur)}
    else cur.txt+=(cur.txt.endsWith('-')?'':' ')+l;
  }
  return paras.map(p=>{
    let h=esc(p.txt).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
    if(p.lab){const m=p.txt.match(LAB);if(m){const lab=esc(m[0].replace(/[:.\-–\s]+$/,''));h=`<span class="lab">${lab}</span>`+h.slice(esc(m[0]).length)}}
    return `<p>${h}</p>`;
  }).join('');
}

/* ---------- sidebar ---------- */
function side(){
  let h=`<div class="brand"><a href="#accueil"><b>Classeur EPS</b><span>Secondaire · 1re et 2e années</span></a></div>
  <div class="nav"><a href="#accueil" data-r="accueil">Accueil et mode d'emploi</a><a href="#conseils" data-r="conseils">Classe de niveau faible à moyen</a><a href="#outils" data-r="outils">Outils : équipes, dé, chrono</a></div>
  <div class="navh">Cycles de 6 leçons</div><div class="nav">`;
  for(const c of CY){
    h+=`<a href="#c-${c.id}" data-r="c-${c.id}" style="--c:${c.couleur}">${chip(c)}<span>${esc(c.nom)}</span></a><div class="sub" data-sub="${c.id}">`;
    c.lecons.forEach((l,i)=>h+=`<a href="#${c.id}-${i+1}" data-r="${c.id}-${i+1}">${l.eval?'Évaluation':'Leçon '+(i+1)}</a>`);
    h+='</div>';
  }
  h+=`</div><div class="navh">Annexes</div><div class="nav">
    <a href="#annexe" data-r="annexe">Toutes les fiches (${A.length})</a>
    <a href="#theorie" data-r="theorie">Fiches théoriques</a>
    <a href="#livrets" data-r="livrets">À propos des livrets</a></div>
    <div class="navh">Personnaliser</div><div class="nav"><a href="#edition" data-r="edition">Mes modifications</a></div>
    <button class="themebtn edtog" id="etog">${EDIT?'Terminer les modifications':'Modifier le contenu'}</button>
    <button class="themebtn" id="thb">Thème : auto</button>`;
  $('#side').innerHTML=h;
  $('#thb').onclick=cycleTheme;applyTheme();
  $('#etog').onclick=toggleEdit;
}
function markNav(r){
  const cid=(r.match(/^(?:c-)?([a-z]+)(?:-\d)?$/)||[])[1];
  document.querySelectorAll('#side a').forEach(a=>a.classList.toggle('on',a.dataset.r===r));
  document.querySelectorAll('.sub').forEach(s=>s.classList.toggle('open',s.dataset.sub===cid));
}
/* ---------- theme ---------- */
const TH=['auto','light','dark'],THN={auto:'auto',light:'clair',dark:'sombre'};
let theme='auto';try{theme=localStorage.getItem('eps-theme')||'auto'}catch(e){}
function applyTheme(){if(theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',theme);const b=$('#thb');if(b)b.textContent='Thème : '+THN[theme]}
function cycleTheme(){theme=TH[(TH.indexOf(theme)+1)%3];try{localStorage.setItem('eps-theme',theme)}catch(e){}applyTheme()}

/* ---------- schémas de terrain (SVG dessinés par le code) ---------- */
const W=320,HH=190;
function rnd(seed){let s=seed%2147483647||7;return()=>(s=s*48271%2147483647)/2147483647}
const f1=n=>Math.round(n*10)/10;
function pl(x,y,t='a',lab=''){
  const cls={a:'pa',b:'pb',x:'px',p:'pp',g:'pg',k:'pk'}[t]||'pa';
  return `<g class="${cls}"><circle cx="${f1(x)}" cy="${f1(y)}" r="7.5"/>${t==='k'?`<path class="band" d="M${f1(x-7)} ${f1(y-1.5)}h14"/>`:`<circle class="eye" cx="${f1(x-2.4)}" cy="${f1(y-1.6)}" r="1.2"/><circle class="eye" cx="${f1(x+2.4)}" cy="${f1(y-1.6)}" r="1.2"/>`}${lab?`<text x="${f1(x)}" y="${f1(y+3.4)}" class="pl">${lab}</text>`:''}</g>`;
}

  return `<figure class="sch" style="--c:${c.couleur}"><svg viewBox="0 0 ${W} ${HH}" role="img" aria-label="Schéma : ${esc(SNAMES[e.s]||'')}">${inner}</svg><figcaption>${esc(SNAMES[e.s]||'')}</figcaption></figure>`;
}

function beep(n=1){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+i*.35;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)}}catch(e){}}
function liveOpen(c,i){
  const l=c.lecons[i],items=[...l.ech.map(e=>[e,'Échauffement']),...l.corps.map(e=>[e,l.eval?'Épreuve':'Corps de leçon'])];
  LIVE={c,i,items,k:0,left:items[0][0].t*60,run:false};beep(0);drawLive();
}
function liveClose(){clearInterval(liveT);LIVE=null;const o=$('#live');if(o)o.remove()}
function fmtT(s){s=Math.max(0,s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function drawLive(){
  let o=$('#live');if(!o){o=document.createElement('div');o.id='live';document.body.appendChild(o)}
  const {c,items,k}=LIVE,[e,part]=items[k],nx=items[k+1];
  o.style.setProperty('--c',c.couleur);
  o.innerHTML=`<div class="lv-in"><div class="lv-top"><span>${esc(c.nom)} · ${part} · ${k+1}/${items.length}</span><button id="lvx" aria-label="Fermer">Fermer</button></div>
  <div class="lv-main"><div><h2>${esc(e.n)}</h2><div class="lv-clock${LIVE.left<=30?' warn':''}" id="lvc">${fmtT(LIVE.left)}</div>
  <div class="lv-btns"><button id="lvp"${k?'':' disabled'}>Précédent</button><button id="lvr" class="pri">${LIVE.run?'Pause':'Démarrer'}</button><button id="lvn">${nx?'Suivant':'Fin'}</button></div>
  <p class="lv-d">${esc(e.d)}</p>${e.c?`<p class="lv-c"><b>Critère :</b> ${esc(e.c)}</p>`:''}${nx?`<p class="lv-next">Ensuite : ${esc(nx[0].n)} (${nx[0].t} min)</p>`:''}</div>
  <div>${schema(e,c,k)}</div></div></div>`;
  $('#lvx').onclick=liveClose;

/* ---------- sauvegarde des modifications ---------- */
const SKEY='eps-edits';
const actsEdited=new Set();
let saveState='';
function snapshot(){
  const acts={};actsEdited.forEach(id=>{acts[id]={t:A[id].t,body:A[id].body}});
  return {rev:D.rev||0,saved:new Date().toISOString(),cycles:D.cycles,general:D.general,home:D.home,acts};
}
// complète une sauvegarde ancienne avec les nouveautés (schémas, missions, fil rouge)
function fillNew(dst,src){if(!dst||!src||typeof dst!=='object'||typeof src!=='object')return;for(const k in src){if(!(k in dst))dst[k]=src[k];else if(typeof dst[k]==='object'&&dst[k]&&typeof src[k]==='object')fillNew(dst[k],src[k])}}
function applySnap(s){
  if(!s)return;
  if(s.cycles){s.cycles.forEach((sc,i)=>{if(D.cycles[i])fillNew(sc,D.cycles[i])});D.cycles.splice(0,D.cycles.length,...s.cycles)}
  if(s.general)D.general=s.general;
  if(s.home)D.home=s.home;
  for(const id in (s.acts||{})){if(A[id]){Object.assign(A[id],s.acts[id]);A[id]._s=nrm(A[id].t+' '+A[id].body);actsEdited.add(+id)}}
}
let saveT=null;
function save(){
  clearTimeout(saveT);saveT=setTimeout(()=>{
    try{localStorage.setItem(SKEY,JSON.stringify(snapshot()));saveState='Enregistré dans ce navigateur'}
    catch(e){saveState='Enregistrement impossible dans ce navigateur : téléchargez le fichier'}
    const s=$('#esave');if(s)s.textContent=saveState;
  },400);
}
function loadSaved(){
  try{const s=JSON.parse(localStorage.getItem(SKEY)||'null');if(s&&(s.rev||0)===(D.rev||0)){applySnap(s);return s.saved}}catch(e){}
  return null;
}
function fullData(){
  const d=JSON.parse(JSON.stringify(D));d.rev=Date.now();
  d.acts.forEach(x=>delete x._s);return d;
}
function content(){
  const s=SRC.indexOf('<!--EPS-'+'START-->'),e=SRC.lastIndexOf('<'+'/body>');
  let c=SRC.slice(s,e).replace(/<\/head>\s*<body>\s*/,'').trimEnd();
  const json=JSON.stringify(fullData()).replace(/<\//g,'<\\/');
  const i=c.indexOf('<script id="data" type="application/json">'),j=c.indexOf('<'+'/script>',i);
  return c.slice(0,i)+'<script id="data" type="application/json">'+json+c.slice(j);
}
function standalone(){return '<!doctype html>\n<html lang="fr">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n</head>\n<body>\n'+content()+'\n</body>\n</html>\n'}
function artHtml(){return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>'+content()+'</body></html>'}
let ART=null,DL=null;
try{if(window.claude&&claude.use){
  claude.use('artifact').then(a=>{ART=a;onCaps()}).catch(()=>{});
  claude.use('downloads').then(d=>{DL=d;onCaps()}).catch(()=>{});
}}catch(e){}
function onCaps(){editBar();if((location.hash||'').slice(1)==='edition')render(true)}
function setMsg(m){const el=$('#emsg');if(el)el.textContent=m;const s=$('#esave');if(s)s.textContent=m}
function publishOnline(){
  if(!ART)return;
  document.querySelectorAll('.epub').forEach(b=>{b.disabled=true;b.textContent='Enregistrement…'});
  ART.publish(artHtml()).then(()=>{try{localStorage.removeItem(SKEY)}catch(e){}setMsg('Enregistré en ligne. La page se recharge avec la nouvelle version.')}).catch(e=>{
    const c=e&&e.code;
    document.querySelectorAll('.epub').forEach(b=>{b.disabled=false;b.textContent='Enregistrer en ligne'});
    if(c==='conflict')setMsg('Une autre version a été enregistrée entre-temps : la page se recharge. Vos modifications restent dans ce navigateur si elles ne sont pas perdues au rechargement.');
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'){ART=null;editBar();setMsg("Cette version en ligne est en lecture seule pour vous : vos modifications restent dans ce navigateur. Utilisez « Télécharger » pour garder un fichier.")}
    else if(c==='too_large')setMsg('Le classeur est trop gros pour être enregistré en ligne. Téléchargez-le plutôt.');
    else setMsg("L'enregistrement en ligne a échoué ("+(c||'erreur')+"). Vos modifications restent dans ce navigateur ; réessayez plus tard.");
  });
}
function download(){
  const fn='classeur-eps-'+new Date().toISOString().slice(0,10)+'.html';
  const html=standalone();
  if(DL){DL.save({filename:fn,data:html}).then(()=>setMsg('Fichier enregistré : '+fn)).catch(e=>{const c=e&&e.code;if(c!=='declined')setMsg("Le téléchargement n'a pas marché ("+(c||'erreur')+"). Utilisez « Copier la sauvegarde ».")});return}
  try{
    const blob=new Blob([html],{type:'text/html'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;
    document.body.appendChild(a);a.click();a.remove();
    setMsg('Téléchargement lancé : '+fn+'. Si rien ne se passe, utilisez « Copier la sauvegarde ».');
  }catch(e){setMsg('Téléchargement impossible ici. Utilisez « Copier la sauvegarde ».')}
}
function copyBackup(){
  const txt=JSON.stringify(snapshot());const msg=$('#emsg');
  const fall=()=>{const ta=$('#ebk');ta.hidden=false;ta.value=txt;ta.select();if(msg)msg.textContent='Copiez le texte sélectionné (Ctrl+C) et collez-le dans un fichier ou un e-mail.'};
  try{navigator.clipboard.writeText(txt).then(()=>{if(msg)msg.textContent='Sauvegarde copiée. Collez-la dans un fichier texte ou un e-mail pour la garder.'},fall)}catch(e){fall()}
}
function importFile(f){
  const msg=$('#emsg');const r=new FileReader();
  r.onload=()=>{
    try{
      let txt=String(r.result),s;
      if(/<script id="data"/.test(txt)){const m=txt.match(/<script id="data" type="application\/json">([\s\S]*?)<\/script>/);const d=JSON.parse(m[1]);
        s={cycles:d.cycles,general:d.general,home:d.home,acts:{}};d.acts.forEach((x,k)=>{if(A[k]&&(A[k].t!==x.t||A[k].body!==x.body))s.acts[k]={t:x.t,body:x.body}})}
      else s=JSON.parse(txt);
      applySnap(s);save();side();render(true);if($('#emsg'))$('#emsg').textContent='Modifications importées.';
    }catch(e){if(msg)msg.textContent="Ce fichier n'est pas une sauvegarde du classeur."}
  };r.readAsText(f);
}
let resetArm=false;
function resetAll(){
  const b=$('#ereset');

  location.reload();
}
function editionPage(){
  return `<div class="crumb"><a href="#accueil">Accueil</a>/<span>Mes modifications</span></div><div class="kicker">Personnaliser le classeur</div><h1>Mes modifications</h1>
  <p class="lead">Tout le contenu peut être changé : titres, objectifs, exercices, durées, variantes, critères, grilles, conseils et fiches de l'annexe.</p>
  <ol class="steps">
   <li><div>Cliquez sur <b>Modifier le contenu</b> (menu, en bas). Les textes modifiables sont soulignés en pointillés : cliquez dedans et écrivez.</div></li>
   <li><div>Des boutons apparaissent pour <b>ajouter, monter ou supprimer</b> un exercice, un objectif, un critère de grille ou un conseil. Chaque leçon a aussi une case <b>Mes notes</b>. Si le total d'une leçon n'est plus 80 minutes, un avertissement s'affiche.</div></li>
   <li><div>Les modifications sont <b>enregistrées automatiquement dans ce navigateur</b>. Pour les garder pour de bon : sur la version en ligne, cliquez sur <b>Enregistrer en ligne</b> ; avec le fichier, cliquez sur <b>Télécharger le classeur modifié</b> pour obtenir un nouveau fichier .html qui contient tout.</div></li>
  </ol>
  ${ART?`<div class="note">Vous êtes sur la <b>version en ligne</b> : <b>Enregistrer en ligne</b> remplace la page par votre version modifiée, et vous la retrouvez sur tous vos appareils. Les anciennes versions restent dans l'historique de l'artifact.</div>`:''}
  <div class="eactions">

  </div>

  <p class="muted">${savedAt?'Dernières modifications enregistrées le '+new Date(savedAt).toLocaleString('fr-BE')+'.':'Aucune modification enregistrée dans ce navigateur pour l\'instant.'}</p>`;

function bindEdition(){
  const g=id=>document.getElementById(id);
  if(g('etog2'))g('etog2').onclick=toggleEdit;
  if(g('edl'))g('edl').onclick=download;
  if(g('epub'))g('epub').onclick=publishOnline;
  if(g('ecp'))g('ecp').onclick=copyBackup;

function toggleEdit(){EDIT=!EDIT;document.body.classList.toggle('editing',EDIT);side();render(true)}
function bindEdits(){
  const pg=$('#page');
  pg.querySelectorAll('.ed').forEach(el=>{
    if(!EDIT){el.removeAttribute('contenteditable');return}
    const k=el.dataset.k;
    if(el.closest('a')){return}
    el.setAttribute('contenteditable',k==='html'?'true':'plaintext-only');
    if(el.contentEditable!=='plaintext-only'&&k!=='html')el.setAttribute('contenteditable','true');
    el.spellcheck=true;
    el.oninput=()=>{
      let v;
      if(k==='html')v=el.innerHTML;
      else if(k==='num'){v=parseInt(el.innerText.replace(/\D/g,''),10)||0}
      else{v=el.innerText.replace(/ /g,' ');if(k!=='ml')v=v.replace(/\n+/g,' ');v=v.trim();if(v===''&&/\.(v|c|notes)$/.test(el.dataset.p))v=null}
      setP(el.dataset.p,v);
      const m=el.dataset.p.match(/^acts\.(\d+)/);if(m){actsEdited.add(+m[1]);A[+m[1]]._s=nrm(A[+m[1]].t+' '+A[+m[1]].body)}
      save();
    };
    if(k==='num')el.onblur=()=>render(true);
    el.onkeydown=e=>{if(e.key==='Enter'&&k!=='ml'&&k!=='html'){e.preventDefault();el.blur()}};
  });
  pg.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{getP(b.dataset.add).push(TPL[b.dataset.tpl]());save();render(true)});
  pg.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(!b.dataset.arm){b.dataset.arm=1;b.textContent='Confirmer ?';setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent='Supprimer'}},3000);return}
    const a=P(b.dataset.del),j=a.pop();getP(a.join('.')).splice(j,1);save();render(true)});
  pg.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const a=P(b.dataset.up),j=a.pop();if(!j)return;const arr=getP(a.join('.'));[arr[j-1],arr[j]]=[arr[j],arr[j-1]];save();render(true)});
}
function editBar(){

  document.body.classList.remove('menu');window.scrollTo(0,keep?y:0);
}

side();applyTheme();

    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && navigator.onLine) reg.update().catch(() => {}); });

}

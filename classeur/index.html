<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Classeur EPS</title>
<meta name="theme-color" content="#14211d">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icones/classeur-192.png">
<link rel="apple-touch-icon" href="../icones/eps-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EPS ultime">
<style>/* Pas de zoom quand on tape vite deux fois sur un bouton (iPhone) */
html,body,button,a,input,label,select{touch-action:manipulation}
/* Retour vers l'accueil de l'appli EPS */
.eps-retour{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;max-width:680px;margin:0 auto;padding:10px 16px 0;font:600 14px system-ui,-apple-system,sans-serif;color:#5d6a60;text-decoration:none}
@media (prefers-color-scheme:dark){.eps-retour{color:#9aa89e}}</style>
<style>@media (max-width:860px){.eps-larg{display:none!important}}</style>
</head>
<body>
<a class="eps-retour eps-larg" href="../" style="position:fixed;top:0;right:0;z-index:40;background:var(--panel);border-radius:0 0 0 12px;padding:8px 14px">‹ Mes applis</a>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --bg:#f4f6f5; --panel:#ffffff; --ink:#17201d; --ink2:#4d5a55; --ink3:#7b8782;
  --line:#dde3e0; --line2:#c6cfcb; --side:#14211d; --sideink:#d9e3df; --sideink2:#8fa39b; --sidehi:#22362f;
  --accent:#d9572b; --accentink:#ffffff; --ech:#e9a23b; --corps:#2f7d6b; --evalc:#b03a48;
  --soft:#eef2f0; --mark:#fff2b3;--floor:#eaf1e8;--lines:#b7c8bd;--teamb:#38443f;--pass:#2f6fd1;--cone:#f08a24;--zone:#dce7df;--mat:#d9e4f2;--sand:#f0e0b0;--fun:#ffd23f;
  --f-head:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --panel:#161e1b; --ink:#e4ebe8; --ink2:#a9b6b1; --ink3:#7d8b86;
  --line:#26312d; --line2:#34413c; --side:#0a100e; --sideink:#d0dbd6; --sideink2:#7e918a; --sidehi:#1b2a25;
  --accent:#f0794d; --accentink:#1a0d07; --ech:#e6a94f; --corps:#4fb39a; --evalc:#e0697a;
  --soft:#1c2522; --mark:#5a4d12;--floor:#1a2420;--lines:#3b4c45;--teamb:#c5d1cb;--pass:#7fa9ff;--cone:#f5a04a;--zone:#24322d;--mat:#22303d;--sand:#4a4128;--fun:#ffd23f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --panel:#161e1b; --ink:#e4ebe8; --ink2:#a9b6b1; --ink3:#7d8b86;
  --line:#26312d; --line2:#34413c; --side:#0a100e; --sideink:#d0dbd6; --sideink2:#7e918a; --sidehi:#1b2a25;
  --accent:#f0794d; --accentink:#1a0d07; --ech:#e6a94f; --corps:#4fb39a; --evalc:#e0697a;
  --soft:#1c2522; --mark:#5a4d12;--floor:#1a2420;--lines:#3b4c45;--teamb:#c5d1cb;--pass:#7fa9ff;--cone:#f5a04a;--zone:#24322d;--mat:#22303d;--sand:#4a4128;--fun:#ffd23f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:700;line-height:1.1;text-wrap:balance;margin:0}
.wrap{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
/* sidebar */
#side{background:var(--side);color:var(--sideink);position:sticky;top:0;height:100vh;overflow-y:auto;padding-block:20px 40px;padding-inline:0}
.brand{padding:0 20px 18px;border-bottom:1px solid var(--sidehi);margin-bottom:10px}
.brand a{text-decoration:none;display:block}
.brand b{font-family:var(--f-head);font-size:28px;letter-spacing:.02em;text-transform:uppercase;display:block;line-height:1}
.brand span{font-size:13px;color:var(--sideink2)}
.navh{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sideink2);padding:14px 20px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 20px;text-decoration:none;font-size:15px;border-left:3px solid transparent}
.nav a:hover{background:var(--sidehi)}
.nav a.on{background:var(--sidehi);border-left-color:var(--c,var(--accent))}
.chip{display:inline-grid;place-items:center;min-width:28px;height:22px;padding:0 4px;border-radius:4px;background:var(--c);color:#fff;font-family:var(--f-head);font-size:13px;font-weight:700;letter-spacing:.04em;flex:none}
.sub{display:none;padding-bottom:6px}
.sub.open{display:block}
.sub a{padding:4px 20px 4px 58px;font-size:14px;color:var(--sideink2)}
.sub a.on{color:var(--sideink)}
#top{display:none}
main{min-width:0;padding-block:32px 80px;padding-inline:clamp(16px,4vw,56px)}
.page{max-width:900px}
.crumb{font-size:13px;color:var(--ink3);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px}
.crumb a{color:var(--ink2)}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--c,var(--accent))}
h1{font-size:clamp(34px,5vw,50px);text-transform:uppercase;letter-spacing:.01em;margin:4px 0 12px}
h2{font-size:26px;text-transform:uppercase;letter-spacing:.02em;margin:36px 0 12px}
h3{font-size:21px;margin:0}
p{margin:0 0 12px;max-width:68ch}
.lead{font-size:18px;color:var(--ink2);max-width:66ch}
.muted{color:var(--ink3)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}
.pill{font-size:13px;padding:2px 10px;border:1px solid var(--line2);border-radius:99px;color:var(--ink2);background:var(--panel);white-space:nowrap}
.pill.solid{background:var(--c,var(--accent));border-color:transparent;color:#fff}
/* grids */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);padding:16px;text-decoration:none;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--line2);border-top-color:var(--c)}
.card small{color:var(--ink3);font-size:13px}
.box{background:var(--panel);border:1px solid var(--line);padding:16px 18px}
.box h4{font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
ul.obj{margin:0;padding-left:20px}
ul.obj li{margin:2px 0}
/* lesson list in cycle */
.lessons{display:grid;gap:8px;counter-reset:l}
.lrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:12px 16px;text-decoration:none}
.lrow:hover{border-color:var(--line2)}
.lrow .num{font-family:var(--f-head);font-size:34px;font-weight:700;color:var(--c);line-height:1}
.lrow .t{font-weight:600}
.lrow .s{font-size:14px;color:var(--ink3)}
.lrow.ev .num{color:var(--evalc)}
/* timeline */
.tl{display:flex;height:34px;border:1px solid var(--line2);margin:8px 0 4px;overflow:hidden;background:var(--panel)}
.tl a{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;text-decoration:none;border-right:1px solid var(--panel);min-width:0;overflow:hidden;white-space:nowrap;font-variant-numeric:tabular-nums}
.tl a.e{background:var(--ech)} .tl a.k{background:var(--corps)} .tl a.v{background:var(--evalc)}
.tlx{position:relative;height:18px;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
/* items */
.part{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:3px solid var(--pc);padding-bottom:6px;margin:34px 0 14px}
.part h2{margin:0;color:var(--pc)}
.part span{font-family:var(--f-head);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--pc)}
.item{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.item .min{font-family:var(--f-head);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.item .min small{display:block;font-size:12px;letter-spacing:.1em;color:var(--ink3);font-family:var(--f-body);font-weight:500;text-transform:uppercase;margin-top:3px}
.item h3{margin-bottom:6px}
.item .row{font-size:15px;margin-top:8px;padding-left:12px;border-left:3px solid var(--line2)}
.item .row b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);display:block}
.item .row.c{border-left-color:var(--corps)}
.src{font-size:13px;margin-top:8px;color:var(--ink3)}
.src a{color:var(--ink2)}
table{border-collapse:collapse;width:100%;background:var(--panel)}
.tw{overflow-x:auto;border:1px solid var(--line)}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600}
td.pts{font-family:var(--f-head);font-size:22px;font-weight:700;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.tot td{border-bottom:0;background:var(--soft);font-weight:600}
td.score{width:90px}
td.score span{display:inline-block;border-bottom:1px solid var(--ink3);width:40px;height:20px}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:40px;flex-wrap:wrap}
.pn a{background:var(--panel);border:1px solid var(--line);padding:10px 14px;text-decoration:none;font-size:15px;max-width:100%}
.pn a small{display:block;color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
/* catalogue */
.filters{display:grid;gap:10px;background:var(--panel);border:1px solid var(--line);padding:14px;margin-bottom:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
.filters input[type=search]{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);border-radius:4px}
.frow{display:flex;flex-wrap:wrap;gap:6px}
.frow button{font:inherit;font-size:13px;padding:3px 10px;border:1px solid var(--line2);background:transparent;color:var(--ink2);border-radius:99px;cursor:pointer}
.frow button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{font-size:14px;color:var(--ink3);margin-bottom:8px}
.alist{display:grid;border-top:1px solid var(--line)}
.arow{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.arow:hover{background:var(--soft)}
.arow .bk{font-family:var(--f-head);font-weight:700;font-size:15px;width:26px;height:26px;display:grid;place-items:center;border:1.5px solid var(--ink3);color:var(--ink2);border-radius:50%}
.arow .t{font-weight:600}
.arow .g{font-size:13px;color:var(--ink3)}
.used{color:var(--accent);font-weight:600}
.more{margin-top:14px;font:inherit;padding:8px 16px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);cursor:pointer}
.fiche{background:var(--panel);border:1px solid var(--line);padding:20px 22px;max-width:76ch}
.fiche p{max-width:none}
.fiche .lab{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600;display:block;margin-top:6px}
.fiche a{color:var(--accent);word-break:break-all}
.adapt{margin-top:12px;background:var(--panel);border:1px solid var(--line);padding:12px 18px}
.adapt summary{cursor:pointer;font-weight:600;color:var(--corps)}
.adapt .two{margin-bottom:6px}
.box.lv{border-left:4px solid var(--corps)}
.ed:empty::before{content:attr(data-ph);color:var(--ink3);font-style:italic}
body.editing .ed[contenteditable]{outline:none;border-bottom:1.5px dashed var(--accent);cursor:text;border-radius:2px;display:inline}
body.editing .ed.ml[contenteditable]{display:block}
body.editing .ed[contenteditable]:focus{background:var(--mark);border-bottom-style:solid}
body.editing .ed:empty{display:inline-block;min-width:12ch}
@media (max-width:600px){#ebar span{display:none}#ebar{gap:8px 12px}#ebar a{flex:1}}
.eb{font:inherit;font-size:12px;padding:1px 8px;margin:2px 4px 2px 0;border:1px solid var(--line2);background:var(--panel);color:var(--ink2);cursor:pointer;vertical-align:middle;letter-spacing:0;text-transform:none;font-weight:500}
.eb.del{color:var(--evalc);border-color:var(--evalc)}
.eb.add{display:block;margin:10px 0;padding:6px 12px;font-size:14px;color:var(--corps);border:1.5px dashed var(--corps);background:transparent}
.ebar{margin-top:8px}
.warnp{border-color:var(--evalc)!important;color:var(--evalc)!important;font-weight:600}
.mynotes{margin-top:12px;border-left:4px solid var(--accent)}
.eactions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.ebtn{font:inherit;font-size:15px;padding:9px 14px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);cursor:pointer;display:inline-block}
.ebtn.pri{background:var(--accent);color:var(--accentink);border-color:var(--accent);font-weight:600}
.ebtn.danger{color:var(--evalc);border-color:var(--evalc)}
.edtog{display:block;margin-top:10px;border-color:var(--accent)!important;color:var(--sideink)!important}
#ebar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;background:var(--accent);color:var(--accentink);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));font-size:14px}
#ebar span{flex:1;min-width:0;opacity:.9}
#ebar a{color:inherit;font-weight:600}
#ebar button{font:inherit;font-weight:600;background:var(--accentink);color:var(--accent);border:0;padding:5px 12px;cursor:pointer}
body.editing main{padding-bottom:120px}
.note{border-left:4px solid var(--accent);background:var(--panel);padding:12px 16px;font-size:15px;max-width:70ch;margin:16px 0}
.steps{counter-reset:s;display:grid;gap:10px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px}
.steps li::before{content:counter(s);font-family:var(--f-head);font-weight:700;font-size:22px;color:var(--accent)}
.kb{display:flex;gap:6px;flex-wrap:wrap}
mark{background:var(--mark);color:inherit}
.themebtn{margin:18px 20px 0;font:inherit;font-size:13px;background:transparent;border:1px solid var(--sidehi);color:var(--sideink2);padding:5px 10px;cursor:pointer}

/* schémas */
.sch{margin:0;background:var(--panel);border:1px solid var(--line);padding:6px;border-radius:6px}
.sch svg{width:100%;height:auto;display:block}
.sch figcaption{font-size:12px;color:var(--ink3);text-align:center;margin-top:2px}
.floor{fill:var(--floor)} .ln2{stroke:var(--lines);stroke-width:1.5;fill:none} .nof{fill:none}
.ln3{stroke:var(--ink2);stroke-width:2;stroke-dasharray:5 4} .fin{stroke:var(--ink);stroke-width:4;stroke-dasharray:4 4}
.pa circle:first-child,.pk circle:first-child{fill:var(--c);stroke:var(--panel);stroke-width:1.5}
.pb circle:first-child{fill:var(--teamb);stroke:var(--panel);stroke-width:1.5}
.px circle:first-child{fill:var(--evalc);stroke:var(--panel);stroke-width:1.5}
.pp circle:first-child{fill:var(--ech);stroke:var(--panel);stroke-width:1.5}
.pg circle:first-child{fill:var(--corps);stroke:var(--panel);stroke-width:1.5}
.eye{fill:var(--panel)} .band{stroke:var(--ink);stroke-width:3.5}
.pl{font:700 9px var(--f-body);fill:var(--panel);text-anchor:middle}
.ball{fill:var(--fun);stroke:var(--ink);stroke-width:.8}
.cone{fill:var(--cone)} .hoop{fill:none;stroke:var(--accent);stroke-width:2}
.ar .ln{fill:none;stroke:var(--ink2);stroke-width:1.6} .ar .hd{fill:var(--ink2)}
.ar.pass .ln{stroke:var(--pass);stroke-dasharray:4 3} .ar.pass .hd{fill:var(--pass)}
.ar.shot .ln{stroke:var(--evalc);stroke-width:2;stroke-dasharray:2 3} .ar.shot .hd{fill:var(--evalc)}
.goal{fill:var(--ink2)} .net{stroke:var(--ink);stroke-width:3} .post{fill:var(--ink)}
.wall{fill:var(--ink3)} .zone{fill:var(--zone);stroke:var(--lines);stroke-width:1} .mat{fill:var(--mat);stroke:var(--lines)}
.sand{fill:var(--sand)} .hurdle{stroke:var(--ech);stroke-width:3.5;stroke-linecap:round} .foot{fill:var(--ink3)}
.rope{stroke:var(--ink);stroke-width:2} .seat{stroke:var(--ink3);stroke-width:3;stroke-linecap:round}
.board{fill:var(--ink)} .bw{fill:var(--panel)!important;font-weight:700}
.lb{font:500 10px var(--f-body);fill:var(--ink2)} .lb.c,.c{text-anchor:middle} .big{font:700 22px var(--f-head);fill:var(--ink3)} .dim{stroke:var(--ink3)}
.ibody.has{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,280px);gap:18px;align-items:start}
.ischema{min-width:0}
.ssel{display:block;font-size:13px;margin-top:6px;color:var(--ink2)} .ssel select{font:inherit;max-width:100%}
.slegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);margin:16px 0 0;padding:10px 12px;background:var(--panel);border:1px dashed var(--line2)}
.slegend span{display:inline-flex;align-items:center;gap:6px} .slegend svg{height:14px;width:auto}
.slegend .pa circle{fill:var(--accent)}
/* ludique */
.mission{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--c);color:#fff;padding:12px 16px;margin:6px 0 14px;border-radius:10px;transform:rotate(-.6deg);box-shadow:4px 4px 0 var(--ink)}
.mission .mtag{font-family:var(--f-head);font-size:15px;text-transform:uppercase;letter-spacing:.08em;background:var(--fun);color:#1b1b1b;padding:2px 10px;border-radius:99px;font-weight:700}
.mission .mtext{font-family:var(--f-head);font-size:24px;font-weight:700;line-height:1.15;flex:1;min-width:200px}
.mission .mfil{font-size:13px;opacity:.9}
.mission .ed:empty::before{color:#fff}
.golive{margin:0 0 14px}
.filrouge{margin-top:22px;border:3px solid var(--c);border-radius:12px;padding:16px 18px;background:var(--panel);box-shadow:5px 5px 0 var(--c)}
.filrouge .mtag{font-family:var(--f-head);font-size:14px;text-transform:uppercase;letter-spacing:.1em;background:var(--fun);color:#1b1b1b;padding:2px 10px;border-radius:99px;font-weight:700}
.filrouge h2{margin:10px 0 6px;color:var(--c)}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.badge{display:flex;gap:10px;align-items:center;background:var(--soft);padding:10px 12px;border-radius:10px}
.medal{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;font-size:12px;color:#1b1b1b;font-weight:700;border:3px dashed rgba(0,0,0,.25)}
.medal.m0{background:#e2a46b} .medal.m1{background:#cfd6dc} .medal.m2{background:#ffd23f}
.cfun{color:var(--c);font-family:var(--f-head);font-size:17px}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.team{border-top:6px solid var(--c);background:var(--soft);padding:10px 12px;border-radius:8px}
.team b{display:block;font-family:var(--f-head);font-size:19px;color:var(--c);margin-bottom:4px}
.dice-res{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:16px;border-left:5px solid var(--c);padding-left:14px}
#live{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lv-in{max-width:1100px;margin:0 auto}
.lv-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--ink2);border-bottom:4px solid var(--c);padding-bottom:8px}
.lv-top button,.lv-btns button{font:inherit;font-weight:600;padding:8px 16px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);cursor:pointer;border-radius:6px}
.lv-btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.lv-btns .pri{background:var(--c);color:#fff;border-color:var(--c)}
.lv-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:16px;align-items:start}
.lv-main h2{font-size:clamp(28px,4vw,44px);margin:0}
.lv-clock{font-family:var(--f-head);font-weight:700;font-size:clamp(70px,14vw,150px);line-height:1;font-variant-numeric:tabular-nums;color:var(--c)}
.lv-clock.warn{color:var(--evalc)}
.lv-d{font-size:19px} .lv-c{font-size:17px} .lv-next{color:var(--ink3)}
@media (max-width:760px){.ibody.has,.dice-res,.lv-main{grid-template-columns:minmax(0,1fr)}.mission .mtext{font-size:20px}}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  #side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:20;transform:translateX(-100%);transition:transform .2s;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  body.menu #side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  #top{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--side);color:var(--sideink);padding:10px 16px}
  #top button{font:inherit;font-weight:600;background:transparent;color:var(--sideink);border:1px solid var(--sidehi);padding:5px 12px;cursor:pointer}
  #top b{font-family:var(--f-head);text-transform:uppercase;font-size:20px;letter-spacing:.03em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main{padding-block:20px 60px}
  .item{grid-template-columns:48px minmax(0,1fr);gap:12px}
  .item .min{font-size:24px}
  .lrow{grid-template-columns:40px minmax(0,1fr)}
  .lrow .pill{display:none}
  .filters{position:static}
}

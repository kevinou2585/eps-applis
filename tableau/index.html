<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Classement Koh-Lanta</title>
<meta name="theme-color" content="#e8590c">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icones/koh-lanta-192.png">
<link rel="apple-touch-icon" href="../icones/eps-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EPS ultime">
<style>
:root{--bg:#eef3f1;--surface:#fff;--ink:#12302b;--muted:#5c716c;--line:#d3dfdb;--torch:#e8590c;--gold:#d9a400;--silver:#8a979b;--bronze:#b5652b;--fair:#2f7d5b;--red:#c92a2a;
  --jaune:#f1c232;--jaune-ink:#2b2100;--vert:#2f9e5b;--vert-ink:#fff;--bleu:#2f6fd0;--bleu-ink:#fff;--rouge:#d64545;--rouge-ink:#fff;--tout:#12302b;--tout-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0d1a18;--surface:#152724;--ink:#e6f0ed;--muted:#93a8a2;--line:#28403b;--tout:#e6f0ed;--tout-ink:#0d1a18;color-scheme:dark}}
*{box-sizing:border-box}
html,body,button,a{touch-action:manipulation}
body{margin:0 auto;max-width:600px;padding:0 16px calc(32px + env(safe-area-inset-bottom,0px));background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.retour{display:inline-block;padding:10px 0 0;font-weight:600;font-size:14px;color:var(--muted);text-decoration:none}
header{position:sticky;top:0;background:var(--bg);padding:8px 0 10px;display:grid;gap:10px;z-index:2}
.haut{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font-size:22px}
.maj{color:var(--muted);font-size:12px;text-align:right}
.maj button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 10px;font:inherit;font-weight:600}
.onglets{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.onglets button{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 2px;font:inherit;font-weight:700;font-size:13px}
.onglets button[aria-pressed="true"]{background:var(--c);color:var(--ci);border-color:var(--c)}
.ligne{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
.ligne.r1{box-shadow:inset 4px 0 0 var(--gold)}.ligne.r2{box-shadow:inset 4px 0 0 var(--silver)}.ligne.r3{box-shadow:inset 4px 0 0 var(--bronze)}
.rg{font-weight:800;text-align:center;color:var(--muted)}
.nm{min-width:0;overflow-wrap:anywhere}
.nm small{display:block;color:var(--muted);font-size:12px}
.pt{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.vide,.note{color:var(--muted);font-size:14px}
.err{color:var(--red);font-size:14px}
h2{font-size:15px;margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lecons{display:grid;gap:4px;font-size:14px}
.lecons div{display:flex;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
h3{margin:22px 0 8px;font-size:17px}
.titre{text-align:center;margin:6px 0 4px}.titre b{font-size:22px;display:block}.titre span{color:var(--muted);font-size:14px}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin-top:12px}
.marche{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;display:grid;gap:2px}
.marche .m{font-size:28px}.marche b{font-size:14px;overflow-wrap:anywhere}.marche small{color:var(--muted);font-size:12px}
.marche.p1{padding-top:22px;border-color:var(--gold)}.marche.p2{padding-top:14px}.marche.p3{padding-top:8px}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
th,td{padding:8px 6px;text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--line)}
tbody tr+tr td{border-top:1px solid var(--line)}td.n{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gc{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:12px;padding:10px;font-size:14px;display:grid;gap:4px}
.gc b{font-size:13px;text-transform:uppercase;letter-spacing:.04em}.gc small{color:var(--muted);font-size:12px}
.gc div{display:flex;justify-content:space-between;gap:6px}.gc div span:first-child{overflow-wrap:anywhere;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:20px}.stats span{color:var(--muted);font-size:12px}
.rouge{border-color:var(--red)!important}
.bareme{color:var(--muted);font-size:13px;text-align:center;margin-top:18px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 4px}
.actions button{border:0;border-radius:12px;padding:13px 8px;font:inherit;font-weight:700;background:var(--ink);color:var(--bg)}
.actions button+button{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
#impression{display:none}
@page{size:A4;margin:12mm}
@media print{
  body{max-width:none;padding:0;background:#fff;color:#000}
  body>*:not(#impression){display:none!important}
  #impression{display:block;color:#000;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .pg{page-break-after:always;break-after:page;height:270mm;display:flex;flex-direction:column;gap:5mm}
  .pg:last-child{page-break-after:auto;break-after:auto}
  .bandeau{background:#000;color:#fff;text-align:center;padding:4mm;border-radius:3mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bandeau b{display:block;font-size:26pt}.bandeau span{font-size:12pt}
  .ip-titre{background:#333;color:#fff;font-weight:800;font-size:15pt;padding:2.5mm 4mm;border-radius:2mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ip-pod{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4mm;align-items:end}
  .ip-pod div{border:0.6mm solid #000;border-radius:3mm;text-align:center;padding:3mm;display:grid;gap:1mm}
  .ip-pod .m{font-size:28pt}.ip-pod b{font-size:15pt}.ip-pod small{font-size:11pt}
  .ip-pod .p1{padding-top:12mm;background:#ddd;-webkit-print-color-adjust:exact;print-color-adjust:exact}.ip-pod .p2{padding-top:7mm}
  .ip-t{width:100%;border-collapse:collapse;font-size:13pt;border:0.4mm solid #000}
  .ip-t th{background:#000;color:#fff;text-align:left;padding:2mm 3mm;font-size:10pt;text-transform:uppercase;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ip-t td{padding:2.2mm 3mm;border-top:0.3mm solid #999}.ip-t td.n{text-align:center;font-weight:800}
  .ip-t tr:nth-child(even) td{background:#eee;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ip-gr{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
  .ip-gr div{border:0.5mm solid #000;border-radius:2mm;padding:3mm;font-size:12pt;display:grid;gap:1mm}
  .ip-gr b{font-size:13pt}.ip-gr p{margin:0;display:flex;justify-content:space-between}
  .ip-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;text-align:center}
  .ip-stats div{border:0.5mm solid #000;border-radius:2mm;padding:3mm}.ip-stats b{display:block;font-size:18pt}
  .ip-bar{text-align:center;font-size:10pt;margin-top:auto}
}
</style>
</head>
<body>
<a class="retour" href="../koh-lanta/">‹ Koh-Lanta Arène</a>
<header>
  <div class="haut"><h1>🏆 Classement Koh-Lanta</h1><div class="maj"><button id="maj" type="button">↻ Actualiser</button><div id="etat"></div></div></div>
  <div class="onglets" id="onglets"></div>
</header>
<main id="vue"></main>
<div id="impression"></div>
<script>
const GR = [['top','Fiche','tout'],['Jaune','Jaune','jaune'],['Vert','Vert','vert'],['Bleu','Bleu','bleu'],['Rouge','Rouge','rouge']];
const CLE = {Jaune:'jaune', Vert:'vert', Bleu:'bleu', Rouge:'rouge'};
const lire = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
let onglet = lire('kl-tableau-onglet') || 'top';
let D = null; try { D = JSON.parse(lire('kl-tableau-cache')); } catch(e){}
let listes = {}; try { listes = JSON.parse(lire('kl-listes-v1')) || {}; } catch(e){}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Totaux par élève, à partir du journal des fins de leçon (même barème que l'Excel).
function totaux(){
  const t = {};
  const el = (n, g) => t[n] || (t[n] = {n, g, p:0, o:0, a:0, b:0, f:0, r:0});
  Object.keys(CLE).forEach(g => (listes[CLE[g]] || []).forEach(n => el(n, g)));
  (D?.lignes || []).forEach(l => { const x = el(l.eleve, l.groupe); x.p += Number(l.points) || 0;
    if (l.place === '1er') x.o++; else if (l.place === '2e') x.a++; else if (l.place === '3e') x.b++;
    else if (l.place === 'Fair-play') x.f++; else if (l.place === 'Perturbateur') x.r++; });
  return Object.values(t);
}
function detail(x){
  const s = [x.o ? `🥇${x.o}` : '', x.a ? `🥈${x.a}` : '', x.b ? `🥉${x.b}` : '', x.f ? `🤝${x.f}` : '', x.r ? `🟥${x.r}` : ''].filter(Boolean).join(' ');
  return s;
}
function liste(xs, avecGroupe){
  xs.sort((a, b) => b.p - a.p || a.n.localeCompare(b.n, 'fr'));
  return xs.map(x => { const rg = xs.filter(y => y.p > x.p).length + 1;
    return `<div class="ligne ${x.p > 0 && rg <= 3 ? 'r' + rg : ''}"><span class="rg">${rg}</span><span class="nm">${esc(x.n)}<small>${avecGroupe ? esc(x.g) + (detail(x) ? ' · ' : '') : ''}${detail(x)}</small></span><span class="pt">${x.p}</span></div>`; }).join('');
}
const MED = ['🥇','🥈','🥉'];
const rangs = xs => xs.map(x => ({...x, rg: xs.filter(y => y.p > x.p).length + 1}));
function fiche(T){
  const auj = new Date().toLocaleDateString('fr-BE');
  const marques = T.filter(x => x.p > 0).sort((a, b) => b.p - a.p || a.n.localeCompare(b.n, 'fr'));
  const top = rangs(marques).slice(0, 10);
  let h = `<div class="titre"><b>🏝️ KOH-LANTA EPS</b><span>Classement au ${auj}</span></div>`;
  // podium general
  const pod = [top[1], top[0], top[2]];
  h += `<div class="podium">${pod.map((x, i) => { const cl = ['p2','p1','p3'][i], m = ['🥈','🥇','🥉'][i];
    return x ? `<div class="marche ${cl}"><span class="m">${m}</span><b>${esc(x.n)}</b><small>${esc(x.g)} · ${x.p} pts</small></div>` : `<div class="marche ${cl}"><span class="m">${m}</span><small>—</small></div>`; }).join('')}</div>`;
  // top 10
  h += `<h3>🏆 Top 10 général</h3>` + (top.length ? `<table><thead><tr><th>Rang</th><th>Élève</th><th>Groupe</th><th>Pts</th></tr></thead><tbody>${top.map(x => `<tr><td class="n">${x.rg}</td><td>${esc(x.n)}</td><td>${esc(x.g)}</td><td class="n">${x.p}</td></tr>`).join('')}</tbody></table>` : '<p class="vide">Personne n\'a encore de points.</p>');
  // top 3 de chaque groupe
  h += `<h3>🔥 Le top 3 de chaque groupe</h3><div class="gr">${Object.keys(CLE).map(g => {
    const tous = T.filter(x => x.g === g), m = rangs(tous.filter(x => x.p > 0).sort((a, b) => b.p - a.p || a.n.localeCompare(b.n, 'fr'))).slice(0, 3);
    return `<div class="gc" style="--c:var(--${CLE[g]})"><b>Groupe ${g}</b><small>${tous.filter(x => x.p > 0).length} / ${tous.length} ont marqué</small>${m.map(x => `<div><span>${MED[x.rg - 1] || x.rg + '.'} ${esc(x.n)}</span><span>${x.p}</span></div>`).join('') || '<small>—</small>'}</div>`; }).join('')}</div>`;
  // fair-play
  const fp = T.filter(x => x.f > 0).sort((a, b) => b.f - a.f || a.n.localeCompare(b.n, 'fr'));
  const fpr = fp.map(x => ({...x, rg: fp.filter(y => y.f > x.f).length + 1})).slice(0, 3);
  h += `<h3>🤝 Top 3 fair-play & meilleur coéquipier</h3>` + (fpr.length ? `<table><thead><tr><th>Rang</th><th>Élève</th><th>Groupe</th><th>Distinctions</th></tr></thead><tbody>${fpr.map(x => `<tr><td class="n">${x.rg}</td><td>${esc(x.n)}</td><td>${esc(x.g)}</td><td class="n">${x.f}</td></tr>`).join('')}</tbody></table>` : '<p class="vide">Pas encore de distinction fair-play : à vous de jouer !</p>');
  // chiffres
  const total = T.reduce((t, x) => t + x.p, 0);
  h += `<div class="stats"><div><b>${total}</b><span>points distribués</span></div><div><b>${marques.length} / ${T.length}</b><span>élèves ont déjà marqué</span></div><div><b>${marques.length < 10 ? 0 : top[top.length - 1].p} pts</b><span>pour entrer dans le Top 10</span></div></div>`;
  // cartons rouges : tous ceux au maximum
  const mx = Math.max(0, ...T.map(x => x.r)), rc = T.filter(x => mx > 0 && x.r === mx).sort((a, b) => a.n.localeCompare(b.n, 'fr'));
  h += `<h3>⛔ Carton rouge : il faut se ressaisir !</h3>` + (rc.length ? `<table class="rouge"><thead><tr><th>Groupe</th><th>Élève</th><th>Cartons</th></tr></thead><tbody>${rc.slice(0, 3).map(x => `<tr><td>${esc(x.g)}</td><td>${esc(x.n)}</td><td class="n">${x.r}</td></tr>`).join('')}</tbody></table>${rc.length > 3 ? `<p class="note">… et ${rc.length - 3} autre${rc.length - 3 > 1 ? 's' : ''}</p>` : ''}` : '<p class="vide">Aucun carton rouge. Bravo !</p>');
  h += `<p class="bareme">Barème : 1er = 5 pts · 2e = 3 pts · 3e = 1 pt<br>Fair-play / meilleur coéquipier = +3 pts · Carton rouge = −3 pts</p>`;
  return h;
}
// Affiche noir et blanc, 2 pages A4, comme les onglets « Affiche N&B » de l'Excel.
function imprimer(T){
  const auj = new Date().toLocaleDateString('fr-BE');
  const tri = xs => xs.sort((a, b) => b.p - a.p || a.n.localeCompare(b.n, 'fr'));
  const marques = tri(T.filter(x => x.p > 0)), top = rangs(marques).slice(0, 10);
  const pod = [top[1], top[0], top[2]].map((x, i) => `<div class="${['p2','p1','p3'][i]}"><span class="m">${['🥈','🥇','🥉'][i]}</span><b>${x ? esc(x.n) : '—'}</b><small>${x ? esc(x.g) + ' · ' + x.p + ' pts' : ''}</small></div>`).join('');
  const t10 = `<table class="ip-t"><thead><tr><th>Rang</th><th>Élève</th><th>Groupe</th><th>Points</th></tr></thead><tbody>${top.map(x => `<tr><td class="n">${x.rg}</td><td>${esc(x.n)}</td><td>${esc(x.g)}</td><td class="n">${x.p}</td></tr>`).join('') || '<tr><td colspan="4">Personne n\'a encore de points.</td></tr>'}</tbody></table>`;
  const grp = Object.keys(CLE).map(g => { const tous = T.filter(x => x.g === g), m = rangs(tri(tous.filter(x => x.p > 0))).slice(0, 3);
    return `<div><b>GROUPE ${g.toUpperCase()}</b><small>${tous.filter(x => x.p > 0).length} / ${tous.length} ont marqué</small>${m.map(x => `<p><span>${MED[x.rg - 1] || x.rg + '.'} ${esc(x.n)}</span><span>${x.p} pts</span></p>`).join('') || '<p>—</p>'}</div>`; }).join('');
  const fp = T.filter(x => x.f > 0).sort((a, b) => b.f - a.f || a.n.localeCompare(b.n, 'fr')), fpr = fp.map(x => ({...x, rg: fp.filter(y => y.f > x.f).length + 1})).slice(0, 3);
  const mx = Math.max(0, ...T.map(x => x.r)), rc = T.filter(x => mx > 0 && x.r === mx).sort((a, b) => a.n.localeCompare(b.n, 'fr'));
  const total = T.reduce((t, x) => t + x.p, 0);
  document.getElementById('impression').innerHTML =
    `<section class="pg"><div class="bandeau"><b>🏝️ KOH-LANTA EPS</b><span>Classement au ${auj}</span></div><div class="ip-pod">${pod}</div><div class="ip-titre">🏆 TOP 10 GÉNÉRAL</div>${t10}</section>` +
    `<section class="pg"><div class="ip-titre">🔥 LE TOP 3 DE CHAQUE GROUPE</div><div class="ip-gr">${grp}</div>` +
    `<div class="ip-titre">🤝 TOP 3 FAIR-PLAY & MEILLEUR COÉQUIPIER</div><table class="ip-t"><thead><tr><th>Rang</th><th>Élève</th><th>Groupe</th><th>Distinctions</th></tr></thead><tbody>${fpr.map(x => `<tr><td class="n">${x.rg}</td><td>${esc(x.n)}</td><td>${esc(x.g)}</td><td class="n">${x.f}</td></tr>`).join('') || '<tr><td colspan="4">Pas encore de distinction fair-play : à vous de jouer !</td></tr>'}</tbody></table>` +
    `<div class="ip-stats"><div><b>${total}</b>points distribués</div><div><b>${marques.length} / ${T.length}</b>élèves ont déjà marqué</div><div><b>${marques.length < 10 ? 0 : top[top.length - 1].p} pts</b>pour entrer dans le Top 10</div></div>` +
    `<div class="ip-titre">⛔ CARTON ROUGE : IL FAUT SE RESSAISIR !</div><table class="ip-t"><thead><tr><th>Groupe</th><th>Élève</th><th>Cartons rouges</th></tr></thead><tbody>${rc.slice(0, 3).map(x => `<tr><td>${esc(x.g)}</td><td>${esc(x.n)}</td><td class="n">${x.r}</td></tr>`).join('') || '<tr><td colspan="3">Aucun carton rouge. Bravo !</td></tr>'}${rc.length > 3 ? `<tr><td colspan="3">… et ${rc.length - 3} autre${rc.length - 3 > 1 ? 's' : ''}</td></tr>` : ''}</tbody></table>` +
    `<p class="ip-bar">Barème : 1er = 5 pts · 2e = 3 pts · 3e = 1 pt · Fair-play / meilleur coéquipier = +3 pts · Carton rouge = −3 pts</p></section>`;
  setTimeout(() => window.print(), 50);
}
// Tableau général en fichier pour Excel (une ligne par élève).
function sauver(T){
  const lignes = [['Groupe','Élève','Points','1er','2e','3e','Fair-play','Cartons rouges']];
  Object.keys(CLE).forEach(g => T.filter(x => x.g === g).sort((a, b) => b.p - a.p || a.n.localeCompare(b.n, 'fr')).forEach(x => lignes.push([g, x.n, x.p, x.o, x.a, x.b, x.f, x.r])));
  const csv = '﻿' + lignes.map(l => l.map(v => /[;"\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : v).join(';')).join('\r\n');
  const d = new Date(), nom = `Classement Koh-Lanta ${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}.csv`;
  const f = new File([csv], nom, {type: 'text/csv'});
  if (navigator.canShare && navigator.canShare({files: [f]})) { navigator.share({files: [f], title: nom}).catch(() => {}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = nom; document.body.appendChild(a); a.click(); a.remove();
}
function rendre(){
  document.getElementById('onglets').innerHTML = GR.map(([id, l, c]) => `<button type="button" data-o="${id}" style="--c:var(--${c});--ci:var(--${c}-ink)" aria-pressed="${onglet === id}">${l}</button>`).join('');
  document.querySelectorAll('#onglets button').forEach(b => b.onclick = () => { onglet = b.dataset.o; try { localStorage.setItem('kl-tableau-onglet', onglet); } catch(e){} rendre(); window.scrollTo(0, 0); });
  const v = document.getElementById('vue');
  if (!D){ v.innerHTML = '<p class="vide">Pas encore de résultats. Ils arrivent quand un prof touche « 📤 Envoyer au tableau général » en fin de leçon Koh-Lanta.</p>'; return; }
  const T = totaux();
  if (onglet === 'top'){ v.innerHTML = fiche(T) + `<div class="actions"><button type="button" id="imprimer">🖨️ Imprimer l'affiche</button><button type="button" id="sauver">💾 Sauvegarder</button></div><p class="note" style="text-align:center">Affiche noir et blanc sur 2 pages A4. Pour un PDF, choisis « Enregistrer en PDF » dans la fenêtre d'impression.</p>`;
    document.getElementById('imprimer').onclick = () => imprimer(T);
    document.getElementById('sauver').onclick = () => sauver(T);
    return; }
  const tous = T.filter(x => x.g === onglet);
  v.innerHTML = `<p class="note" style="margin:4px 0 10px">${tous.filter(x => x.p > 0).length} / ${tous.length} ont marqué · 🥇🥈🥉 places · 🤝 fair-play · 🟥 cartons</p>` + (liste(tous, false) || '<p class="vide">Aucun élève.</p>');
  const lec = {}; D.lignes.filter(l => l.groupe === onglet).forEach(l => { lec[l.date] = (lec[l.date] || 0) + 1; });
  const jours = Object.keys(lec).sort().reverse();
  if (jours.length) v.innerHTML += `<h2>Leçons envoyées</h2><div class="lecons">${jours.map(j => `<div><span>${new Date(j + 'T12:00').toLocaleDateString('fr-BE', {weekday:'long', day:'numeric', month:'long'})}</span><span>${lec[j]} ligne${lec[j] > 1 ? 's' : ''}</span></div>`).join('')}</div>`;
}
async function charger(){
  const u = lire('eps-script'), c = lire('eps-code'), etat = document.getElementById('etat');
  if (!u || !c){ etat.innerHTML = '<span class="err">Ouvre l\'accueil EPS avec internet</span>'; return; }
  if (!navigator.onLine){ etat.textContent = D ? 'Hors ligne · dernière version' : 'Hors ligne'; return; }
  etat.textContent = 'Mise à jour…';
  try {
    const o = await (await fetch(u + '?code=' + encodeURIComponent(c))).json();
    if (!o.ok) throw new Error(o.err);
    D = {lignes: o.lignes, t: Date.now()};
    try { localStorage.setItem('kl-tableau-cache', JSON.stringify(D)); } catch(e){}
    etat.textContent = 'À jour'; rendre();
  } catch(e){ etat.innerHTML = '<span class="err">Mise à jour impossible</span>'; }
}
document.getElementById('maj').onclick = charger;
rendre(); charger();
if ('serviceWorker' in navigator && navigator.onLine) navigator.serviceWorker.register('../sw.js').catch(() => {});
